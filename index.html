        };

        /* ═══════════════════════════════════════════════════
           9. КОМПОНЕНТ: ЭКРАН АВТОПОДБОРА
        ═══════════════════════════════════════════════════ */
        const AutoSelectScreen = ({
            monthData,
            profile,
            addresses = [],
            onUpdateAddresses,
            onSaveAddressesCloud,
            allMonths = {},
            onApplyDistribution,
            onApplyRoutes,
            onUpdateMonth,
            distanceCache = {},
            onUpdateDistanceCache,
            settings = {},
            cloudStatus,
            onExportExcel,
            userPhone,
            t
        }) => {
            const year  = monthData.year;
            const month = monthData.month;
            const totalDays = daysInMonth(year, month);
            const activeSeason = monthData.seasonOverride || getSeason(year, month);
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            /* ── Способ расчёта: по остатку топлива ('fuel') или по одометру на конец месяца ('odometer') ── */
            const [goalType, setGoalType] = useState('fuel');
            const [targetFuel, setTargetFuel] = useState('');
            const [isTargetFuelFocused, setIsTargetFuelFocused] = useState(false);
            const [targetOdometer, setTargetOdometer] = useState('');
            const [fitRoutesToMonthlyOdometer, setFitRoutesToMonthlyOdometer] = useState(true);
            const [routePreviewMap, setRoutePreviewMap] = useState(null);
            const [isGeneratingRoutes, setIsGeneratingRoutes] = useState(false);
            const [generationProgress, setGenerationProgress] = useState('');
            const [hasAnyOsrmRoutes, setHasAnyOsrmRoutes] = useState(false);
            const [isCalculatingRouteKm, setIsCalculatingRouteKm] = useState(false);

            const odometerStart = Number(monthData.odometerStart) || 0;
            const fuelStart     = Number(monthData.fuelStart) || 0;
            const totalRefuels  = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const workdays      = monthData.workdays || {};
            const workdayKeys   = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const kmFromRoutes  = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);

            /* ── Дни с загруженными маршрутами, у которых пробег ещё не рассчитан ── */
            const uncalculatedRouteDays = workdayKeys.filter(k => {
                const d = workdays[k];
                return (d.trips || []).length > 0 && (Number(d.tripKm) || 0) === 0;
            });

            let target = 0;
            let requiredFuel = 0;
            let requiredKm = 0;
            let projectedFuelEnd = 0;
            let missingKm = 0;
            let targetTotal = 0;

            if (goalType === 'fuel') {
                target = parseFuelInput(targetFuel);
                requiredFuel = fuelStart + totalRefuels - target;
                requiredKm = activeNorm > 0 ? (requiredFuel / activeNorm * 100) : 0;
                missingKm = Math.max(0, requiredKm - kmFromRoutes);
                targetTotal = Math.round(missingKm);
                projectedFuelEnd = target;
            } else {
                const targetOdoVal = Number(targetOdometer) || 0;
                requiredKm = targetOdoVal > 0 ? Math.max(0, targetOdoVal - odometerStart) : 0;
                requiredFuel = activeNorm > 0 ? (requiredKm * activeNorm / 100) : 0;
                projectedFuelEnd = fuelStart + totalRefuels - requiredFuel;
                missingKm = Math.max(0, requiredKm - kmFromRoutes);
                targetTotal = Math.round(missingKm);
                target = Math.max(0, projectedFuelEnd);
            }

            /* ── Стили текущей темы оформления ── */
            const accentClass = t(
                'text-[#FFB300]','text-amber-700','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );
            const cardClass = t(
                'bg-[#1E2125] border-[#3A3D42]',
                'bg-gray-50 border-gray-200',
                'bg-pink-50 border-pink-200',
                'bg-blue-50/50 border-blue-200',
                'bg-emerald-50 border-emerald-200',
                'bg-[#F5F2EE] border-[#D7CCC8]',
                'bg-gray-50 border-gray-200'
            );
            const inputSm = t(
                'bg-[#282B30] border-gray-700 text-white placeholder-gray-500',
                'bg-white border-gray-300 text-gray-900 placeholder-gray-400',
                'bg-pink-50 border-pink-200 text-pink-900 placeholder-pink-400',
                'bg-blue-50 border-blue-200 text-blue-900 placeholder-blue-400',
                'bg-emerald-50 border-emerald-200 text-emerald-900 placeholder-emerald-400',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723] placeholder-[#A1887F]',
                'bg-white border-gray-300 text-gray-900 placeholder-gray-400'
            );
            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );
            const btnSecondary = t(
                'bg-[#282B30] text-gray-300 hover:bg-[#32363C] border border-gray-700',
                'bg-white text-gray-700 hover:bg-gray-50 border border-gray-300',
                'bg-pink-100 text-pink-800 hover:bg-pink-200 border border-pink-300',
                'bg-blue-100 text-blue-800 hover:bg-blue-200 border border-blue-300',
                'bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300',
                'bg-[#EFEBE9] text-[#4E342E] hover:bg-[#D7CCC8] border border-[#BCAAA4]',
                'bg-gray-100 text-gray-800 hover:bg-gray-200 border border-gray-300'
            );
            const listRowHover = t(
                'hover:bg-[#282B30] border-gray-800',
                'hover:bg-gray-100 border-gray-200',
                'hover:bg-pink-100 border-pink-200',
                'hover:bg-blue-100 border-blue-200',
                'hover:bg-emerald-100 border-emerald-200',
                'hover:bg-[#EFEBE9] border-[#D7CCC8]',
                'hover:bg-gray-100 border-gray-200'
            );

            /* ── Состояния справочника адресов ── */
            const [isAddressesOpen, setIsAddressesOpen] = useState(false);
            const [newAddr, setNewAddr] = useState('');
            const [newNote, setNewNote] = useState('');
            const [isBulkAdd, setIsBulkAdd] = useState(false);
            const [bulkText, setBulkText] = useState('');

            /* ── Состояния распределения пробега ── */
            const [selectedDays, setSelectedDays] = useState({});
            const [minKm, setMinKm] = useState(70);
            const [maxKm, setMaxKm] = useState(160);
            const [distributionMap, setDistributionMap] = useState(null);

            /* ── Дни с заправками > 0 л (обязательные) ── */
            const refuelDates = useMemo(() => {
                const s = new Set();
                (monthData.refuels || []).forEach(r => {
                    if (r.date && (Number(r.liters) || 0) > 0) {
                        s.add(r.date);
                    }
                });
                return s;
            }, [monthData.refuels]);

            /* ── Итоговый список выбранных дней ── */
            const selectedKeys = useMemo(() => {
                const list = [];
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (refuelDates.has(key) || selectedDays[key]) {
                        list.push(key);
                    }
                }
                return list;
            }, [totalDays, year, month, refuelDates, selectedDays]);

            /* ── Переключение дня ── */
            const toggleDay = (dateKey) => {
                if (refuelDates.has(dateKey)) return;
                setSelectedDays(prev => {
                    const next = { ...prev };
                    if (next[dateKey]) delete next[dateKey];
                    else next[dateKey] = true;
                    return next;
                });
                setDistributionMap(null);
            };

            /* ── Автовыбор оптимального количества дней с учётом топлива ── */
            const handleAutoSelectDays = () => {
                if (targetTotal <= 0) {
                    alert('Недостающий пробег равен 0 км.');
                    return;
                }
                const lo = Math.max(1, Number(minKm) || 70);
                const hi = Math.max(lo, Number(maxKm) || 160);
                const avg = (lo + hi) / 2;
                const optimalCount = Math.min(totalDays, Math.max(1, Math.ceil(targetTotal / avg)));

                const newSelected = {};
                refuelDates.forEach(k => { newSelected[k] = true; });

                // Просчитываем доступное топливо хронологически и определяем доступные дни
                const availableDays = [];
                let runningFuel = Number(monthData.fuelStart) || 0;
                const minFuelNeeded = activeNorm > 0 ? ((lo * activeNorm / 100) + 0.1) : 0;

                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    const refuelLiters = (monthData.refuels || [])
                        .filter(r => r.date === k)
                        .reduce((s, r) => s + (Number(r.liters) || 0), 0);
                    runningFuel += refuelLiters;

                    const dayObj = workdays[k];
                    const existingKm = Number(dayObj?.tripKm) || 0;
                    const hasTrips = (dayObj?.trips || []).length > 0;
                    const hasRefuel = refuelLiters > 0;

                    const isFuelSufficient = activeNorm > 0 ? (runningFuel >= minFuelNeeded) : true;

                    // Если день ещё не выбран (не день с заправкой > 0 л) и в нём нет реальных поездок
                    if (!newSelected[k] && !hasTrips) {
                        if (isFuelSufficient) {
                            availableDays.push(k);
                        }
                    }

                    // Вычитаем существующий расход от имеющихся поездок дня
                    if (existingKm > 0 && activeNorm > 0) {
                        runningFuel = Math.max(0, runningFuel - (existingKm * activeNorm / 100));
                    }
                }

                let currentCount = Object.keys(newSelected).length;
                if (currentCount < optimalCount) {
                    const needed = optimalCount - currentCount;
                    if (needed > 0 && availableDays.length > 0) {
                        const step = availableDays.length / needed;
                        for (let i = 0; i < needed; i++) {
                            const idx = Math.min(availableDays.length - 1, Math.floor(i * step));
                            newSelected[availableDays[idx]] = true;
                        }
                    }
                }

                setSelectedDays(newSelected);
                setDistributionMap(null);
            };

            /* ── Алгоритм распределения пробега с хронологической защитой топлива ── */
            const generateDistribution = () => {
                if (targetTotal <= 0) {
                    alert('Недостающий пробег равен 0 км.');
                    return;
                }
                if (selectedKeys.length === 0) {
                    alert('Выберите хотя бы один день для распределения пробега.');
                    return;
                }

                const lo = Math.max(1, Number(minKm) || 70);
                const hi = Math.max(lo, Number(maxKm) || 160);

                // Базовые случайные веса для выбранных дней
                const randoms = selectedKeys.map(() => lo + Math.random() * (hi - lo));
                const sumR = randoms.reduce((a, b) => a + b, 0);
                const rawAlloc = randoms.map(r => Math.round((r * targetTotal) / sumR));

                // 1. Хронологический проход с отслеживанием runningFuel и ограничением maxAddable
                const alloc = {};
                selectedKeys.forEach(k => { alloc[k] = 0; });

                let runningFuel = Number(monthData.fuelStart) || 0;
                let unallocated = targetTotal;

                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    const dayRefuels = (monthData.refuels || [])
                        .filter(r => r.date === k)
                        .reduce((s, r) => s + (Number(r.liters) || 0), 0);
                    runningFuel += dayRefuels;

                    const dayObj = workdays[k];
                    const existingKm = Number(dayObj?.tripKm) || 0;

                    if (selectedKeys.includes(k)) {
                        const idx = selectedKeys.indexOf(k);
                        const desiredKm = rawAlloc[idx] || 0;

                        // Ограничение по реальному остатку топлива в баке (чтобы остаток оставался >= 0.100 л)
                        const maxTotalKmByFuel = activeNorm > 0
                            ? Math.floor(Math.max(0, runningFuel - 0.1) / activeNorm * 100)
                            : Infinity;
                        const maxAddable = Math.max(0, maxTotalKmByFuel - existingKm);

                        // Назначаем не более maxAddable и не более unallocated
                        const give = Math.min(desiredKm, maxAddable, unallocated);
                        alloc[k] = give;
                        unallocated -= give;

                        const spent = activeNorm > 0 ? ((existingKm + give) * activeNorm / 100) : 0;
                        runningFuel = Math.max(0, runningFuel - spent);
                    } else {
                        const spent = activeNorm > 0 ? (existingKm * activeNorm / 100) : 0;
                        runningFuel = Math.max(0, runningFuel - spent);
                    }
                }

                // 2. Доводка остатка unallocated / невязки delta по ±1 км с хронологической проверкой
                let currentSum = Object.values(alloc).reduce((a, b) => a + b, 0);
                let delta = targetTotal - currentSum;

                // Функция проверки запаса топлива от дня k до конца месяца
                const checkHeadroomAhead = (currentAlloc, fromDateKey) => {
                    let simFuel = Number(monthData.fuelStart) || 0;
                    let minReserve = Infinity;
                    for (let d = 1; d <= totalDays; d++) {
                        const dk = toDateStr(year, month, d);
                        const ref = (monthData.refuels || [])
                            .filter(r => r.date === dk)
                            .reduce((s, r) => s + (Number(r.liters) || 0), 0);
                        simFuel += ref;

                        const baseKm = Number(workdays[dk]?.tripKm) || 0;
                        const addKm = Number(currentAlloc[dk]) || 0;
                        const spent = activeNorm > 0 ? ((baseKm + addKm) * activeNorm / 100) : 0;
                        simFuel -= spent;

                        if (dk >= fromDateKey) {
                            const reserve = simFuel - 0.1;
                            if (reserve < minReserve) minReserve = reserve;
                        }
                    }
                    return minReserve;
                };

                let loopSafety = 0;
                while (delta !== 0 && loopSafety < 10000) {
                    loopSafety++;
                    if (delta > 0) {
                        // Ищем дни, где добавление 1 км не уронит топливо ниже 0.1 л ни в один из последующих дней
                        const eligible = [];
                        for (const k of selectedKeys) {
                            const reserve = checkHeadroomAhead(alloc, k);
                            const fuelCost1Km = activeNorm > 0 ? (1 * activeNorm / 100) : 0;
                            if (reserve >= fuelCost1Km) {
                                eligible.push(k);
                            }
                        }
                        if (eligible.length === 0) break; // топливный бак физически исчерпан
                        // Предпочитаем дни, где пробег меньше hi
                        const preferred = eligible.filter(k => alloc[k] < hi);
                        const pool = preferred.length > 0 ? preferred : eligible;
                        const chosen = pool[Math.floor(Math.random() * pool.length)];
                        alloc[chosen] += 1;
                        delta -= 1;
                    } else {
                        // delta < 0: уменьшаем только у дней, где пробег > 1 км
                        const eligible = selectedKeys.filter(k => alloc[k] > 1);
                        if (eligible.length === 0) break;
                        const chosen = eligible[Math.floor(Math.random() * eligible.length)];
                        alloc[chosen] -= 1;
                        delta += 1;
                    }
                }

                setDistributionMap(alloc);
            };

            /* ── Пересчёт цепочки для предпросмотра с остатками топлива ── */
            const previewRecalced = useMemo(() => {
                if (!distributionMap) return null;
                const tempWd = { ...workdays };
                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    if (!tempWd[k]) {
                        tempWd[k] = { isWorkday: false, tripKm: 0, odometerStart: 0, odometerEnd: 0, fuelStart: 0, fuelEnd: 0, trips: [] };
                    } else {
                        tempWd[k] = { ...tempWd[k] };
                    }
                }
                Object.entries(distributionMap).forEach(([k, add]) => {
                    const base = Number(tempWd[k]?.tripKm) || 0;
                    tempWd[k].isWorkday = true;
                    tempWd[k].tripKm = Math.round((base + Number(add)) * 10) / 10;
                });

                return recalcWorkdays(
                    tempWd,
                    monthData.odometerStart,
                    monthData.fuelStart,
                    monthData.refuels || [],
                    activeNorm
                );
            }, [distributionMap, workdays, monthData, activeNorm, totalDays, year, month]);

            const hasNegativeFuelInPreview = useMemo(() => {
                if (!previewRecalced) return false;
                return Object.values(previewRecalced).some(d => d.isWorkday && (Number(d.fuelEnd) || 0) < -0.0001);
            }, [previewRecalced]);

            /* ── Применение распределения (Страховка 1: мгновенный сброс предпросмотра) ── */
            const handleApply = () => {
                if (!distributionMap) return;
                const mapToApply = distributionMap;
                setDistributionMap(null);
                onApplyDistribution(mapToApply);
            };

            /* ── Добавление одного адреса в справочник ── */
            const handleAddAddress = () => {
                const trimmedAddr = newAddr.trim();
                const trimmedNote = newNote.trim();
                if (!trimmedAddr) return;

                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const cleanInput = trimmedAddr.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                if (cleanStart && cleanInput === cleanStart) {
                    alert('Этот адрес совпадает с вашей точкой старта. В личный справочник добавляются только точки поездок.');
                    return;
                }

                const exists = addresses.some(a => (a.address || '').trim().toLowerCase() === trimmedAddr.toLowerCase());
                if (exists) {
                    alert('Такой адрес уже есть в справочнике.');
                    return;
                }

                const updated = [...addresses, { address: trimmedAddr, note: trimmedNote }];
                onUpdateAddresses(updated, true);
                setNewAddr('');
                setNewNote('');
            };

            /* ── Массовая вставка адресов ── */
            const handleBulkAdd = () => {
                if (!bulkText.trim()) return;
                const lines = bulkText.split('\n');
                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const existingSet = new Set(addresses.map(a => (a.address || '').trim().toLowerCase()));

                const addedList = [];
                const seenInBatch = new Set();

                lines.forEach(rawLine => {
                    const trimmed = rawLine.trim();
                    if (!trimmed) return;
                    const clean = trimmed.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                    if (cleanStart && clean === cleanStart) return;
                    const low = trimmed.toLowerCase();
                    if (existingSet.has(low) || seenInBatch.has(low)) return;

                    seenInBatch.add(low);
                    addedList.push({ address: trimmed, note: '' });
                });

                if (addedList.length === 0) {
                    alert('Новых адресов не найдено (все адреса пустые, уже есть в справочнике или совпадают с точкой старта).');
                    return;
                }

                const updated = [...addresses, ...addedList];
                onUpdateAddresses(updated, true);
                setBulkText('');
                setIsBulkAdd(false);
                alert(`Добавлено новых адресов: ${addedList.length}`);
            };

            /* ── Пополнение из всех загруженных Маршрутов ── */
            const handleImportFromRoutes = () => {
                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const existingSet = new Set(addresses.map(a => (a.address || '').trim().toLowerCase()));
                const collected = [];
                const seen = new Set();

                Object.values(allMonths || {}).forEach(m => {
                    if (!m || !m.workdays) return;
                    Object.values(m.workdays).forEach(day => {
                        if (!day || !Array.isArray(day.trips)) return;
                        day.trips.forEach(trip => {
                            const rawAddr = (trip.address || '').trim();
                            if (!rawAddr) return;
                            const clean = rawAddr.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                            if (cleanStart && clean === cleanStart) return;
                            const low = rawAddr.toLowerCase();
                            if (existingSet.has(low) || seen.has(low)) return;

                            seen.add(low);
                            collected.push({
                                address: rawAddr,
                                note: trip.taskType || trip.time ? [trip.taskType, trip.time].filter(Boolean).join(', ') : ''
                            });
                        });
                    });
                });

                if (collected.length === 0) {
                    alert('В загруженных маршрутах не найдено новых адресов для добавления.');
                    return;
                }

                const updated = ensureDefaultOfficeAddress([...addresses, ...collected], profile?.startPoint);
                onUpdateAddresses(updated, true);
                alert(`Успешно добавлено ${collected.length} новых адресов из маршрутов!`);
            };

            /* ── Удаление адреса из справочника ── */
            const handleDeleteAddress = (idx) => {
                const item = addresses[idx];
                const cleanItem = (item?.address || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const cleanOffice = DEFAULT_OFFICE_ADDRESS.address.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                if (cleanItem === cleanOffice) {
                    if (!confirm('Это стандартный адрес офиса и склада. Вы уверены, что хотите удалить его из списка?')) return;
                }
                const updated = addresses.filter((_, i) => i !== idx);
                onUpdateAddresses(updated, true);
            };

            /* ── Расчёт реального пробега загруженных из CSV маршрутов ── */
            const calculateExistingRoutesKm = async () => {
                const targetDayKeys = workdayKeys.filter(k => {
                    const d = workdays[k];
                    return d?.isWorkday && (d.trips || []).length > 0 && (Number(d.tripKm) || 0) === 0;
                });

                if (targetDayKeys.length === 0) {
                    alert('Все дни с маршрутами уже имеют рассчитанный пробег.');
                    return;
                }

                const startPoint = (profile?.startPoint || '').trim();
                if (!startPoint) {
                    alert('Пожалуйста, укажите домашний адрес (Точку старта) во вкладке «Профиль» (Карточка сотрудника)!');
                    return;
                }

                setIsCalculatingRouteKm(true);

                try {
                    const yandexKey = settings?.yandexApiKey || '';
                    const initialCache = getGeoCache();

                    // Геокодируем стартовую точку
                    const startKey = normalizeGeoKey(startPoint);
                    const isStartCached = !!initialCache[startKey];
                    const startCoords = await geocodeAddress(startPoint, yandexKey);
                    if (!isStartCached) {
                        await new Promise(r => setTimeout(r, 250));
                    }

                    if (!startCoords) {
                        alert('Не удалось определить координаты точки старта. Проверьте адрес в профиле.');
                        return;
                    }

                    const newWorkdays = { ...workdays };
                    const newCacheEntries = {};
                    let totalAddedKm = 0;
                    let updatedDaysCount = 0;

                    for (const dateKey of targetDayKeys) {
                        const dayObj = workdays[dateKey];
                        const trips = dayObj?.trips || [];
                        const tripAddrs = trips
                            .map(tr => (typeof tr === 'string' ? tr : (tr.address || tr.to || '')).trim())
                            .filter(Boolean);

                        if (tripAddrs.length === 0) continue;

                        // Геокодируем адреса дня с паузой 250 мс для некашированных адресов
                        const coordsList = [];
                        for (const addr of tripAddrs) {
                            const k = normalizeGeoKey(addr);
                            const isCached = !!getGeoCache()[k];
                            const c = await geocodeAddress(addr, yandexKey);
                            if (!isCached) {
                                await new Promise(r => setTimeout(r, 250));
                            }
                            coordsList.push(c || findApproxCoords(addr));
                        }

                        // Собираем полную петлю: Точка старта -> промежуточные точки -> Точка старта
                        const loopCoords = [startCoords, ...coordsList, startCoords];
                        const osrmResult = await fetchOsrmLoop(loopCoords);
                        const loopKm = osrmResult.totalKm;
                        const legs = osrmResult.legs || [];

                        // Сохраняем плечи в кэш расстояний
                        const fullAddrs = [startPoint, ...tripAddrs, startPoint];
                        for (let li = 0; li < fullAddrs.length - 1; li++) {
                            const cKey = makeDistanceCacheKey(fullAddrs[li], fullAddrs[li + 1]);
                            const legDist = legs[li] || 0;
                            if (legDist > 0) newCacheEntries[cKey] = legDist;
                        }

                        // Округляем итоговый пробег дня до целого числа (Math.round)
                        const roundedDayKm = Math.round(loopKm);

                        // Записываем плечи в trips (trip.distanceKm)
                        const updatedTrips = trips.map((tr, idx) => {
                            const tripObj = typeof tr === 'string' ? { address: tr } : { ...tr };
                            return {
                                ...tripObj,
                                distanceKm: legs[idx] || 0
                            };
                        });

                        newWorkdays[dateKey] = {
                            ...dayObj,
                            tripKm: roundedDayKm,
                            trips: updatedTrips
                        };

                        totalAddedKm += roundedDayKm;
                        updatedDaysCount++;
                    }

                    // Обновляем кэш расстояний
                    if (Object.keys(newCacheEntries).length > 0 && onUpdateDistanceCache) {
                        Object.entries(newCacheEntries).forEach(([k, v]) => {
                            onUpdateDistanceCache(k, v);
                        });
                    }

                    // Пересчитываем цепочку месяца через recalcWorkdays
                    const recalced = recalcWorkdays(
                        newWorkdays,
                        monthData.odometerStart,
                        monthData.fuelStart,
                        monthData.refuels || [],
                        activeNorm
                    );

                    // Обновляем месяц (с автосохранением в Google Таблицу)
                    if (onUpdateMonth) {
                        onUpdateMonth({
                            ...monthData,
                            workdays: recalced
                        }, true);
                    }

                    setDistributionMap(null);
                    alert(`Рассчитан пробег для ${updatedDaysCount} дн. с реальными маршрутами: +${totalAddedKm} км`);
                } catch (err) {
                    console.error('Ошибка расчёта пробега маршрутов:', err);
                    alert('Ошибка расчёта пробега маршрутов: ' + (err.message || err));
                } finally {
                    setIsCalculatingRouteKm(false);
                }
            };

            /* ── Генерация маршрутов-петель для пустых рабочих дней (OSRM / реальные дороги) ── */
            const handleGenerateRoutes = async () => {
                const startPoint = (profile?.startPoint || '').trim();
                if (!startPoint) {
                    alert('Пожалуйста, укажите домашний адрес (Точку старта) во вкладке «Профиль» (Карточка сотрудника)!');
                    return;
                }

                // Отбираем рабочие дни, где есть километраж, но ЕЩЁ НЕТ маршрутов (сохраняем загруженные из CSV дни!)
                const eligibleDayKeys = workdayKeys.filter(k => {
                    const d = workdays[k];
                    const km = Number(d?.tripKm) || 0;
                    const trips = d?.trips || [];
                    return km > 0 && trips.length === 0;
                });

                if (eligibleDayKeys.length === 0) {
                    const hasAnyTrips = workdayKeys.some(k => (workdays[k]?.trips || []).length > 0);
                    if (hasAnyTrips) {
                        alert('Во всех рабочих днях с пробегом уже заполнены маршруты (из CSV или ранее)!');
                    } else {
                        alert('В текущем месяце нет рабочих дней с пробегом. Сначала распределите километраж по дням (Шаг 1)!');
                    }
                    return;
                }

                setIsGeneratingRoutes(true);
                setGenerationProgress('Геокодирование точки старта и адресов...');

                try {
                    const yandexKey = settings?.yandexApiKey || '';
                    const cleanStart = normalizeGeoKey(startPoint);
                    const cleanOffice = normalizeGeoKey(DEFAULT_OFFICE_ADDRESS.address);

                    // 1. Геокодируем точку старта
                    const startCoords = await geocodeAddress(startPoint, yandexKey);

                    // 2. Геокодируем адреса из личного справочника (с вежливой паузой 250 мс для внешних запросов)
                    const userAddressesWithCoords = [];
                    const initialCache = getGeoCache();
                    for (const item of (addresses || [])) {
                        const rawAddr = (item.address || '').trim();
                        if (!rawAddr) continue;
                        const k = normalizeGeoKey(rawAddr);
                        const isAlreadyCached = !!initialCache[k];
                        const c = await geocodeAddress(rawAddr, yandexKey);
                        if (!isAlreadyCached) {
                            await new Promise(r => setTimeout(r, 250));
                        }
                        if (c) {
                            userAddressesWithCoords.push({ address: rawAddr, note: item.note || '', lat: c.lat, lon: c.lon });
                        }
                    }

                    // 3. Собираем адреса, уже занятые в загруженных из CSV днях текущего месяца
                    const usedInMonth = new Set();
                    workdayKeys.forEach(k => {
                        const dayObj = workdays[k];
                        (dayObj?.trips || []).forEach(t => {
                            if (t.address) usedInMonth.add(normalizeGeoKey(t.address));
                        });
                    });
                    // Исключаем старт и офис из пула обычных клиентов
                    usedInMonth.add(cleanStart);
                    usedInMonth.add(cleanOffice);

                    // 4. Формируем колоду доступных адресов без повторов
                    const availableUser = userAddressesWithCoords
                        .filter(a => {
                            const k = normalizeGeoKey(a.address);
                            return k && k !== cleanStart && k !== cleanOffice && !usedInMonth.has(k);
                        })
                        .sort(() => 0.5 - Math.random());

                    const availablePool = MOSCOW_MO_ADDRESS_POOL
                        .filter(a => {
                            const k = normalizeGeoKey(a.address);
                            return k && k !== cleanStart && k !== cleanOffice && !usedInMonth.has(k);
                        })
                        .sort(() => 0.5 - Math.random());

                    let availableDeck = [...availableUser, ...availablePool];
                    if (availableDeck.length === 0) {
                        // Если все адреса заняты, повторно открываем пул Москвы и МО
                        availableDeck = [...MOSCOW_MO_ADDRESS_POOL.filter(a => normalizeGeoKey(a.address) !== cleanStart)];
                    }

                    const newPreview = {};
                    const newCacheEntries = {};
                    let lastOfficeDayIndex = -99;
                    let carryDelta = 0;
                    let anyOsrm = false;

                    // Быстрая вспомогательная оценка протяжённости цепочки по координатам Haversine * 1.32
                    const estimateCoordsLoopKm = (pts) => {
                        const coords = [startCoords, ...pts, startCoords];
                        let sum = 0;
                        for (let i = 0; i < coords.length - 1; i++) {
                            sum += haversineDistance(coords[i].lat, coords[i].lon, coords[i + 1].lat, coords[i + 1].lon) * 1.32;
                        }
                        return Math.round(sum * 10) / 10;
                    };

                    for (let dayIdx = 0; dayIdx < eligibleDayKeys.length; dayIdx++) {
                        const dateKey = eligibleDayKeys[dayIdx];
                        const dayObj = workdays[dateKey];
                        const plannedDayKm = Number(dayObj?.tripKm) || 0;

                        setGenerationProgress(`Подбор маршрутов: день ${dayIdx + 1} из ${eligibleDayKeys.length}...`);

                        // Ограничение переноса невязки: не более ±20% от планового километража дня (и не более 190 км/день)
                        const maxDeltaAllowed = Math.round(plannedDayKm * 0.20 * 10) / 10;
                        const clampedDelta = Math.max(-maxDeltaAllowed, Math.min(maxDeltaAllowed, carryDelta));
                        const targetKmForDay = fitRoutesToMonthlyOdometer
                            ? Math.min(190, Math.max(20, Math.round((plannedDayKm + clampedDelta) * 10) / 10))
                            : plannedDayKm;

                        // Включение заезда в офис/склад (~30–35% дней, не подряд)
                        let includeOffice = false;
                        if (dayIdx - lastOfficeDayIndex > 1) {
                            const prob = (dayIdx - lastOfficeDayIndex >= 3) ? 0.65 : 0.33;
                            if (Math.random() < prob) {
                                includeOffice = true;
                                lastOfficeDayIndex = dayIdx;
                            }
                        }

                        // Количество промежуточных точек (2–5) в зависимости от целевого километража
                        let pointsCount = 2;
                        if (targetKmForDay >= 160) pointsCount = Math.random() < 0.5 ? 4 : 5;
                        else if (targetKmForDay >= 110) pointsCount = Math.random() < 0.5 ? 3 : 4;
                        else if (targetKmForDay >= 65) pointsCount = Math.random() < 0.5 ? 2 : 3;
                        else pointsCount = 2;

                        const otherPointsNeeded = includeOffice ? Math.max(1, pointsCount - 1) : pointsCount;

                        // Если в колоде мало адресов, пополняем её из пула Москвы и МО
                        if (availableDeck.length < otherPointsNeeded) {
                            const refill = [...MOSCOW_MO_ADDRESS_POOL.filter(a => normalizeGeoKey(a.address) !== cleanStart)]
                                .sort(() => 0.5 - Math.random());
                            availableDeck = [...availableDeck, ...refill];
                        }

                        // 5. Перебор до 25 комбинаций в памяти: выбираем петлю с минимальным отклонением от targetKmForDay
                        let bestCombo = null;
                        let bestDiff = Infinity;
                        const attempts = Math.min(25, Math.max(8, availableDeck.length));

                        for (let a = 0; a < attempts; a++) {
                            const shuffledSlice = [...availableDeck].sort(() => 0.5 - Math.random()).slice(0, otherPointsNeeded);
                            let candidateList = [];
                            if (includeOffice) {
                                if (Math.random() < 0.5) candidateList = [DEFAULT_OFFICE_ADDRESS, ...shuffledSlice];
                                else candidateList = [...shuffledSlice, DEFAULT_OFFICE_ADDRESS];
                            } else {
                                candidateList = shuffledSlice;
                            }

                            const estKm = estimateCoordsLoopKm(candidateList);
                            const diff = Math.abs(estKm - targetKmForDay);
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                bestCombo = candidateList;
                            }
                        }

                        if (!bestCombo || bestCombo.length === 0) {
                            bestCombo = availableDeck.slice(0, otherPointsNeeded);
                        }

                        // Фиксируем выбранные адреса клиентов в usedInMonth и удаляем их из свободной колоды
                        bestCombo.forEach(pt => {
                            const k = normalizeGeoKey(pt.address);
                            if (k !== cleanOffice && k !== cleanStart) {
                                usedInMonth.add(k);
                            }
                        });
                        availableDeck = availableDeck.filter(a => !usedInMonth.has(normalizeGeoKey(a.address)));

                        // 6. Реальный расчёт выбранной дорожной петли через OSRM (ровно 1 запрос на день!)
                        const loopCoords = [startCoords, ...bestCombo.map(p => ({ lat: p.lat, lon: p.lon })), startCoords];
                        const osrmResult = await fetchOsrmLoop(loopCoords);
                        if (!osrmResult.isOffline) {
                            anyOsrm = true;
                        }

                        const actualDayKm = osrmResult.totalKm;
                        const legsKm = osrmResult.legs || [];

                        // Сохраняем пары плеч в кэш расстояний
                        const fullAddrs = [startPoint, ...bestCombo.map(p => p.address), startPoint];
                        for (let li = 0; li < fullAddrs.length - 1; li++) {
                            const cKey = makeDistanceCacheKey(fullAddrs[li], fullAddrs[li + 1]);
                            const legDist = legsKm[li] || 0;
                            if (legDist > 0) newCacheEntries[cKey] = legDist;
                        }

                        // Накапливаем разницу между плановым и фактическим пробегом
                        const dayDiff = plannedDayKm - actualDayKm;
                        carryDelta += dayDiff;

                        // 7. Формируем промежуточные точки маршрута (чистые метки: taskType только для офиса/склада)
                        const intermediateAddrs = bestCombo.map(p => p.address);
                        const dayTrips = intermediateAddrs.map((addr, idx) => {
                            const isOffice = normalizeGeoKey(addr) === cleanOffice;
                            const taskType = isOffice ? 'Офис и склад' : '';
                            const hour = 9 + Math.floor(idx * 2);
                            const minute = (idx % 2 === 0) ? '00' : '30';
                            return {
                                order: idx + 1,
                                address: addr,
                                taskType: taskType,
                                time: `${String(hour).padStart(2, '0')}:${minute}`,
                                distanceKm: legsKm[idx] || 0
                            };
                        });

                        newPreview[dateKey] = {
                            dateKey,
                            targetKm: plannedDayKm,
                            actualKm: actualDayKm,
                            intermediateAddrs,
                            trips: dayTrips,
                            chain: fullAddrs,
                            scaledLegs: legsKm,
                            hasOffice: includeOffice,
                            fitApplied: fitRoutesToMonthlyOdometer,
                            isOffline: osrmResult.isOffline
                        };
                    }

                    // Обновляем кэш расстояний новыми вычисленными парами
                    if (Object.keys(newCacheEntries).length > 0 && onUpdateDistanceCache) {
                        Object.entries(newCacheEntries).forEach(([k, v]) => {
                            onUpdateDistanceCache(k, v);
                        });
                    }

                    setHasAnyOsrmRoutes(anyOsrm);
                    setRoutePreviewMap(newPreview);
                } catch (err) {
                    console.error('Ошибка подбора маршрутов:', err);
                    alert('Ошибка подбора маршрутов: ' + err.message);
                } finally {
                    setIsGeneratingRoutes(false);

            const handleApplyRoutesClick = () => {

                                                {Object.entries(routePreviewMap).sort(([a], [b]) => a.localeCompare(b)).map(([dateKey, route]) => (

                                                                    <span className="truncate max-w-[220px]">{profile?.startPoint}</span>
                                                                </div>
                                                                {route.trips.map((t, idx) => (
                                                                    <div key={idx} className="flex items-center gap-1 pl-2 border-l-2 border-current/20">
                                                                        <span className="text-[10px] px-1 rounded bg-black/10 dark:bg-white/10 font-bold flex-shrink-0">{t.order}</span>

           9.1. КОМПОНЕНТ: ОКНО АВТОРИЗАЦИИ (ТЕЛЕФОН + ПИН-КОД)
        ═══════════════════════════════════════════════════ */
        const AuthModal = ({ initialPhone = '', initialPin = '', onLogin, isLoading, errorMsg, t }) => {
            const [phoneInput, setPhoneInput] = useState(() => formatPhoneMask(initialPhone));
            const [pinInput, setPinInput] = useState(() => normalizePin(initialPin));
            const [localError, setLocalError] = useState('');

            const cleanPhone = normalizePhone(phoneInput);
            const cleanPin   = normalizePin(pinInput);
            const canSubmit  = cleanPhone.length === 11 && cleanPin.length === 4 && !isLoading;

            const handlePhoneChange = (e) => {
                const formatted = formatPhoneMask(e.target.value);
                setPhoneInput(formatted);
                setLocalError('');
            };

            const handlePhoneFocus = () => {
                if (!phoneInput) {
                    setPhoneInput('+7 ');
                }
            };

            const handlePinChange = (e) => {
                const p = normalizePin(e.target.value);
                setPinInput(p);
                setLocalError('');
            };

            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (cleanPhone.length !== 11) {
                    setLocalError('Введите корректный номер телефона (11 цифр)');
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLocalError('ПИН-код должен состоять из 4 цифр');
                    return;
                }
                onLogin(cleanPhone, cleanPin);
            };

            const cardClass = t(
                'bg-[#282B30] border-[#FFB300]',
                'bg-white border-gray-300',
                'bg-white border-pink-400',
                'bg-white border-blue-600',
                'bg-white border-emerald-600',
                'bg-[#FDFBF7] border-[#8D6E63]',
                'bg-white border-[#C62828]'
            );

            const overlayInput = t(
                'bg-[#1E2125] border-gray-700 text-white focus:ring-[#FFB300] focus:border-[#FFB300]',
                'bg-gray-50 border-gray-300 text-gray-900 focus:ring-amber-500 focus:border-amber-500',
                'bg-pink-50 border-pink-200 text-pink-900 focus:ring-pink-400 focus:border-pink-400',
                'bg-blue-50 border-blue-200 text-blue-900 focus:ring-blue-500 focus:border-blue-500',
                'bg-emerald-50 border-emerald-200 text-emerald-900 focus:ring-emerald-500 focus:border-emerald-500',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723] focus:ring-[#8D6E63] focus:border-[#8D6E63]',
                'bg-gray-50 border-gray-300 text-gray-900 focus:ring-[#C62828] focus:border-[#C62828]'
            );

            const accentClass = t(
                'text-[#FFB300]','text-amber-800','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );

            const displayError = errorMsg || localError;

            return (
                <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-sm rounded-2xl border-2 ${cardClass} shadow-2xl overflow-hidden`}>
                        {/* Шапка модалки */}

        };

                                        <IconLock size={12} />

                                <div className="mt-1">

        };

        /* ═══════════════════════════════════════════════════
           11. КОРНЕВОЙ КОМПОНЕНТ App
        ═══════════════════════════════════════════════════ */
        const App = () => {

            /* ── Тема ── */
            const [theme, setTheme] = useState(initTheme);

            /* ── Идентификатор эксперта (телефон / ПИН-код) ── */
            const [userPhone, setUserPhone] = useState(() => {
                return normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
            });
            const [userPin, setUserPin] = useState(() => {
                return normalizePin(localStorage.getItem('expert_app_user_pin') || '');
            });
            const [isAuthVerified, setIsAuthVerified] = useState(() => {
                const p = normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
                const pin = normalizePin(localStorage.getItem('expert_app_user_pin') || '');
                const verified = localStorage.getItem('expert_app_auth_verified');
                return p.length === 11 && pin.length === 4 && verified === 'true';
            });
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            /* ── Режим (официальный / автоподбор) ── */
            const [mode, setMode] = useState('official');

            /* ── Вкладка официального режима ── */
            const [officialTab, setOfficialTab] = useState('profile');

            /* ── Настройки (Google Script URL, Яндекс ключ) ── */
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('expert_report_settings') || '{}');
                    if (!saved.googleScriptUrl) {
                        saved.googleScriptUrl = DEFAULT_GOOGLE_SCRIPT_URL;
                    }
                    return saved;
                } catch {
                    return { googleScriptUrl: DEFAULT_GOOGLE_SCRIPT_URL };
                }
            });

            /* ── Профиль сотрудника ── */
            const [profile, setProfile] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_profile') || '{}');
                } catch { return {}; }
            });

            /* ── Справочник адресов ── */
            const [addresses, setAddresses] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('expert_report_addresses') || '[]');
                    const prof = JSON.parse(localStorage.getItem('expert_report_profile') || '{}');
                    return ensureDefaultOfficeAddress(saved, prof?.startPoint);
                } catch { return ensureDefaultOfficeAddress([], ''); }
            });

            /* ── Кэш расстояний (localStorage + память) ── */
            const [distanceCache, setDistanceCache] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_distance_cache') || '{}');
                } catch { return {}; }
            });

            const updateDistanceCache = useCallback((key, km) => {
                if (!key || typeof km !== 'number' || isNaN(km)) return;
                setDistanceCache(prev => {
                    const next = { ...prev, [key]: Math.round(km * 10) / 10 };
                    localStorage.setItem('expert_report_distance_cache', JSON.stringify(next));
                    return next;
                });
            }, []);

            /* ── Данные месяцев ── */
            const [months, setMonths] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_months') || '{}');
                } catch { return {}; }
            });

            /* ── Статус облачной синхронизации ── */
            const [cloudStatus, setCloudStatus] = useState('idle'); // 'idle' | 'syncing' | 'saved' | 'error'
            const [cloudErrorMsg, setCloudErrorMsg] = useState('');

            /* ── Защитные флаги для автосохранения ── */
            const isHydratingRef = useRef(true);
            const userChangedProfileRef = useRef(false);
            const userChangedMonthRef = useRef(false);
            const userChangedAddressesRef = useRef(false);
            const profileDebounceRef = useRef(null);
            const monthDebounceRef = useRef(null);
            const addressesDebounceRef = useRef(null);
            const templateBufferRef = useRef(null);

            const [isExporting, setIsExporting] = useState(false);

            /* ── Текущий месяц по умолчанию — сегодня ── */
            const now = new Date();
            const defaultKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}`;
            const [currentMonthKey, setCurrentMonthKey] = useState(defaultKey);

            /* ── Модалки ── */
            const [showSettings, setShowSettings] = useState(false);

            /* ── Скрытый режим (5 кликов по заголовку) ── */
            const titleClicksRef = useRef(0);
            const titleTimerRef  = useRef(null);
            const handleTitleClick = () => {
                if (!HIDE_UNOFFICIAL_MODE) return;
                titleClicksRef.current++;
                if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
                titleTimerRef.current = setTimeout(() => { titleClicksRef.current = 0; }, 2000);
                if (titleClicksRef.current >= 5) {
                    titleClicksRef.current = 0;
                    setMode(m => m === 'autoselect' ? 'official' : 'autoselect');
                }
            };

            /* ── Обеспечиваем наличие записи для текущего месяца ── */
            const getOrCreateMonth = useCallback((key) => {
                if (months[key]) return months[key];
                const [y, m] = key.split('-').map(Number);
                return {
                    year:  y,
                    month: m,
                    seasonOverride: null,
                    odometerStart:  0,
                    fuelStart:      0,
                    refuels:        [],
                    workdays:       {},
                };
            }, [months]);

            const currentMonthData = getOrCreateMonth(currentMonthKey);

            const updateCurrentMonth = (newData, isUserAction = false) => {
                if (isUserAction) {
                    userChangedMonthRef.current = true;
                }
                setMonths(prev => ({ ...prev, [currentMonthKey]: newData }));
            };

            const updateProfile = (newProfile, isUserAction = false) => {
                if (isUserAction) {
                    userChangedProfileRef.current = true;
                }
                setProfile(newProfile);
            };

            const updateAddresses = (newAddresses, isUserAction = false) => {
                if (isUserAction) {
                    userChangedAddressesRef.current = true;
                }
                setAddresses(newAddresses);
            };

            /* ── Персистентность локального кэша ── */
            useEffect(() => {
                localStorage.setItem('expert_app_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('expert_report_settings', JSON.stringify(settings));
                if (settings.googleScriptUrl) window.GOOGLE_SCRIPT_URL   = settings.googleScriptUrl;
                if (settings.yandexApiKey)    window.YANDEX_MAPS_API_KEY = settings.yandexApiKey;
            }, [settings]);

            /* ── Загрузка данных пользователя из Google Таблицы ── */
            const loadUserData = async (phoneToLoad, pinToLoad) => {
                const phone = normalizePhone(phoneToLoad || userPhone);
                const pin = normalizePin(pinToLoad || userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;

                if (!phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) {
                    isHydratingRef.current = false;
                    return false;
                }

                setCloudStatus('syncing');
                setCloudErrorMsg('');
                setAuthLoading(true);
                try {
                    const res = await callGoogleScript(scriptUrl, 'loadUserData', { userId: phone, pin: pin });

                    // Обработка ошибки неверного ПИНа
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        setCloudStatus('error');
                        setCloudErrorMsg('Неверный ПИН-код');
                        return false;
                    }

                    // Успешный вход
                    localStorage.setItem('expert_app_user_phone', phone);
                    localStorage.setItem('expert_app_user_pin', pin);
                    localStorage.setItem('expert_app_auth_verified', 'true');
                    setUserPhone(phone);
                    setUserPin(pin);
                    setIsAuthVerified(true);
                    setAuthError('');

                    isHydratingRef.current = true;
                    userChangedProfileRef.current = false;
                    userChangedMonthRef.current = false;
                    userChangedAddressesRef.current = false;

                    let loadedProfile = null;
                    let loadedMonths = null;
                    let loadedAddresses = null;

                    if (res) {
                        if (res.profile) loadedProfile = res.profile;
                        else if (res.data && res.data.profile) loadedProfile = res.data.profile;

                        if (res.months) loadedMonths = res.months;
                        else if (res.data && res.data.months) loadedMonths = res.data.months;

                        if (res.addresses) loadedAddresses = res.addresses;
                        else if (res.data && res.data.addresses) loadedAddresses = res.data.addresses;
                    }

                    if (loadedProfile && typeof loadedProfile === 'object') {
                        setProfile(prev => ({ ...prev, ...loadedProfile }));
                    }
                    if (loadedMonths && typeof loadedMonths === 'object') {
                        setMonths(prev => ({ ...prev, ...loadedMonths }));
                    }
                    if (loadedAddresses && Array.isArray(loadedAddresses)) {
                        setAddresses(ensureDefaultOfficeAddress(loadedAddresses, (loadedProfile || profile)?.startPoint));
                    }
                    if (res && res.distanceCache && typeof res.distanceCache === 'object') {
                        setDistanceCache(prev => {
                            const merged = { ...prev, ...res.distanceCache };
                            localStorage.setItem('expert_report_distance_cache', JSON.stringify(merged));
                            return merged;
                        });
                    }

                    // Если новый пользователь — сразу фиксируем userId и pin на листе Профили
                    if (res && (res.status === 'not_found' || res.isNewUser)) {
                        try {
                            await callGoogleScript(scriptUrl, 'saveProfile', {
                                userId: phone,
                                pin: pin,
                                profile: loadedProfile || profile
                            });
                        } catch (e) {
                            console.warn('Не удалось зафиксировать профиль нового пользователя:', e);
                        }
                    }

                    setCloudStatus('saved');
                    return true;
                } catch (err) {
                    console.error('Ошибка загрузки данных из Google Таблицы:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка загрузки данных');
                    setAuthError('Ошибка подключения к Google Таблице: ' + (err.message || 'повторите попытку'));
                    return false;
                } finally {
                    setAuthLoading(false);
                    setTimeout(() => {
                        isHydratingRef.current = false;
                    }, 500);
                }
            };

            /* ── Первичная инициализация при старте ── */
            useEffect(() => {
                if (isAuthVerified && userPhone && userPin) {
                    loadUserData(userPhone, userPin);
                } else {
                    isHydratingRef.current = false;
                }
            }, []);

            /* ── Вход пользователя по связке Телефон + ПИН ── */
            const handleLogin = async (cleanPhone, cleanPin) => {
                setAuthError('');
                await loadUserData(cleanPhone, cleanPin);
            };

            /* ── Смена пользователя (безопасный сброс) ── */
            const handleSwitchUser = () => {
                if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                if (addressesDebounceRef.current) clearTimeout(addressesDebounceRef.current);
                localStorage.removeItem('expert_app_user_phone');
                localStorage.removeItem('expert_app_user_pin');
                localStorage.removeItem('expert_app_auth_verified');
                Object.keys(localStorage)

            /* ── Debounce автосохранения профиля (1500 мс) ── */
