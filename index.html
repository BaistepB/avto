            /* ── Применение распределения недостающего пробега к месяцу ── */
            const handleApplyDistribution = (distributionMap) => {
                if (!distributionMap || Object.keys(distributionMap).length === 0) return;

                const year = currentMonthData.year;
                const month = currentMonthData.month;
                const totalDays = daysInMonth(year, month);
                const activeSeason = currentMonthData.seasonOverride || getSeason(year, month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const wd = { ...(currentMonthData.workdays || {}) };
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (!wd[key]) {
                        wd[key] = {
                            isWorkday: false,
                            tripKm: 0,
                            odometerStart: 0,
                            odometerEnd: 0,
                            fuelStart: 0,
                            fuelEnd: 0,
                            trips: [],
                        };
                    }
                }

                let totalAdded = 0;
                let daysCount = 0;
                Object.entries(distributionMap).forEach(([dateKey, addedKm]) => {
                    const add = Math.round(Number(addedKm) || 0);
                    if (add > 0) {
                        if (!wd[dateKey]) {
                            wd[dateKey] = {
                                isWorkday: true,
                                tripKm: 0,
                                odometerStart: 0,
                                odometerEnd: 0,
                                fuelStart: 0,
                                fuelEnd: 0,
                                trips: [],
                            };
                        }
                        wd[dateKey] = {
                            ...wd[dateKey],
                            isWorkday: true,
                            tripKm: Math.round(((Number(wd[dateKey].tripKm) || 0) + add) * 10) / 10
                        };
                        totalAdded += add;
                        daysCount++;
                    }
                });

                const recalced = recalcWorkdays(
                    wd,
                    currentMonthData.odometerStart,
                    currentMonthData.fuelStart,
                    currentMonthData.refuels || [],
                    activeNorm
                );

                updateCurrentMonth({
                    ...currentMonthData,
                    workdays: recalced
                }, true);

                alert(`✓ Успешно распределено ${totalAdded} км по ${daysCount} дням месяца! Цепочка одометров пересчитана.`);
            };

            /* ── Применение сгенерированных маршрутов-петель к месяцу ── */
            const handleApplyRoutes = (routePreviewMap) => {
                if (!routePreviewMap || Object.keys(routePreviewMap).length === 0) return;

                const year = currentMonthData.year;
                const month = currentMonthData.month;
                const activeSeason = currentMonthData.seasonOverride || getSeason(year, month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const wd = { ...(currentMonthData.workdays || {}) };
                let daysUpdated = 0;
                let totalTripsCount = 0;

                Object.entries(routePreviewMap).forEach(([dateKey, routeInfo]) => {
                    if (wd[dateKey] && Array.isArray(routeInfo?.trips) && routeInfo.trips.length > 0) {
                        const rawKm = (routeInfo.fitApplied && typeof routeInfo.actualKm === 'number')
                            ? routeInfo.actualKm
                            : (Number(wd[dateKey].tripKm) || routeInfo.targetKm || 0);
                        const newKm = Math.round(rawKm);

                        wd[dateKey] = {
                            ...wd[dateKey],
                            trips: routeInfo.trips,
                            tripKm: newKm
                        };
                        daysUpdated++;
                        totalTripsCount += routeInfo.trips.length;
                    }
                });

                const recalced = recalcWorkdays(
                    wd,
                    currentMonthData.odometerStart,
                    currentMonthData.fuelStart,
                    currentMonthData.refuels || [],
                    activeNorm
                );

                // Проверка на отрицательный остаток топлива
                const hasNegativeFuel = Object.values(recalced).some(d => d.isWorkday && Number(d.fuelEnd) < -0.0001);
                if (hasNegativeFuel) {
                    const proceed = confirm(
                        'Внимание: после пересчёта маршрутов в некоторые дни остаток топлива опускается ниже нуля.\n' +
                        'Применить изменения всё равно?'
                    );
                    if (!proceed) return;
                }

                updateCurrentMonth({
                    ...currentMonthData,
                    workdays: recalced
                }, true);

                alert(`✓ Успешно заполнено ${totalTripsCount} точек маршрута в ${daysUpdated} рабочих днях месяца! Цепочка одометров пересчитана.`);
            };

            /* ── Экспорт отчёта в .xlsx по шаблону template.xlsx ── */
            const exportReportToExcel = async (exportProfile, exportMonthData) => {
                if (isExporting) return;
                if (typeof ExcelJS === 'undefined') {
                    alert('Ошибка: библиотека ExcelJS не загружена. Проверьте подключение к интернету.');
                    return;
                }
                setIsExporting(true);
                try {
                    const buf = await loadTemplateBuffer(templateBufferRef);
                    const wb = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);
                    wb.calcProperties.fullCalcOnLoad = true;

                    const p = exportProfile || profile;
                    const mData = exportMonthData || currentMonthData;
                    const year = mData.year;
                    const month = mData.month;
                    const activeSeason = mData.seasonOverride || getSeason(year, month);
                    const activeNorm = activeSeason === 'summer'
                        ? (Number(p.normSummer) || 0)
                        : (Number(p.normWinter) || 0);
                    const totalDays = daysInMonth(year, month);

                    /* ── 1. Лист «Карточка сотрудника» ── */
                    const wsCard = wb.getWorksheet('Карточка сотрудника');
                    if (wsCard) {
                        wsCard.getCell('C2').value = p.fullName || '';
                        wsCard.getCell('C3').value = p.position || '';
                        wsCard.getCell('C4').value = p.organization || '';
                        wsCard.getCell('C5').value = Number(p.normSummer) || 0;
                        wsCard.getCell('C6').value = Number(p.normWinter) || 0;
                        wsCard.getCell('C8').value = p.carBrand || '';
                        wsCard.getCell('C9').value = p.carPlate || '';
                        wsCard.getCell('C10').value = p.driverLicense || '';
                        wsCard.getCell('C11').value = p.fuelType || '';
                    }

                    /* ── 2. Лист «Расчет» ── */
                    const wsCalc = wb.getWorksheet('Расчет');
                    if (wsCalc) {
                        wsCalc.getCell('J2').value = activeNorm;
                        wsCalc.getCell('F5').value = Number(mData.fuelStart) || 0;

                        // Даты B5:B35 — значения (не формулы)
                        for (let d = 1; d <= 31; d++) {
                            const row = d + 4;
                            const bCell = wsCalc.getCell(`B${row}`);
                            if (d <= totalDays) {
                                bCell.value = new Date(Date.UTC(year, month - 1, d));
                            } else {
                                bCell.value = null;
                            }
                        }

                        // Одометр и заправки: только рабочие дни
                        let currentOdo = Math.round(Number(mData.odometerStart) || 0);
                        for (let d = 1; d <= 31; d++) {
                            const row = d + 4;
                            const dateKey = toDateStr(year, month, d);
                            const dayObj = (mData.workdays || {})[dateKey];
                            const isWorking = dayObj && dayObj.isWorkday && d <= totalDays;
                            const refuelLiters = (mData.refuels || [])
                                .filter(r => r.date === dateKey)
                                .reduce((s, r) => s + (Number(r.liters) || 0), 0);

                            if (isWorking) {
                                const kmInt = Math.round(Number(dayObj.tripKm) || 0);
                                // Пропускаем дни с 0 км и без заправки — не пишем одометр
                                if (kmInt === 0 && refuelLiters === 0) {
                                    wsCalc.getCell(`C${row}`).value = null;
                                    wsCalc.getCell(`D${row}`).value = null;
                                    wsCalc.getCell(`G${row}`).value = null;
                                } else {
                                    wsCalc.getCell(`C${row}`).value = currentOdo;
                                    wsCalc.getCell(`D${row}`).value = currentOdo + kmInt;
                                    wsCalc.getCell(`G${row}`).value = refuelLiters > 0 ? refuelLiters : 0;
                                    currentOdo += kmInt;
                                }
                            } else {
                                wsCalc.getCell(`C${row}`).value = null;
                                wsCalc.getCell(`D${row}`).value = null;
                                wsCalc.getCell(`G${row}`).value = null;
                            }
                        }
                    }

                    /* ── 3. Путевые листы «1»..«31» — маршрутные строки ── */
                    for (let d = 1; d <= 31; d++) {
                        const wsDay = wb.getWorksheet(String(d));
                        if (!wsDay) continue;

                        const dateKey = toDateStr(year, month, d);
                        const dayObj = (mData.workdays || {})[dateKey];
                        const isWorking = dayObj && dayObj.isWorkday && d <= totalDays;
                        const kmInt = isWorking ? Math.round(Number(dayObj.tripKm) || 0) : 0;

                        // Очищаем строки маршрута B64..B93 перед записью
                        for (let rowIdx = 64; rowIdx <= 93; rowIdx++) {
                            wsDay.getCell(`B${rowIdx}`).value = null;
                        }

                        if (isWorking && kmInt > 0 && Array.isArray(dayObj.trips) && dayObj.trips.length > 0) {
                            const startPoint = (p.startPoint || '').trim();
                            // Строим список адресов маршрута-петли
                            const routeAddresses = [];
                            // 1. Точка старта
                            routeAddresses.push(startPoint);
                            // 2. Промежуточные точки (поддержка объектов {address} и строк)
                            const intermediates = dayObj.trips
                                .map(tr => typeof tr === 'string' ? tr.trim() : (tr.address || tr.to || '').trim())
                                .filter(addr => addr.length > 0);
                            // Обрезаем до 28 промежуточных (оставляем место для старта + возврата)
                            intermediates.slice(0, 28).forEach(addr => routeAddresses.push(addr));
                            // 3. Возврат в точку старта
                            if (startPoint && routeAddresses[routeAddresses.length - 1] !== startPoint) {
                                routeAddresses.push(startPoint);
                            }
                            // Записываем: максимум 30 строк (B64..B93)
                            routeAddresses.slice(0, 30).forEach((addr, idx) => {
                                wsDay.getCell(`B${64 + idx}`).value = addr;
                            });
                        }
                    }

                    /* ── 4. Генерация и скачивание файла ── */
                    const outBuf = await wb.xlsx.writeBuffer();
                    const blob = new Blob([outBuf], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    });
                    const url = URL.createObjectURL(blob);
                    const lastName = (p.fullName || 'Отчет').split(' ')[0] || 'Отчет';
                    const monthStr = String(month).padStart(2, '0');
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Автоотчет_${year}-${monthStr}_${lastName}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);

                    /* ── 5. Сохранение конечных значений в облако ── */
                    if (isAuthVerified) {
                        try {
                            await saveMonthCloud(mData, currentMonthKey);
                        } catch {}
                    }
                } catch (err) {
                    alert(`Ошибка экспорта: ${err.message || err}`);
                } finally {
                    setIsExporting(false);
                }
            };

            /* ── Перенос входящих остатков с прошлого месяца ── */
            const applyPrevMonthBalances = useCallback((targetYear, targetMonth, force = false) => {
                const targetKey = `${targetYear}-${String(targetMonth).padStart(2,'0')}`;
                const targetData = getOrCreateMonth(targetKey);

                if (!force && ((Number(targetData.odometerStart) || 0) > 0 || (Number(targetData.fuelStart) || 0) > 0)) {
                    return;
                }

                const prevKey = getPrevMonthKey(targetYear, targetMonth);
                const prevData = months[prevKey];
                if (!prevData) {
                    if (force) alert(`Данные за ${prevKey} не найдены`);
                    return;
                }

                const prevSeason = prevData.seasonOverride || getSeason(prevData.year, prevData.month);
                const prevNorm = prevSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const prevSummary = getMonthSummary(prevData, prevNorm);

                const activeSeason = targetData.seasonOverride || getSeason(targetYear, targetMonth);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const recalced = recalcWorkdays(
                    targetData.workdays || {},
                    prevSummary.odometerEnd,
                    prevSummary.fuelEnd,
                    targetData.refuels || [],
                    activeNorm
                );

                const updated = {
                    ...targetData,
                    odometerStart: prevSummary.odometerEnd,
                    fuelStart: prevSummary.fuelEnd,
                    workdays: recalced
                };

                userChangedMonthRef.current = true;
                setMonths(prev => ({ ...prev, [targetKey]: updated }));
                if (force) {
                    alert(`Перенесены остатки из ${prevKey}:\n• Одометр: ${prevSummary.odometerEnd} км\n• Топливо: ${prevSummary.fuelEnd} л`);
                }
            }, [months, profile, getOrCreateMonth]);

            /* ── Автоперенос при выборе месяца с 0 остатками ── */
            useEffect(() => {
                if (isHydratingRef.current || !isAuthVerified) return;
                const mData = currentMonthData;
                if ((Number(mData.odometerStart) || 0) === 0 && (Number(mData.fuelStart) || 0) === 0) {
                    applyPrevMonthBalances(mData.year, mData.month, false);
                }
            }, [currentMonthKey, isHydratingRef.current, isAuthVerified]);

            /* ── Хелпер темы ── */
            const t = makeT(theme);

            /* ── Стили интерфейса ── */
            const appBg = t(
                'bg-[#101112] text-gray-100',
                'bg-[#F0F2F5] text-gray-900',
                'bg-pink-50 text-gray-900',
                'bg-blue-50 text-gray-900',
                'bg-emerald-50 text-gray-900',
                'bg-[#F5F2EE] text-gray-900',
                'bg-[#F4F5F7] text-gray-900'
            );

            const headerBg = t(
                'bg-[#1A1D21] border-[#3A3D42]',
                'bg-white border-gray-200',
                'bg-white border-pink-200',
                'bg-white border-blue-200',
                'bg-white border-emerald-200',
                'bg-[#FDFBF7] border-[#D7CCC8]',
                'bg-white border-gray-200'
            );

            const accentClass = t(
                'text-[#FFB300]','text-amber-800','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );

            const tabActive = t(
                'bg-[#FFB300] text-black',
                'bg-amber-600 text-white',
                'bg-pink-500 text-white',
                'bg-blue-600 text-white',
                'bg-emerald-600 text-white',
                'bg-[#6D4C41] text-white',
                'bg-[#C62828] text-white'
            );

            const tabInactive = t(
                'text-gray-400 hover:text-[#FFB300]',
                'text-gray-500 hover:text-amber-700',
                'text-gray-500 hover:text-pink-600',
                'text-gray-500 hover:text-blue-600',
                'text-gray-500 hover:text-emerald-700',
                'text-[#8D6E63] hover:text-[#5D4037]',
                'text-gray-500 hover:text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );

            const modeSwitchBase = 'flex rounded-full border overflow-hidden text-xs font-bold ' + t(
                'border-[#FFB300]/40','border-amber-400','border-pink-400',
                'border-blue-400','border-emerald-400','border-[#A1887F]','border-[#C62828]/40'
            );

            return (
                <div className={`w-full h-full flex flex-col ${appBg}`}>

                    {/* Снегопад */}
                    {theme === 'newyear' && <SnowEffect />}

                    {/* ══ ШАПКА ══ */}
                    <header className={`flex-shrink-0 border-b shadow-sm z-10 ${headerBg}`}>
                        <div className="max-w-4xl mx-auto w-full px-4 py-3 flex items-center justify-between">
                            {/* Заголовок — выровнен по левому краю */}
                            <h1
                                className={`text-lg font-black tracking-tight select-none ${accentClass}`}
                                onClick={handleTitleClick}
                                style={{ cursor: HIDE_UNOFFICIAL_MODE ? 'default' : 'default' }}
                            >
                                Автоотчет
                            </h1>

                            {/* Переключатель режимов */}
                            {!HIDE_UNOFFICIAL_MODE && (
                                <div className={modeSwitchBase}>
                                    <button
                                        onClick={() => setMode('official')}
                                        className={`px-3 py-1.5 min-h-[36px] transition-colors ${mode === 'official' ? tabActive : tabInactive}`}
                                    >
                                        Официальный
                                    </button>
                                    <button
                                        onClick={() => setMode('autoselect')}
                                        className={`px-3 py-1.5 min-h-[36px] transition-colors ${mode === 'autoselect' ? tabActive : tabInactive}`}
                                    >
                                        Автоподбор
                                    </button>
                                </div>
                            )}

                            <div className="flex items-center">
                                {/* Индикатор облачной синхронизации */}
                                <div className="flex items-center gap-1.5 mr-2">
                                    {cloudStatus === 'syncing' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-amber-500 animate-pulse" title="Синхронизация с Google Таблицей">
                                            <IconCloudSync size={16} />
                                            <span className="hidden sm:inline">Сохранение...</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'saved' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-green-500" title="Данные синхронизированы с Google Таблицей">
                                            <IconCloudCheck size={16} />
                                            <span className="hidden sm:inline">Облако ✓</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'error' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-red-500 cursor-pointer" title={cloudErrorMsg || 'Ошибка облака'} onClick={() => alert(cloudErrorMsg || 'Ошибка синхронизации')}>
                                            <IconAlertTriangle size={16} />
                                            <span className="hidden sm:inline">Ошибка облака</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'idle' && (
                                        <span className="flex items-center gap-1 text-xs font-bold opacity-40" title={userPhone ? `Эксперт: ${userPhone}` : 'Вход не выполнен'}>
                                            <IconCloud size={16} />
                                            <span className="hidden sm:inline">{userPhone ? 'Облако' : 'Офлайн'}</span>
                                        </span>
                                    )}
                                </div>

                                {/* Кнопка настроек */}
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className={`min-h-[48px] min-w-[48px] flex items-center justify-center rounded-lg transition-opacity hover:opacity-80 ${accentClass}`}
                                    aria-label="Настройки"
                                >
                                    <IconSettings size={22} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ══ ВКЛАДКИ (только в официальном режиме) ══ */}
                    {mode === 'official' && (
                        <div className={`flex-shrink-0 border-b ${t('border-[#3A3D42] bg-[#1A1D21]','border-gray-200 bg-white','border-pink-200 bg-white','border-blue-200 bg-white','border-emerald-200 bg-white','border-[#D7CCC8] bg-[#FDFBF7]','border-gray-200 bg-white')}`}>
                            <div className="max-w-4xl mx-auto w-full px-4 flex">
                                <button
                                    onClick={() => setOfficialTab('profile')}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 min-h-[48px] text-sm font-bold border-b-2 transition-colors ${
                                        officialTab === 'profile'
                                            ? `border-current ${accentClass}`
                                            : `border-transparent ${tabInactive}`
                                    }`}
                                >
                                    <IconUser size={16} />
                                    Карточка
                                </button>
                                <button
                                    onClick={() => setOfficialTab('month')}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 min-h-[48px] text-sm font-bold border-b-2 transition-colors ${
                                        officialTab === 'month'
                                            ? `border-current ${accentClass}`
                                            : `border-transparent ${tabInactive}`
                                    }`}
                                >
                                    <IconCalendar size={16} />
                                    {MONTH_NAMES[currentMonthData.month]} {currentMonthData.year}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ══ КОНТЕНТ ══ */}
                    <main className="flex-1 overflow-y-auto hide-scrollbar">
                        <div className="max-w-4xl mx-auto w-full px-4 py-4">
                            {mode === 'official' && officialTab === 'profile' && (
                                <ProfileCard
                                    profile={profile}
                                    onChange={updateProfile}
                                    userPhone={userPhone}
                                    onSaveCloud={() => saveProfileCloud(profile)}
                                    cloudStatus={cloudStatus}
                                    t={t}
                                />
                            )}
                            {mode === 'official' && officialTab === 'month' && (
                                <MonthSetup
                                    monthData={currentMonthData}
                                    profile={profile}
                                    onUpdate={updateCurrentMonth}
                                    allMonths={months}
                                    onUpdateAllMonths={(updater) => {
                                        userChangedMonthRef.current = true;
                                        setMonths(updater);
                                    }}
                                    onChangeMonthKey={(newYear, newMonth) => setCurrentMonthKey(`${newYear}-${String(newMonth).padStart(2, '0')}`)}
                                    onPullPrevMonth={(y, m) => applyPrevMonthBalances(y, m, true)}
                                    onSaveMonthCloud={() => saveMonthCloud(currentMonthData, currentMonthKey)}
                                    onLoadMonthCloud={() => loadMonthCloud(currentMonthKey)}
                                    onExportExcel={() => exportReportToExcel(profile, currentMonthData)}
                                    cloudStatus={cloudStatus}
                                    userPhone={userPhone}
                                    t={t}
                                />
                            )}
                            {mode === 'autoselect' && (
                                <AutoSelectScreen
                                    monthData={currentMonthData}
                                    profile={profile}
                                    addresses={addresses}
                                    onUpdateAddresses={updateAddresses}
                                    onSaveAddressesCloud={() => saveAddressesCloud(addresses)}
                                    allMonths={months}
                                    onApplyDistribution={handleApplyDistribution}
                                    onApplyRoutes={handleApplyRoutes}
                                    onUpdateMonth={updateCurrentMonth}
                                    distanceCache={distanceCache}
                                    onUpdateDistanceCache={updateDistanceCache}
                                    settings={settings}
                                    cloudStatus={cloudStatus}
                                    onExportExcel={() => exportReportToExcel(profile, currentMonthData)}
                                    userPhone={userPhone}
                                    t={t}
                                />
                            )}
                        </div>
                    </main>

                    {/* ══ МОДАЛКА АВТОРИЗАЦИИ (ТЕЛЕФОН + ПИН) ══ */}
                    {!isAuthVerified && (
                        <AuthModal
                            initialPhone={userPhone}
                            initialPin={userPin}
                            onLogin={handleLogin}
                            isLoading={authLoading}
                            errorMsg={authError}
                            t={t}
                        />
                    )}

                    {/* ══ МОДАЛКА НАСТРОЕК ══ */}
                    {showSettings && (
                        <SettingsModal
                            theme={theme}
                            onThemeChange={setTheme}
                            settings={settings}
                            onSettingsChange={setSettings}
                            userPhone={userPhone}
                            onSwitchUser={handleSwitchUser}
                            onClose={() => setShowSettings(false)}
                            t={t}
                        />
                    )}
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           12. МОНТИРОВАНИЕ
        ═══════════════════════════════════════════════════ */
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
