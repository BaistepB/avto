                                    placeholder={`Например: ${odometerStart > 0 ? (odometerStart + 2500) : 2500}`}
                                    value={targetOdometer}
                                    onChange={e => {
                                        setTargetOdometer(e.target.value);
                                        setDistributionMap(null);
                                        setRoutePreviewMap(null);
                                    }}
                                />
                            </div>
                        )}

                        <div className="space-y-2 text-sm">
                            {goalType === 'fuel' ? (
                                <>
                                    <div className="flex justify-between">
                                        <span className="opacity-60">Начальный остаток:</span>
                                        <span className="font-mono font-bold">{formatFuel(fuelStart)} л</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="opacity-60">Сумма заправок:</span>
                                        <span className="font-mono font-bold">+{formatFuel(totalRefuels)} л</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="opacity-60">Целевой остаток:</span>
                                        <span className="font-mono font-bold">−{formatFuel(target)} л</span>
                                    </div>
                                    <div className={`flex justify-between font-bold pt-2 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                        <span className={accentClass}>Требуемый расход:</span>
                                        <span className={`font-mono ${accentClass}`}>{formatFuel(requiredFuel)} л</span>
                                    </div>
                                    <div className={`flex justify-between font-bold ${accentClass}`}>
                                        <span>Требуемый пробег (норма {activeNorm} л/100км):</span>
                                        <span className="font-mono">{requiredKm.toFixed(1)} км</span>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="flex justify-between">
                                        <span className="opacity-60">Начальный одометр:</span>
                                        <span className="font-mono font-bold">{odometerStart} км</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="opacity-60">Целевой одометр на конец:</span>
                                        <span className="font-mono font-bold">{Number(targetOdometer) || 0} км</span>
                                    </div>
                                    <div className={`flex justify-between font-bold pt-2 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                        <span className={accentClass}>Требуемый пробег за месяц:</span>
                                        <span className={`font-mono ${accentClass}`}>{requiredKm.toFixed(1)} км</span>
                                    </div>
                                    <div className="flex justify-between opacity-80 text-xs">
                                        <span>Требуемый расход (норма {activeNorm} л/100км):</span>
                                        <span className="font-mono font-bold">{formatFuel(requiredFuel)} л</span>
                                    </div>
                                    <div className="flex justify-between opacity-80 text-xs">
                                        <span>Расчётный остаток топлива на конец:</span>
                                        <span className={`font-mono font-bold ${projectedFuelEnd < -0.001 ? 'text-red-500' : 'text-emerald-500'}`}>
                                            {formatFuel(projectedFuelEnd)} л

                            )}

                            <div className="flex justify-between opacity-70">

                                <span className="font-mono">{kmFromRoutes.toFixed(1)} км</span>
                            </div>

                            <div className={`flex justify-between font-bold pt-2 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                <span className={missingKm > 0 ? 'text-orange-500' : 'text-green-500'}>
                                    {missingKm > 0 ? '⚠ Недостающий пробег:' : '✓ Маршрутов достаточно:'}
                                </span>
                                <span className={`font-mono text-base ${missingKm > 0 ? 'text-orange-500' : 'text-green-500'}`}>
                                    {missingKm > 0 ? `${missingKm.toFixed(1)} км (округлённо ${targetTotal} км)` : '0 км'}
                                </span>
                            </div>

                            {/* Предупреждение о нехватке топлива при целевом одометре */}
                            {goalType === 'odometer' && projectedFuelEnd < -0.001 && (
                                <div className={`mt-2 p-2.5 rounded-lg text-xs flex items-center gap-2 ${alertBannerClass}`}>

                                    <span>
                                        При таком конечном пробеге не хватает топлива ({formatFuel(Math.abs(projectedFuelEnd))} л) — проверьте заправки или уменьшите конечный одометр.

                            {lateRefuelInfo && (

                                    <IconAlertTriangle size={18} className={`flex-shrink-0 mt-0.5 ${isRedButtonTheme ? 'text-slate-950' : 'text-white'}`} />
                                    <div className="leading-relaxed flex-1 space-y-2">

                                                <div>

                                                В текущем разбросе есть день с пробегом более 200 км — нажмите «Пересчитать разброс» или добавьте рабочий день в календаре.
                                            </div>

                        </div>
                    </div>

                    {/* КАРТОЧКА 2: ЛИЧНЫЙ СПРАВОЧНИК АДРЕСОВ (СВОРАЧИВАЕМАЯ) */}
                    <div className={`rounded-lg border ${cardClass} overflow-hidden`}>

                        >

                        {isAddressesOpen && (

                                <p className="text-xs opacity-60">

                                </p>

                                {/* Панель кнопок действий */}
                                <div className="flex flex-wrap gap-2">
                                    <button

                                    <button

                                        <div className="flex justify-end gap-2">

                                            >

                                            <button

            const canSubmit  = cleanPhone.length === 11 && cleanPin.length === 4 && !isLoading;

                const formatted = formatPhoneMask(e.target.value);
                setPhoneInput(formatted);
                setLocalError('');

                if (!phoneInput) {

                const p = normalizePin(e.target.value);
                setPinInput(p);
                setLocalError('');
            };

                if (e) e.preventDefault();
                if (cleanPhone.length !== 11) {
                    setLocalError('Введите корректный номер телефона (11 цифр)');
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLocalError('ПИН-код должен состоять из 4 цифр');
                    return;

                onLogin(cleanPhone, cleanPin);

                                            Удалит только ключи <code className="font-mono">expert_report_*</code>.
                                            Тема, история маршрутов и данные других приложений не затрагиваются.
                                        </p>
                                    </div>
                                </div>
                                {!confirmReset ? (
                                    <button
                                        onClick={() => setConfirmReset(true)}
                                        className="w-full min-h-[40px] rounded text-xs font-bold text-red-600 border border-red-400 hover:bg-red-100 transition-colors"
                                    >
                                        Сбросить данные…
                                    </button>
                                ) : (
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setConfirmReset(false)}
                                            className="flex-1 min-h-[40px] rounded text-xs font-bold border border-gray-400 opacity-60 hover:opacity-100"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            onClick={resetReportData}
                                            className="flex-1 min-h-[40px] rounded text-xs font-bold bg-red-600 text-white hover:bg-red-700"
                                        >
                                            Да, сбросить!
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Версия и кнопка закрытия */}
                            <div className="flex items-center justify-between pt-1">
                                <span className="text-[11px] font-mono opacity-40">v{APP_VERSION}</span>
                                <button
                                    onClick={onClose}
                                    className={`px-5 py-2 min-h-[40px] text-sm font-black rounded ${btnPrimary}`}
                                >
                                    ЗАКРЫТЬ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           11. КОРНЕВОЙ КОМПОНЕНТ App
        ═══════════════════════════════════════════════════ */
        const App = () => {

            /* ── Тема ── */
            const [theme, setTheme] = useState(initTheme);

            /* ── Живое время и дата для фирменной шапки (как в «Маршрутах») ── */
            const [now, setNow] = useState(() => new Date());
            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const formatDate = (date) => {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const y = date.getFullYear();
                return `${d}.${m}.${y}`;
            };

            const formatTime = (date) => {
                const h = String(date.getHours()).padStart(2, '0');
                const min = String(date.getMinutes()).padStart(2, '0');
                const s = String(date.getSeconds()).padStart(2, '0');
                return `${h}:${min}:${s}`;
            };

            /* ── Идентификатор эксперта (телефон / ПИН-код) ── */
            const [userPhone, setUserPhone] = useState(() => {
                return normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
            });
            const [userPin, setUserPin] = useState(() => {
                return normalizePin(localStorage.getItem('expert_app_user_pin') || '');
            });
            const [isAuthVerified, setIsAuthVerified] = useState(() => {
                const p = normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
                const pin = normalizePin(localStorage.getItem('expert_app_user_pin') || '');
                const verified = localStorage.getItem('expert_app_auth_verified');
                return p.length === 11 && pin.length === 4 && verified === 'true';
            });
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            /* ── Режим (официальный / автоподбор) ── */
            const [mode, setMode] = useState('official');

            /* ── Вкладка официального режима ── */
            const [officialTab, setOfficialTab] = useState('profile');

            /* ── Настройки (Google Script URL, Яндекс ключ) ── */
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('expert_report_settings') || '{}');
                    if (!saved.googleScriptUrl) {
                        saved.googleScriptUrl = DEFAULT_GOOGLE_SCRIPT_URL;
                    }
                    return saved;
                } catch {
                    return { googleScriptUrl: DEFAULT_GOOGLE_SCRIPT_URL };
                }
            });

            /* ── Профиль сотрудника ── */
            const [profile, setProfile] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_profile') || '{}');
                } catch { return {}; }
            });

            /* ── Справочник адресов ── */
            const [addresses, setAddresses] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('expert_report_addresses') || '[]');
                    const prof = JSON.parse(localStorage.getItem('expert_report_profile') || '{}');
                    return ensureDefaultOfficeAddress(saved, prof?.startPoint);
                } catch { return ensureDefaultOfficeAddress([], ''); }
            });

            /* ── Кэш расстояний (localStorage + память) ── */
            const [distanceCache, setDistanceCache] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_distance_cache') || '{}');
                } catch { return {}; }
            });

            const updateDistanceCache = useCallback((key, km) => {
                if (!key || typeof km !== 'number' || isNaN(km)) return;
                setDistanceCache(prev => {
                    const next = { ...prev, [key]: Math.round(km * 10) / 10 };
                    localStorage.setItem('expert_report_distance_cache', JSON.stringify(next));
                    return next;
                });
            }, []);

            /* ── Данные месяцев ── */
            const [months, setMonths] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_months') || '{}');
                } catch { return {}; }
            });

            /* ── Статус облачной синхронизации ── */
            const [cloudStatus, setCloudStatus] = useState('idle'); // 'idle' | 'syncing' | 'saved' | 'error'
            const [cloudErrorMsg, setCloudErrorMsg] = useState('');

            /* ── Защитные флаги для автосохранения ── */
            const isHydratingRef = useRef(true);
            const userChangedProfileRef = useRef(false);
            const userChangedMonthRef = useRef(false);
            const userChangedAddressesRef = useRef(false);
            const profileDebounceRef = useRef(null);
            const monthDebounceRef = useRef(null);
            const addressesDebounceRef = useRef(null);
            const templateBufferRef = useRef(null);

            const [isExporting, setIsExporting] = useState(false);

            /* ── Менеджер тостов и диалогов ── */
            const [toast, setToast] = useState(null); // { message, type: 'success' | 'error' | 'info' }
            const toastTimerRef = useRef(null);

            const showToast = useCallback((message, type = 'info') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast(null);
                }, 4000);
            }, []);

            const [dialog, setDialog] = useState(null); // { mode: 'confirm' | 'alert', title, message, confirmText, cancelText, danger, resolve }

            const showConfirm = useCallback(({ title = 'Подтверждение', message, confirmText = 'Подтвердить', cancelText = 'Отмена', danger = false }) => {
                return new Promise((resolve) => {
                    setDialog({
                        mode: 'confirm',
                        title,
                        message,
                        confirmText,
                        cancelText,
                        danger,
                        resolve
                    });
                });
            }, []);

            const showAlert = useCallback((message, title = 'Уведомление') => {
                return new Promise((resolve) => {
                    setDialog({
                        mode: 'alert',
                        title,
                        message,
                        confirmText: 'Понятно',
                        danger: false,
                        resolve
                    });
                });
            }, []);

            const handleDialogClose = useCallback((result) => {
                setDialog(prev => {
                    if (prev && prev.resolve) {
                        prev.resolve(result);
                    }
                    return null;
                });
            }, []);

            useEffect(() => {
                if (!dialog) return;
                const onKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        handleDialogClose(dialog.mode === 'confirm' ? false : undefined);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [dialog, handleDialogClose]);

            /* ── Текущий месяц по умолчанию — сегодня ── */
            const defaultKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}`;

            /* ── Открытые вкладки месяцев ── */
            const [openMonthKeys, setOpenMonthKeys] = useState(() => {
                try {
                    const rawSavedTabs = localStorage.getItem('expert_report_open_tabs');
                    if (rawSavedTabs !== null) {
                        const parsed = JSON.parse(rawSavedTabs);
                        if (Array.isArray(parsed)) {
                            const validTabs = parsed.filter(k => /^\d{4}-\d{2}$/.test(k));
                            if (validTabs.length > 0) {
                                return Array.from(new Set(validTabs)).sort();
                            }
                        }
                    }
                } catch {}

                // Автоматически собираем defaultKey + непустые месяцы, ТОЛЬКО если expert_report_open_tabs ещё нет в localStorage или он пустой
                const set = new Set();
                set.add(defaultKey);
                try {
                    const savedMonths = JSON.parse(localStorage.getItem('expert_report_months') || '{}');
                    Object.entries(savedMonths).forEach(([k, m]) => {
                        if (!/^\d{4}-\d{2}$/.test(k)) return;
                        const hasOdo = Number(m?.odometerStart) > 0;
                        const hasRefuels = Array.isArray(m?.refuels) && m.refuels.length > 0;
                        const hasWorkdays = m?.workdays && Object.values(m.workdays).some(d => d && (d.isWorkday || (d.trips && d.trips.length > 0) || Number(d.tripKm) > 0));
                        if (hasOdo || hasRefuels || hasWorkdays) {
                            set.add(k);
                        }
                    });
                } catch {}
                return Array.from(set).sort();
            });

            /* ── Текущий выбранный месяц (всегда совпадает с одной из открытых вкладок) ── */
            const [currentMonthKey, setCurrentMonthKey] = useState(() => {
                if (openMonthKeys.includes(defaultKey)) return defaultKey;
                return openMonthKeys[openMonthKeys.length - 1] || defaultKey;
            });

            useEffect(() => {
                try {
                    localStorage.setItem('expert_report_open_tabs', JSON.stringify(openMonthKeys));
                } catch {}
            }, [openMonthKeys]);

            /* ── Модальное окно выбора месяца (+) ── */
            const [showMonthPickerModal, setShowMonthPickerModal] = useState(false);
            const [pickerYear, setPickerYear] = useState(now.getFullYear());
            const tabsScrollRef = useRef(null);

            const monthHasData = (yearNum, monthNum) => {
                const k = `${yearNum}-${String(monthNum).padStart(2, '0')}`;
                const m = months[k];
                if (!m) return false;
                const hasOdo = Number(m.odometerStart) > 0;
                const hasRefuels = Array.isArray(m.refuels) && m.refuels.length > 0;
                const hasWorkdays = m.workdays && Object.values(m.workdays).some(d => d && (d.isWorkday || (d.trips && d.trips.length > 0) || Number(d.tripKm) > 0));
                return Boolean(hasOdo || hasRefuels || hasWorkdays);
            };

            /* ── Закрытие вкладки месяца ── */
            const handleCloseMonthTab = (keyToClose, e) => {
                if (e) e.stopPropagation();
                if (openMonthKeys.length <= 1) return;

                const idx = openMonthKeys.indexOf(keyToClose);
                const nextKeys = openMonthKeys.filter(k => k !== keyToClose);
                setOpenMonthKeys(nextKeys);

                if (currentMonthKey === keyToClose) {
                    const nextIdx = Math.max(0, idx - 1);
                    const newCurrent = nextKeys[nextIdx] || nextKeys[0];
                    if (newCurrent) {
                        setCurrentMonthKey(newCurrent);
                    }
                }
            };

            /* ── Открытие нового месяца по клику на месяц в модалке ── */
            const handleOpenMonth = (y, m) => {
                const newKey = `${y}-${String(m).padStart(2, '0')}`;
                setOpenMonthKeys(prev => {
                    if (prev.includes(newKey)) return prev;
                    return [...prev, newKey].sort();
                });
                if (!months[newKey]) {
                    applyPrevMonthBalances(y, m, false);
                }
                setCurrentMonthKey(newKey);
                setOfficialTab('month');
                setShowMonthPickerModal(false);
            };

            /* ── Модалки ── */
            const [showSettings, setShowSettings] = useState(false);

            /* ── Скрытый продвинутый режим (активация по 7 быстрым кликам по заголовку «Автоотчёт») ── */
            const [isProUnlocked, setIsProUnlocked] = useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);
            const audioRef = useRef(null);

            const titleClicksRef = useRef(0);
            const titleTimerRef  = useRef(null);

            const handleTitleClick = () => {
                titleClicksRef.current++;
                if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
                titleTimerRef.current = setTimeout(() => {
                    titleClicksRef.current = 0;
                }, 2200);

                if (titleClicksRef.current >= 7) {
                    titleClicksRef.current = 0;
                    setIsProUnlocked(true);
                    setMode('autoselect');

                    // Запуск музыки fg.mp3
                    try {
                        if (!audioRef.current) {
                            const a = new Audio('fg.mp3');
                            a.loop = true;
                            a.volume = 0.35;
                            audioRef.current = a;
                        }
                        audioRef.current.currentTime = 0;
                        const playPromise = audioRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => setIsPlayingAudio(true))
                                .catch(e => console.log('Аудио заблокировано браузером до прямого клика:', e));
                        }
                    } catch (e) {
                        console.log('Ошибка запуска аудио:', e);
                    }
                }
            };

            /* ── Переключение звука фоновой музыки ── */
            const toggleAudio = () => {
                try {
                    if (!audioRef.current) {
                        const a = new Audio('fg.mp3');
                        a.loop = true;
                        a.volume = 0.35;
                        audioRef.current = a;
                    }
                    if (isPlayingAudio) {
                        audioRef.current.pause();
                        setIsPlayingAudio(false);
                    } else {
                        const playPromise = audioRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => setIsPlayingAudio(true))
                                .catch(e => console.log('Ошибка воспроизведения:', e));
                        }
                    }
                } catch (e) {
                    console.log('Ошибка переключения звука:', e);
                }
            };

            /* ── Блокировка и скрытие продвинутого режима ── */
            const handleLockPro = () => {
                setIsProUnlocked(false);
                setMode('official');
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                }
                setIsPlayingAudio(false);
            };

            /* ── Обеспечиваем наличие записи для текущего месяца ── */
            const getOrCreateMonth = useCallback((key) => {
                if (months[key]) return months[key];
                const [y, m] = key.split('-').map(Number);
                return {
                    year:  y,
                    month: m,
                    seasonOverride: null,
                    odometerStart:  0,
                    fuelStart:      0,
                    refuels:        [],
                    workdays:       {},
                };
            }, [months]);

            const currentMonthData = getOrCreateMonth(currentMonthKey);

            const updateCurrentMonth = (newData, isUserAction = false) => {
                if (isUserAction) {
                    userChangedMonthRef.current = true;
                }
                setMonths(prev => ({ ...prev, [currentMonthKey]: newData }));
            };

            const updateProfile = (newProfile, isUserAction = false) => {
                if (isUserAction) {
                    userChangedProfileRef.current = true;
                }
                setProfile(newProfile);
            };

            const updateAddresses = (newAddresses, isUserAction = false) => {
                if (isUserAction) {
                    userChangedAddressesRef.current = true;
                }
                setAddresses(newAddresses);
            };

            /* ── Персистентность локального кэша ── */
            useEffect(() => {
                localStorage.setItem('expert_app_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('expert_report_settings', JSON.stringify(settings));
                if (settings.googleScriptUrl) window.GOOGLE_SCRIPT_URL   = settings.googleScriptUrl;
                if (settings.yandexApiKey)    window.YANDEX_MAPS_API_KEY = settings.yandexApiKey;
            }, [settings]);

            /* ── Загрузка данных пользователя с сервера ── */
            const loadUserData = async (phoneToLoad, pinToLoad) => {
                const phone = normalizePhone(phoneToLoad || userPhone);
                const pin = normalizePin(pinToLoad || userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;

                if (!phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) {
                    isHydratingRef.current = false;
                    return false;
                }

                setCloudStatus('syncing');
                setCloudErrorMsg('');
                setAuthLoading(true);
                try {
                    const res = await callGoogleScript(scriptUrl, 'loadUserData', { userId: phone, pin: pin });

                    // Обработка ошибки неверного ПИНа
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        setCloudStatus('error');
                        setCloudErrorMsg('Неверный ПИН-код');
                        return false;
                    }

                    // Успешный вход
                    localStorage.setItem('expert_app_user_phone', phone);
                    localStorage.setItem('expert_app_user_pin', pin);
                    localStorage.setItem('expert_app_auth_verified', 'true');
                    setUserPhone(phone);
                    setUserPin(pin);
                    setIsAuthVerified(true);
                    setAuthError('');

                    isHydratingRef.current = true;
                    userChangedProfileRef.current = false;
                    userChangedMonthRef.current = false;
                    userChangedAddressesRef.current = false;

                    let loadedProfile = null;
                    let loadedMonths = null;
                    let loadedAddresses = null;

                    if (res) {
                        if (res.profile) loadedProfile = res.profile;
                        else if (res.data && res.data.profile) loadedProfile = res.data.profile;

                        if (res.months) loadedMonths = res.months;
                        else if (res.data && res.data.months) loadedMonths = res.data.months;

                        if (res.addresses) loadedAddresses = res.addresses;
                        else if (res.data && res.data.addresses) loadedAddresses = res.data.addresses;
                    }

                    if (loadedProfile && typeof loadedProfile === 'object') {
                        setProfile(prev => ({ ...prev, ...loadedProfile }));
                    }
                    if (loadedMonths && typeof loadedMonths === 'object') {
                        setMonths(prev => ({ ...prev, ...loadedMonths }));

                        // Автоматически добавляем непустые месяцы ТОЛЬКО если expert_report_open_tabs отсутствует в localStorage (первый вход)
                        const hasSavedTabs = (() => {
                            try {
                                const raw = localStorage.getItem('expert_report_open_tabs');
                                if (raw !== null) {
                                    const parsed = JSON.parse(raw);
                                    return Array.isArray(parsed) && parsed.filter(k => /^\d{4}-\d{2}$/.test(k)).length > 0;
                                }
                            } catch {}
                            return false;
                        })();

                        if (!hasSavedTabs) {
                            setOpenMonthKeys(prevKeys => {
                                const set = new Set(prevKeys);
                                Object.entries(loadedMonths).forEach(([k, m]) => {
                                    if (!/^\d{4}-\d{2}$/.test(k)) return;
                                    const hasOdo = Number(m?.odometerStart) > 0;
                                    const hasRefuels = Array.isArray(m?.refuels) && m.refuels.length > 0;
                                    const hasWorkdays = m?.workdays && Object.values(m.workdays).some(d => d && (d.isWorkday || (d.trips && d.trips.length > 0) || Number(d.tripKm) > 0));
                                    if (hasOdo || hasRefuels || hasWorkdays) set.add(k);
                                });
                                return Array.from(set).sort();
                            });
                        }
                    }
                    if (loadedAddresses && Array.isArray(loadedAddresses)) {
                        setAddresses(ensureDefaultOfficeAddress(loadedAddresses, (loadedProfile || profile)?.startPoint));
                    }
                    if (res && res.distanceCache && typeof res.distanceCache === 'object') {
                        setDistanceCache(prev => {
                            const merged = { ...prev, ...res.distanceCache };
                            localStorage.setItem('expert_report_distance_cache', JSON.stringify(merged));
                            return merged;
                        });
                    }

                    // Если новый пользователь — сразу фиксируем userId и pin на листе Профили
                    if (res && (res.status === 'not_found' || res.isNewUser)) {
                        try {
                            await callGoogleScript(scriptUrl, 'saveProfile', {
                                userId: phone,
                                pin: pin,
                                profile: loadedProfile || profile
                            });
                        } catch (e) {
                            console.warn('Не удалось зафиксировать профиль нового пользователя:', e);
                        }
                    }

                    setCloudStatus('saved');
                    return true;
                } catch (err) {
                    console.error('Ошибка загрузки данных с сервера:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка загрузки данных');
                    setAuthError('Ошибка подключения к серверу: ' + (err.message || 'повторите попытку'));
                    return false;
                } finally {
                    setAuthLoading(false);
                    setTimeout(() => {
                        isHydratingRef.current = false;
                    }, 500);
                }
            };

            /* ── Первичная инициализация при старте ── */
            useEffect(() => {
                if (isAuthVerified && userPhone && userPin) {
                    loadUserData(userPhone, userPin);
                } else {
                    isHydratingRef.current = false;
                }
            }, []);

            /* ── Вход пользователя по связке Телефон + ПИН ── */
            const handleLogin = async (cleanPhone, cleanPin) => {
                setAuthError('');
                await loadUserData(cleanPhone, cleanPin);
            };

            /* ── Смена пользователя (безопасный сброс) ── */
            const handleSwitchUser = () => {
                if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                if (addressesDebounceRef.current) clearTimeout(addressesDebounceRef.current);
                localStorage.removeItem('expert_app_user_phone');
                localStorage.removeItem('expert_app_user_pin');
                localStorage.removeItem('expert_app_auth_verified');
                Object.keys(localStorage)
                    .filter(k => k.startsWith('expert_report_'))
                    .forEach(k => localStorage.removeItem(k));
                window.location.reload();
            };

            /* ── Сохранение профиля на сервер ── */
            const saveProfileCloud = async (customProfile) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) return;

                const dataToSave = customProfile || profile;
                setCloudStatus('syncing');
                setCloudErrorMsg('');
                try {
                    const res = await callGoogleScript(scriptUrl, 'saveProfile', {
                        userId: phone,
                        pin: pin,
                        profile: dataToSave
                    });
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        return;
                    }
                    setCloudStatus('saved');
                } catch (err) {
                    console.error('Ошибка сохранения профиля:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка сохранения профиля');
                }
            };

            /* ── Загрузка конкретного месяца с сервера ── */
            const loadMonthCloud = async (customKey) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                const mKey = customKey || currentMonthKey;
                const [targetYear, targetMonth] = mKey.split('-').map(Number);
                const monthTitle = `${MONTH_NAMES[targetMonth] || targetMonth} ${targetYear}`;

                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) {
                    showToast('Для загрузки данных с сервера требуется авторизация', 'error');
                    return false;
                }

                setCloudStatus('syncing');
                setCloudErrorMsg('');

                try {
                    const res = await callGoogleScript(scriptUrl, 'loadUserData', { userId: phone, pin: pin });

                    // Обработка ошибки неверного ПИНа
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        setCloudStatus('error');
                        setCloudErrorMsg('Неверный ПИН-код');
                        return false;
                    }

                    let loadedMonths = {};
                    if (res) {
                        if (res.months && typeof res.months === 'object') loadedMonths = res.months;
                        else if (res.data?.months && typeof res.data.months === 'object') loadedMonths = res.data.months;
                    }

                    let rawCloudMonth = loadedMonths[mKey] || loadedMonths[`${targetYear}-${targetMonth}`];
                    if (typeof rawCloudMonth === 'string') {
                        try {
                            rawCloudMonth = JSON.parse(rawCloudMonth);
                        } catch (e) {
                            console.warn('Ошибка парсинга месяца из строки JSON:', e);
                        }
                    }

                    if (!rawCloudMonth || typeof rawCloudMonth !== 'object') {
                        setCloudStatus('saved');
                        showToast(`На сервере нет сохранённых данных за ${monthTitle}`, 'info');
                        return false;
                    }

                    // Подготавливаем загруженные данные месяца
                    isHydratingRef.current = true;
                    userChangedMonthRef.current = false;

                    let cloudWd = rawCloudMonth.workdays || {};
                    if (typeof cloudWd === 'string') {
                        try { cloudWd = JSON.parse(cloudWd); } catch (e) {}
                    }
                    let cloudRefuels = rawCloudMonth.refuels || [];
                    if (typeof cloudRefuels === 'string') {
                        try { cloudRefuels = JSON.parse(cloudRefuels); } catch (e) {}
                    }

                    const activeSeason = rawCloudMonth.seasonOverride || getSeason(rawCloudMonth.year || targetYear, rawCloudMonth.month || targetMonth);
                    const activeNorm = activeSeason === 'summer'
                        ? (Number(profile.normSummer) || 0)
                        : (Number(profile.normWinter) || 0);

                    const recalced = recalcWorkdays(
                        cloudWd,
                        Number(rawCloudMonth.odometerStart) || 0,
                        Number(rawCloudMonth.fuelStart) || 0,
                        cloudRefuels,
                        activeNorm
                    );

                    const updatedMonthData = {
                        ...rawCloudMonth,
                        year: rawCloudMonth.year || targetYear,
                        month: rawCloudMonth.month || targetMonth,
                        odometerStart: Number(rawCloudMonth.odometerStart) || 0,
                        fuelStart: Number(rawCloudMonth.fuelStart) || 0,
                        refuels: cloudRefuels,
                        workdays: recalced
                    };

                    setMonths(prev => {
                        const updated = { ...prev, [mKey]: updatedMonthData };
                        localStorage.setItem('expert_report_months', JSON.stringify(updated));
                        return updated;
                    });

                    setTimeout(() => {
                        isHydratingRef.current = false;
                    }, 500);

                    setCloudStatus('saved');
                    showToast(`✓ Данные за ${monthTitle} загружены с сервера`, 'success');
                    return true;
                } catch (err) {
                    console.error('Ошибка загрузки месяца с сервера:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка загрузки месяца');
                    showToast('Ошибка загрузки данных с сервера: ' + (err.message || err), 'error');
                    isHydratingRef.current = false;
                    return false;
                }
            };

            /* ── Сохранение месяца на сервер ── */
            const saveMonthCloud = async (customMonthData, customKey) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) return;

                const mData = customMonthData || currentMonthData;
                const mKey = customKey || currentMonthKey;

                const activeSeason = mData.seasonOverride || getSeason(mData.year, mData.month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const summary = getMonthSummary(mData, activeNorm);

                setCloudStatus('syncing');
                setCloudErrorMsg('');
                try {
                    const res = await callGoogleScript(scriptUrl, 'saveMonth', {
                        userId: phone,
                        pin: pin,
                        yearMonth: mKey,
                        summary: summary,
                        monthData: mData
                    });
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        return;
                    }
                    setCloudStatus('saved');
                } catch (err) {
                    console.error('Ошибка сохранения месяца:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка сохранения месяца');
                }
            };

            /* ── Полная очистка текущего месяца ── */
            const handleClearMonth = async () => {
                const [y, m] = currentMonthKey.split('-').map(Number);
                const monthName = MONTH_NAMES[m] || `${m}`;
                const confirmed = showConfirm
                    ? await showConfirm({
                        title: 'Очистка месяца',
                        message: 'Очистить все данные за ' + monthName + ' ' + y + ' (одометр, топливо, заправки, рабочие дни и маршруты)? Данные будут сброшены локально и на сервере.',
                        confirmText: 'Очистить месяц',
                        danger: true
                    })
                    : true;
                if (!confirmed) return;

                const totDays = daysInMonth(y, m);
                const emptyWorkdays = {};
                for (let d = 1; d <= totDays; d++) {
                    const dk = toDateStr(y, m, d);
                    emptyWorkdays[dk] = {
                        isWorkday: false,
                        tripKm: 0,
                        odometerStart: 0,
                        odometerEnd: 0,
                        fuelStart: 0,
                        fuelEnd: 0,
                        trips: []
                    };
                }

                const emptyMonth = {
                    year: y,
                    month: m,
                    seasonOverride: null,
                    odometerStart: 0,
                    fuelStart: 0,
                    refuels: [],
                    workdays: emptyWorkdays
                };

                userChangedMonthRef.current = true;
                setMonths(prev => {
                    const updated = { ...prev, [currentMonthKey]: emptyMonth };
                    localStorage.setItem('expert_report_months', JSON.stringify(updated));
                    return updated;
                });

                if (isAuthVerified) {
                    try {
                        await saveMonthCloud(emptyMonth, currentMonthKey);
                    } catch (e) {
                        console.error('Ошибка сохранения очищенного месяца на сервер:', e);
                    }
                }

                showToast('✓ Месяц очищен локально и на сервере', 'success');
            };

            /* ── Сохранение справочника адресов на сервер ── */
            const saveAddressesCloud = async (customAddresses) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) return;

                const listToSave = customAddresses || addresses;
                setCloudStatus('syncing');
                setCloudErrorMsg('');
                try {
                    const res = await callGoogleScript(scriptUrl, 'saveAddresses', {
                        userId: phone,
                        pin: pin,
                        addresses: listToSave
                    });
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        return;
                    }
                    setCloudStatus('saved');
                } catch (err) {
                    console.error('Ошибка сохранения адресов:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка сохранения адресов');
                }
            };

            /* ── Debounce автосохранения профиля (1500 мс) ── */
            useEffect(() => {
                localStorage.setItem('expert_report_profile', JSON.stringify(profile));
                if (isHydratingRef.current || !isAuthVerified || !userChangedProfileRef.current || !userPhone || !userPin) {
                    return;
                }
                if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                profileDebounceRef.current = setTimeout(() => {
                    saveProfileCloud(profile);
                }, 1500);

                return () => {
                    if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                };
            }, [profile, isAuthVerified]);

            /* ── Debounce автосохранения месяца (2000 мс) ── */
            useEffect(() => {
                localStorage.setItem('expert_report_months', JSON.stringify(months));
                if (isHydratingRef.current || !isAuthVerified || !userChangedMonthRef.current || !userPhone || !userPin) {
                    return;
                }
                if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                monthDebounceRef.current = setTimeout(() => {
                    saveMonthCloud(currentMonthData, currentMonthKey);
                }, 2000);

                return () => {
                    if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                };
            }, [months, currentMonthKey, isAuthVerified]);

            /* ── Debounce автосохранения адресов (1500 мс) ── */
            useEffect(() => {
                localStorage.setItem('expert_report_addresses', JSON.stringify(addresses));
                if (isHydratingRef.current || !isAuthVerified || !userChangedAddressesRef.current || !userPhone || !userPin) {
                    return;
                }
                if (addressesDebounceRef.current) clearTimeout(addressesDebounceRef.current);
                addressesDebounceRef.current = setTimeout(() => {
                    saveAddressesCloud(addresses);
                }, 1500);

                return () => {
                    if (addressesDebounceRef.current) clearTimeout(addressesDebounceRef.current);
                };
            }, [addresses, isAuthVerified]);

            /* ── Применение распределения недостающего пробега к месяцу ── */
            const handleApplyDistribution = (distributionMap) => {
                if (!distributionMap || Object.keys(distributionMap).length === 0) return;

                const year = currentMonthData.year;
                const month = currentMonthData.month;
                const totalDays = daysInMonth(year, month);
                const activeSeason = currentMonthData.seasonOverride || getSeason(year, month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const wd = { ...(currentMonthData.workdays || {}) };
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (!wd[key]) {
                        wd[key] = {
                            isWorkday: false,
                            tripKm: 0,
                            odometerStart: 0,
                            odometerEnd: 0,
                            fuelStart: 0,
                            fuelEnd: 0,
                            trips: [],
                        };
                    }
                }

                let totalAdded = 0;
                let daysCount = 0;
                Object.entries(distributionMap).forEach(([dateKey, addedKm]) => {
                    const add = Math.round(Number(addedKm) || 0);
                    if (add > 0) {
                        if (!wd[dateKey]) {
                            wd[dateKey] = {
                                isWorkday: true,
                                tripKm: 0,
                                odometerStart: 0,
                                odometerEnd: 0,
                                fuelStart: 0,
                                fuelEnd: 0,
                                trips: [],
                            };
                        }
                        wd[dateKey] = {
                            ...wd[dateKey],
                            isWorkday: true,
                            tripKm: Math.round(((Number(wd[dateKey].tripKm) || 0) + add) * 10) / 10
                        };
                        totalAdded += add;
                        daysCount++;
                    }
                });

                const recalced = recalcWorkdays(
                    wd,
                    currentMonthData.odometerStart,
                    currentMonthData.fuelStart,
                    currentMonthData.refuels || [],
                    activeNorm
                );

                updateCurrentMonth({
                    ...currentMonthData,
                    workdays: recalced
                }, true);

                showToast(`✓ Успешно распределено ${totalAdded} км по ${daysCount} дням месяца!`, 'success');
            };

            /* ── Применение сгенерированных маршрутов-петель к месяцу ── */
            const handleApplyRoutes = async (routePreviewMap) => {
                if (!routePreviewMap || Object.keys(routePreviewMap).length === 0) return;

                const year = currentMonthData.year;
                const month = currentMonthData.month;
                const activeSeason = currentMonthData.seasonOverride || getSeason(year, month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const wd = { ...(currentMonthData.workdays || {}) };
                let daysUpdated = 0;
                let totalTripsCount = 0;

                Object.entries(routePreviewMap).forEach(([dateKey, routeInfo]) => {
                    if (wd[dateKey] && Array.isArray(routeInfo?.trips) && routeInfo.trips.length > 0) {
                        const rawKm = (routeInfo.fitApplied && typeof routeInfo.actualKm === 'number')
                            ? routeInfo.actualKm
                            : (Number(wd[dateKey].tripKm) || routeInfo.targetKm || 0);
                        const newKm = Math.round(rawKm);

                        wd[dateKey] = {
                            ...wd[dateKey],
                            trips: routeInfo.trips,
                            tripKm: newKm
                        };
                        daysUpdated++;
                        totalTripsCount += routeInfo.trips.length;
                    }
                });

                const recalced = recalcWorkdays(
                    wd,
                    currentMonthData.odometerStart,
                    currentMonthData.fuelStart,
                    currentMonthData.refuels || [],
                    activeNorm
                );

                // Проверка на отрицательный остаток топлива
                const hasNegativeFuel = Object.values(recalced).some(d => d.isWorkday && Number(d.fuelEnd) < -0.0001);
                if (hasNegativeFuel) {
                    const proceed = showConfirm
                        ? await showConfirm({
                            title: 'Отрицательный остаток топлива',
                            message: 'После пересчёта маршрутов в некоторые дни остаток топлива опускается ниже нуля.\nПрименить изменения всё равно?',
                            confirmText: 'Применить всё равно',
                            danger: true
                        })
                        : true;
                    if (!proceed) return;
                }

                updateCurrentMonth({
                    ...currentMonthData,
                    workdays: recalced
                }, true);

                showToast(`✓ Заполнено ${totalTripsCount} точек маршрута в ${daysUpdated} рабочих днях`, 'success');
            };

            /* ── Экспорт отчёта в .xlsx по шаблону template.xlsx ── */
            const exportReportToExcel = async (exportProfile, exportMonthData) => {
                if (isExporting) return;
                if (typeof ExcelJS === 'undefined') {
                    showToast('Ошибка: библиотека ExcelJS не загружена. Проверьте интернет.', 'error');
                    return;
                }
                setIsExporting(true);
                try {
                    const buf = await loadTemplateBuffer(templateBufferRef);
                    const wb = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);
                    wb.calcProperties.fullCalcOnLoad = true;

                    const p = exportProfile || profile;
                    const mData = exportMonthData || currentMonthData;
                    const year = mData.year;
                    const month = mData.month;
                    const activeSeason = mData.seasonOverride || getSeason(year, month);
                    const activeNorm = activeSeason === 'summer'
                        ? (Number(p.normSummer) || 0)
                        : (Number(p.normWinter) || 0);
                    const totalDays = daysInMonth(year, month);

                    /* ── 1. Лист «Карточка сотрудника» ── */
                    const wsCard = wb.getWorksheet('Карточка сотрудника');
                    if (wsCard) {
                        wsCard.getCell('C2').value = p.fullName || '';
                        wsCard.getCell('C3').value = p.position || '';
                        wsCard.getCell('C4').value = p.organization || '';
                        wsCard.getCell('C5').value = Number(p.normSummer) || 0;
                        wsCard.getCell('C6').value = Number(p.normWinter) || 0;
                        wsCard.getCell('C8').value = p.carBrand || '';
                        wsCard.getCell('C9').value = p.carPlate || '';
                        wsCard.getCell('C10').value = p.driverLicense || '';
                        wsCard.getCell('C11').value = p.fuelType || '';
                    }

                    /* ── 2. Лист «Расчет» ── */
                    const wsCalc = wb.getWorksheet('Расчет');
                    if (wsCalc) {
                        const setFormulaResult = (cell, computedValue) => {
                            if (!cell) return;
                            if (cell.value && typeof cell.value === 'object' && (cell.value.formula || cell.value.sharedFormula)) {
                                cell.value = { ...cell.value, result: computedValue };
                            }
                        };

                        wsCalc.getCell('J2').value = activeNorm;
                        wsCalc.getCell('F5').value = Number(mData.fuelStart) || 0;

                        // Даты B5:B35 — значения (не формулы)
                        for (let d = 1; d <= 31; d++) {
                            const row = d + 4;
                            const bCell = wsCalc.getCell(`B${row}`);
                            if (d <= totalDays) {
                                bCell.value = new Date(Date.UTC(year, month - 1, d));
                            } else {
                                bCell.value = null;
                            }
                        }

                        // Одометр и заправки: только рабочие дни
                        let currentOdo = Math.round(Number(mData.odometerStart) || 0);
                        let runningFuel = Number(mData.fuelStart) || 0;
                        let totalKmSum = 0;
                        let totalRefuelSum = 0;
                        let totalSpentSum = 0;

                        for (let d = 1; d <= 31; d++) {
                            const row = d + 4;
                            const dateKey = toDateStr(year, month, d);
                            const dayObj = (mData.workdays || {})[dateKey];
                            const isWorking = dayObj && dayObj.isWorkday && d <= totalDays;
                            const refuelLiters = (mData.refuels || [])
                                .filter(r => r.date === dateKey)
                                .reduce((s, r) => s + (Number(r.liters) || 0), 0);
                            const kmInt = isWorking ? Math.round(Number(dayObj.tripKm) || 0) : 0;

                            if (isWorking) {
                                // Пропускаем дни с 0 км и без заправки — не пишем одометр
                                if (kmInt === 0 && refuelLiters === 0) {
                                    wsCalc.getCell(`C${row}`).value = null;
                                    wsCalc.getCell(`D${row}`).value = null;
                                    wsCalc.getCell(`G${row}`).value = null;
                                } else {
                                    wsCalc.getCell(`C${row}`).value = currentOdo;
                                    wsCalc.getCell(`D${row}`).value = currentOdo + kmInt;
                                    wsCalc.getCell(`G${row}`).value = refuelLiters > 0 ? refuelLiters : null;
                                    currentOdo += kmInt;
                                }
                            } else {
                                wsCalc.getCell(`C${row}`).value = null;
                                wsCalc.getCell(`D${row}`).value = null;
                                wsCalc.getCell(`G${row}`).value = null;
                            }

                            // Параллельный расчёт показателей дня для обновления кэша формул
                            const dayKm = isWorking ? kmInt : 0;
                            const fuelAtStart = runningFuel;
                            const dayRefuel = isWorking ? refuelLiters : 0;
                            const daySpent = activeNorm > 0 ? Number((dayKm * activeNorm / 100).toFixed(3)) : 0;
                            const fuelAtEnd = Number((fuelAtStart + dayRefuel - daySpent).toFixed(3));
                            runningFuel = fuelAtEnd;

                            totalKmSum += dayKm;
                            totalRefuelSum += dayRefuel;
                            totalSpentSum += daySpent;

                            // Обновление кэша result для формульных ячеек строки
                            setFormulaResult(wsCalc.getCell(`E${row}`), dayKm);
                            if (row > 5) {
                                setFormulaResult(wsCalc.getCell(`F${row}`), fuelAtStart);
                            }
                            setFormulaResult(wsCalc.getCell(`I${row}`), daySpent);
                            setFormulaResult(wsCalc.getCell(`J${row}`), fuelAtEnd);

                            // Проверка столбца H («Заправлено наличными»): если значение 0 — оставляем ячейку пустой (null)
                            const hCell = wsCalc.getCell(`H${row}`);
                            if (hCell && (hCell.value === 0 || hCell.value === '0')) {
                                hCell.value = null;
                            }
                        }

                        // Обновление кэша result в итоговой строке 36
                        setFormulaResult(wsCalc.getCell('E36'), totalKmSum);
                        setFormulaResult(wsCalc.getCell('G36'), Number(totalRefuelSum.toFixed(3)));
                        setFormulaResult(wsCalc.getCell('I36'), Number(totalSpentSum.toFixed(3)));
                    }

                    /* ── 3. Путевые листы «1»..«31» — маршрутные строки ── */
                    for (let d = 1; d <= 31; d++) {
                        const wsDay = wb.getWorksheet(String(d));
                        if (!wsDay) continue;

                        const dateKey = toDateStr(year, month, d);
                        const dayObj = (mData.workdays || {})[dateKey];
                        const isWorking = dayObj && dayObj.isWorkday && d <= totalDays;
                        const kmInt = isWorking ? Math.round(Number(dayObj.tripKm) || 0) : 0;

                        // Очищаем строки маршрута B64..B93 перед записью
                        for (let rowIdx = 64; rowIdx <= 93; rowIdx++) {
                            wsDay.getCell(`B${rowIdx}`).value = null;
                        }

                        if (isWorking && kmInt > 0 && Array.isArray(dayObj.trips) && dayObj.trips.length > 0) {
                            const startPoint = (p.startPoint || '').trim();
                            // Строим список адресов маршрута-петли
                            const routeAddresses = [];
                            // 1. Точка старта
                            routeAddresses.push(startPoint);
                            // 2. Промежуточные точки (поддержка объектов {address} и строк)
                            const intermediates = dayObj.trips
                                .map(tr => typeof tr === 'string' ? tr.trim() : (tr.address || tr.to || '').trim())
                                .filter(addr => addr.length > 0);
                            // Обрезаем до 28 промежуточных (оставляем место для старта + возврата)
                            intermediates.slice(0, 28).forEach(addr => routeAddresses.push(addr));
                            // 3. Возврат в точку старта
                            if (startPoint && routeAddresses[routeAddresses.length - 1] !== startPoint) {
                                routeAddresses.push(startPoint);
                            }
                            // Записываем: максимум 30 строк (B64..B93)
                            routeAddresses.slice(0, 30).forEach((addr, idx) => {
                                wsDay.getCell(`B${64 + idx}`).value = addr;
                            });
                        }
                    }

                    /* ── 4. Генерация и скачивание файла ── */
                    const outBuf = await wb.xlsx.writeBuffer();
                    const blob = new Blob([outBuf], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    });
                    const url = URL.createObjectURL(blob);
                    const lastName = (p.fullName || 'Отчет').split(' ')[0] || 'Отчет';
                    const monthStr = String(month).padStart(2, '0');
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Автоотчет_${year}-${monthStr}_${lastName}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
