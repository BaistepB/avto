        };

        /* ═══════════════════════════════════════════════════
           9. КОМПОНЕНТ: ЭКРАН АВТОПОДБОРА
        ═══════════════════════════════════════════════════ */
        const AutoSelectScreen = ({
            monthData,
            profile,
            addresses = [],
            onUpdateAddresses,
            onSaveAddressesCloud,
            allMonths = {},
            onApplyDistribution,
            onApplyRoutes,
            onUpdateMonth,
            distanceCache = {},
            onUpdateDistanceCache,
            settings = {},
            cloudStatus,
            onExportExcel,
            userPhone,
            theme = 'expert',
            showToast,
            showConfirm,
            showAlert,
            t
        }) => {
            const year  = monthData.year;
            const month = monthData.month;
            const totalDays = daysInMonth(year, month);
            const activeSeason = monthData.seasonOverride || getSeason(year, month);
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            /* ── Способ расчёта: по остатку топлива ('fuel') или по одометру на конец месяца ('odometer') ── */
            const [goalType, setGoalType] = useState('fuel');
            const [targetFuel, setTargetFuel] = useState('');
            const [isTargetFuelFocused, setIsTargetFuelFocused] = useState(false);
            const [targetOdometer, setTargetOdometer] = useState('');
            const [fitRoutesToMonthlyOdometer, setFitRoutesToMonthlyOdometer] = useState(true);
            const [routePreviewMap, setRoutePreviewMap] = useState(null);
            const [isGeneratingRoutes, setIsGeneratingRoutes] = useState(false);
            const [generationProgress, setGenerationProgress] = useState('');
            const [hasAnyOsrmRoutes, setHasAnyOsrmRoutes] = useState(false);
            const [isCalculatingRouteKm, setIsCalculatingRouteKm] = useState(false);
            const [detectedStartInfo, setDetectedStartInfo] = useState(null);

            const odometerStart = Number(monthData.odometerStart) || 0;
            const fuelStart     = Number(monthData.fuelStart) || 0;
            const totalRefuels  = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const workdays      = monthData.workdays || {};
            const workdayKeys   = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const kmFromRoutes  = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);

            /* ── Дни с загруженными маршрутами, у которых пробег ещё не рассчитан ── */
            const uncalculatedRouteDays = workdayKeys.filter(k => {
                const d = workdays[k];
                return (d.trips || []).length > 0 && (Number(d.tripKm) || 0) === 0;
            });

            let target = 0;
            let requiredFuel = 0;
            let requiredKm = 0;
            let projectedFuelEnd = 0;
            let missingKm = 0;
            let targetTotal = 0;

            if (goalType === 'fuel') {
                target = parseFuelInput(targetFuel);
                requiredFuel = fuelStart + totalRefuels - target;
                requiredKm = activeNorm > 0 ? (requiredFuel / activeNorm * 100) : 0;
                missingKm = Math.max(0, requiredKm - kmFromRoutes);
                targetTotal = Math.round(missingKm);
                projectedFuelEnd = target;
            } else {
                const targetOdoVal = Number(targetOdometer) || 0;
                requiredKm = targetOdoVal > 0 ? Math.max(0, targetOdoVal - odometerStart) : 0;
                requiredFuel = activeNorm > 0 ? (requiredKm * activeNorm / 100) : 0;
                projectedFuelEnd = fuelStart + totalRefuels - requiredFuel;
                missingKm = Math.max(0, requiredKm - kmFromRoutes);
                targetTotal = Math.round(missingKm);
                target = Math.max(0, projectedFuelEnd);
            }

            /* ── Стили текущей темы оформления ── */
            const isRedButtonTheme = theme === 'expert' || theme === 'expert-dark';
            const alertBannerClass = isRedButtonTheme
                ? 'bg-amber-400 text-slate-950 border border-amber-500 shadow-sm font-semibold'
                : 'bg-red-600 text-white border border-red-700 shadow-sm font-medium';
            const alertBannerBtnClass = isRedButtonTheme
                ? 'bg-slate-900 text-white hover:bg-slate-800 font-bold'
                : 'bg-white text-red-700 hover:bg-red-50 font-bold';

            const accentClass = t(
                'text-[#FFB300]','text-amber-700','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );
            const cardClass = t(
                'bg-[#1E2125] border-[#3A3D42]',
                'bg-gray-50 border-gray-200',
                'bg-pink-50 border-pink-200',
                'bg-blue-50/50 border-blue-200',
                'bg-emerald-50 border-emerald-200',
                'bg-[#F5F2EE] border-[#D7CCC8]',
                'bg-gray-50 border-gray-200'
            );
            const inputSm = t(
                'bg-[#282B30] border-gray-700 text-white placeholder-gray-500',
                'bg-white border-gray-300 text-gray-900 placeholder-gray-400',
                'bg-pink-50 border-pink-200 text-pink-900 placeholder-pink-400',
                'bg-blue-50 border-blue-200 text-blue-900 placeholder-blue-400',
                'bg-emerald-50 border-emerald-200 text-emerald-900 placeholder-emerald-400',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723] placeholder-[#A1887F]',
                'bg-white border-gray-300 text-gray-900 placeholder-gray-400'
            );
            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );
            const btnStepAction = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-teal-100 hover:bg-teal-200 text-teal-900 border border-teal-300',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );
            const btnExportExcel = (theme === 'expert' || theme === 'expert-dark')
                ? 'bg-green-600 hover:bg-green-700 active:bg-green-800 text-white shadow-md'
                : (theme === 'pastel')
                    ? 'bg-[#4355B9] hover:bg-[#36459E] active:bg-[#2C3985] text-white shadow-md'
                    : t(
                        'bg-green-600 hover:bg-green-700 active:bg-green-800 text-white',
                        'bg-green-600 hover:bg-green-700 text-white',
                        'bg-pink-600 hover:bg-pink-700 text-white',
                        'bg-blue-600 hover:bg-blue-700 text-white',
                        'bg-teal-800 hover:bg-teal-900 text-white shadow-md border border-teal-600',
                        'bg-[#5D4037] hover:bg-[#4E342E] text-white',
                        'bg-green-600 hover:bg-green-700 active:bg-green-800 text-white shadow-md'
                    );
            const btnSecondary = t(
                'bg-[#282B30] text-gray-300 hover:bg-[#32363C] border border-gray-700',
                'bg-white text-gray-700 hover:bg-gray-50 border border-gray-300',
                'bg-pink-100 text-pink-800 hover:bg-pink-200 border border-pink-300',
                'bg-blue-100 text-blue-800 hover:bg-blue-200 border border-blue-300',
                'bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300',
                'bg-[#EFEBE9] text-[#4E342E] hover:bg-[#D7CCC8] border border-[#BCAAA4]',
                'bg-gray-100 text-gray-800 hover:bg-gray-200 border border-gray-300'
            );
            const listRowHover = t(
                'hover:bg-[#282B30] border-gray-800',
                'hover:bg-gray-100 border-gray-200',
                'hover:bg-pink-100 border-pink-200',
                'hover:bg-blue-100 border-blue-200',
                'hover:bg-emerald-100 border-emerald-200',
                'hover:bg-[#EFEBE9] border-[#D7CCC8]',
                'hover:bg-gray-100 border-gray-200'
            );

            /* ── Состояния справочника адресов ── */
            const [isAddressesOpen, setIsAddressesOpen] = useState(false);
            const [newAddr, setNewAddr] = useState('');
            const [newNote, setNewNote] = useState('');
            const [isBulkAdd, setIsBulkAdd] = useState(false);
            const [bulkText, setBulkText] = useState('');

            /* ── Состояния распределения пробега ── */
            const [selectedDays, setSelectedDays] = useState({});
            const [minKm, setMinKm] = useState(70);
            const [maxKm, setMaxKm] = useState(160);
            const [distributionMap, setDistributionMap] = useState(null);

            /* ── Дни с заправками > 0 л (обязательные) ── */
            const refuelDates = useMemo(() => {
                const s = new Set();
                (monthData.refuels || []).forEach(r => {
                    if (r.date && (Number(r.liters) || 0) > 0) {
                        s.add(r.date);
                    }
                });
                return s;
            }, [monthData.refuels]);

            /* ── Итоговый список выбранных дней ── */
            const selectedKeys = useMemo(() => {
                const list = [];
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (refuelDates.has(key) || selectedDays[key]) {
                        list.push(key);
                    }
                }
                return list;
            }, [totalDays, year, month, refuelDates, selectedDays]);

            /* ── Переключение дня ── */
            const toggleDay = (dateKey) => {
                if (refuelDates.has(dateKey)) return;
                setSelectedDays(prev => {
                    const next = { ...prev };
                    if (next[dateKey]) delete next[dateKey];
                    else next[dateKey] = true;
                    return next;
                });
                setDistributionMap(null);
            };

            /* ── Предупреждение о крупной заправке в конце месяца и перегруженных днях ── */
            const lateRefuelInfo = useMemo(() => {
                const validRefuels = (monthData.refuels || []).filter(r => (Number(r.liters) || 0) > 0);
                if (validRefuels.length === 0 || activeNorm <= 0) return null;

                // Уникальные даты заправок, отсортированные хронологически
                const refDates = [...new Set(validRefuels.map(r => r.date))].sort();

                let maxNeedTarget = 0;
                for (const refDate of refDates) {
                    const tailRefuels = validRefuels
                        .filter(r => r.date >= refDate)
                        .reduce((s, r) => s + (Number(r.liters) || 0), 0);

                    const tailSelectedDays = Math.max(1, selectedKeys.filter(k => k >= refDate).length);
                    const maxSafeBurn = tailSelectedDays * 180 * activeNorm / 100;
                    const needTarget = Math.max(0, tailRefuels - maxSafeBurn);

                    if (needTarget > maxNeedTarget) {
                        maxNeedTarget = needTarget;
                    }
                }

                const recommendedFuel = Number((Math.ceil(maxNeedTarget * 10) / 10).toFixed(1));
                const isTailOverloaded = activeNorm > 0 && recommendedFuel > 0 && (target < recommendedFuel - 0.05);

                const hasOverloadedDayInPreview = distributionMap
                    ? Object.entries(distributionMap).some(([k, add]) => ((Number(workdays[k]?.tripKm) || 0) + Number(add)) > 200)
                    : false;

                const isEndMonthOverloaded = isTailOverloaded || hasOverloadedDayInPreview;

                if (!isEndMonthOverloaded) return null;

                return {
                    recommendedFuel,
                    isTailOverloaded,
                    hasOverloadedDayInPreview,
                    isEndMonthOverloaded
                };
            }, [monthData.refuels, selectedKeys, activeNorm, target, distributionMap, workdays]);

            const isEndMonthOverloaded = Boolean(lateRefuelInfo?.isEndMonthOverloaded);

            /* ── Автовыбор оптимального количества дней с учётом топлива ── */
            const handleAutoSelectDays = () => {
                if (targetTotal <= 0) {
                    if (showToast) showToast('Недостающий пробег равен 0 км.', 'info');
                    return;
                }
                const lo = Math.max(1, Number(minKm) || 70);
                const hi = Math.max(lo, Number(maxKm) || 160);
                const avg = (lo + hi) / 2;
                const optimalCount = Math.min(totalDays, Math.max(1, Math.ceil(targetTotal / avg)));

                const newSelected = {};
                refuelDates.forEach(k => { newSelected[k] = true; });

                // Просчитываем доступное топливо хронологически и определяем доступные дни
                const availableDays = [];
                let runningFuel = Number(monthData.fuelStart) || 0;
                const minFuelNeeded = activeNorm > 0 ? ((lo * activeNorm / 100) + 0.1) : 0;

                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    const refuelLiters = (monthData.refuels || [])
                        .filter(r => r.date === k)
                        .reduce((s, r) => s + (Number(r.liters) || 0), 0);
                    runningFuel += refuelLiters;

                    const dayObj = workdays[k];
                    const existingKm = Number(dayObj?.tripKm) || 0;
                    const hasTrips = (dayObj?.trips || []).length > 0;
                    const hasRefuel = refuelLiters > 0;

                    const isFuelSufficient = activeNorm > 0 ? (runningFuel >= minFuelNeeded) : true;

                    // Если день ещё не выбран (не день с заправкой > 0 л) и в нём нет реальных поездок
                    if (!newSelected[k] && !hasTrips) {
                        if (isFuelSufficient) {
                            availableDays.push(k);
                        }
                    }

                    // Вычитаем существующий расход от имеющихся поездок дня
                    if (existingKm > 0 && activeNorm > 0) {
                        runningFuel = Math.max(0, runningFuel - (existingKm * activeNorm / 100));
                    }
                }

                let currentCount = Object.keys(newSelected).length;
                if (currentCount < optimalCount) {
                    const needed = optimalCount - currentCount;
                    if (needed > 0 && availableDays.length > 0) {
                        const step = availableDays.length / needed;
                        for (let i = 0; i < needed; i++) {
                            const idx = Math.min(availableDays.length - 1, Math.floor(i * step));
                            newSelected[availableDays[idx]] = true;
                        }
                    }
                }

                setSelectedDays(newSelected);
                setDistributionMap(null);
            };

            /* ── Алгоритм распределения пробега с хронологической защитой топлива ── */
            const generateDistribution = () => {
                if (targetTotal <= 0) {
                    if (showToast) showToast('Недостающий пробег равен 0 км.', 'info');
                    return;
                }
                if (selectedKeys.length === 0) {
                    if (showToast) showToast('Выберите хотя бы один день для распределения пробега.', 'info');
                    return;
                }

                const lo = Math.max(1, Number(minKm) || 70);
                const hi = Math.max(lo, Number(maxKm) || 160);

                // Базовые случайные веса для выбранных дней
                const randoms = selectedKeys.map(() => lo + Math.random() * (hi - lo));
                const sumR = randoms.reduce((a, b) => a + b, 0);
                const rawAlloc = randoms.map(r => Math.round((r * targetTotal) / sumR));

                // 1. Хронологический проход с точным контролем топлива через getMaxSafeKmForDay
                const alloc = {};
                selectedKeys.forEach(k => { alloc[k] = 0; });

                const simWorkdays = {};
                for (let d = 1; d <= totalDays; d++) {
                    const dk = toDateStr(year, month, d);
                    const originalDay = workdays[dk];
                    simWorkdays[dk] = originalDay
                        ? { ...originalDay, isWorkday: !!originalDay.isWorkday, tripKm: Number(originalDay.tripKm) || 0 }
                        : { isWorkday: false, tripKm: 0, trips: [] };
                }

                let unallocated = targetTotal;

                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    if (!selectedKeys.includes(k)) continue;

                    const idx = selectedKeys.indexOf(k);
                    const desiredKm = rawAlloc[idx] || 0;

                    // Максимально безопасный пробег с учётом ВСЕХ будущих дней и заправок
                    const safeCapKm = getMaxSafeKmForDay(
                        simWorkdays,
                        k,
                        monthData.refuels,
                        monthData.fuelStart,
                        activeNorm,
                        0.2
                    );

                    const curBaseKm = Number(workdays[k]?.tripKm) || 0;
                    const maxAddable = Math.max(0, safeCapKm - curBaseKm);
                    const give = Math.min(desiredKm, maxAddable, unallocated);
                    alloc[k] = give;
                    unallocated -= give;

                    // Фиксируем в simWorkdays для последующих дней
                    simWorkdays[k].isWorkday = true;
                    simWorkdays[k].tripKm = curBaseKm + give;
                }

                // 2. Доводка остатка unallocated / невязки delta по ±1 км через getMaxSafeKmForDay
                let currentSum = Object.values(alloc).reduce((a, b) => a + b, 0);
                let delta = targetTotal - currentSum;

                let loopSafety = 0;
                while (delta !== 0 && loopSafety < 10000) {
                    loopSafety++;
                    if (delta > 0) {
                        const eligible = [];
                        for (const k of selectedKeys) {
                            const safeCap = getMaxSafeKmForDay(
                                simWorkdays,
                                k,
                                monthData.refuels,
                                monthData.fuelStart,
                                activeNorm,
                                0.2
                            );
                            const curBaseKm = Number(workdays[k]?.tripKm) || 0;
                            const curTotalKm = curBaseKm + (alloc[k] || 0);
                            if (curTotalKm + 1 <= safeCap) {
                                eligible.push(k);
                            }
                        }
                        if (eligible.length === 0) break; // топливный бак физически исчерпан
                        const preferred = eligible.filter(k => alloc[k] < hi);
                        const pool = preferred.length > 0 ? preferred : eligible;
                        const chosen = pool[Math.floor(Math.random() * pool.length)];
                        alloc[chosen] += 1;
                        simWorkdays[chosen].tripKm += 1;
                        delta -= 1;
                    } else {
                        const eligible = selectedKeys.filter(k => alloc[k] > 1);
                        if (eligible.length === 0) break;
                        const chosen = eligible[Math.floor(Math.random() * eligible.length)];
                        alloc[chosen] -= 1;
                        simWorkdays[chosen].tripKm -= 1;
                        delta += 1;
                    }
                }

                setDistributionMap(alloc);
            };

            /* ── Пересчёт цепочки для предпросмотра с остатками топлива ── */
            const previewRecalced = useMemo(() => {
                if (!distributionMap) return null;
                const tempWd = { ...workdays };
                for (let d = 1; d <= totalDays; d++) {
                    const k = toDateStr(year, month, d);
                    if (!tempWd[k]) {
                        tempWd[k] = { isWorkday: false, tripKm: 0, odometerStart: 0, odometerEnd: 0, fuelStart: 0, fuelEnd: 0, trips: [] };
                    } else {
                        tempWd[k] = { ...tempWd[k] };
                    }
                }
                Object.entries(distributionMap).forEach(([k, add]) => {
                    const base = Number(tempWd[k]?.tripKm) || 0;
                    tempWd[k].isWorkday = true;
                    tempWd[k].tripKm = Math.round((base + Number(add)) * 10) / 10;
                });

                return recalcWorkdays(
                    tempWd,
                    monthData.odometerStart,
                    monthData.fuelStart,
                    monthData.refuels || [],
                    activeNorm
                );
            }, [distributionMap, workdays, monthData, activeNorm, totalDays, year, month]);

            const hasNegativeFuelInPreview = useMemo(() => {
                if (!previewRecalced) return false;
                return Object.values(previewRecalced).some(d => d.isWorkday && (Number(d.fuelEnd) || 0) < -0.0001);
            }, [previewRecalced]);

            /* ── Применение распределения (Страховка 1: мгновенный сброс предпросмотра) ── */
            const handleApply = () => {
                if (isEndMonthOverloaded) return;
                if (!distributionMap) return;
                const mapToApply = distributionMap;
                setDistributionMap(null);
                onApplyDistribution(mapToApply);
            };

            /* ── Добавление одного адреса в справочник ── */
            const handleAddAddress = () => {
                const trimmedAddr = newAddr.trim();
                const trimmedNote = newNote.trim();
                if (!trimmedAddr) return;

                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const cleanInput = trimmedAddr.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                if (cleanStart && cleanInput === cleanStart) {
                    if (showToast) showToast('Этот адрес совпадает с точкой старта. В справочник добавляются только точки поездок.', 'info');
                    return;
                }

                const exists = addresses.some(a => (a.address || '').trim().toLowerCase() === trimmedAddr.toLowerCase());
                if (exists) {
                    if (showToast) showToast('Такой адрес уже есть в справочнике.', 'info');
                    return;
                }

                const updated = [...addresses, { address: trimmedAddr, note: trimmedNote }];
                onUpdateAddresses(updated, true);
                setNewAddr('');
                setNewNote('');
            };

            /* ── Массовая вставка адресов ── */
            const handleBulkAdd = () => {
                if (!bulkText.trim()) return;
                const lines = bulkText.split('\n');
                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const existingSet = new Set(addresses.map(a => (a.address || '').trim().toLowerCase()));

                const addedList = [];
                const seenInBatch = new Set();

                lines.forEach(rawLine => {
                    const trimmed = rawLine.trim();
                    if (!trimmed) return;
                    const clean = trimmed.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                    if (cleanStart && clean === cleanStart) return;
                    const low = trimmed.toLowerCase();
                    if (existingSet.has(low) || seenInBatch.has(low)) return;

                    seenInBatch.add(low);
                    addedList.push({ address: trimmed, note: '' });
                });

                if (addedList.length === 0) {
                    if (showToast) showToast('Новых адресов не найдено.', 'info');
                    return;
                }

                const updated = [...addresses, ...addedList];
                onUpdateAddresses(updated, true);
                setBulkText('');
                setIsBulkAdd(false);
                if (showToast) showToast(`✓ Добавлено новых адресов: ${addedList.length}`, 'success');
            };

            /* ── Пополнение из всех загруженных Маршрутов ── */
            const handleImportFromRoutes = () => {
                const cleanStart = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const existingSet = new Set(addresses.map(a => (a.address || '').trim().toLowerCase()));
                const collected = [];
                const seen = new Set();

                Object.values(allMonths || {}).forEach(m => {
                    if (!m || !m.workdays) return;
                    Object.values(m.workdays).forEach(day => {
                        if (!day || !Array.isArray(day.trips)) return;
                        day.trips.forEach(trip => {
                            const rawAddr = (trip.address || '').trim();
                            if (!rawAddr) return;
                            const clean = rawAddr.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                            if (cleanStart && clean === cleanStart) return;
                            const low = rawAddr.toLowerCase();
                            if (existingSet.has(low) || seen.has(low)) return;

                            seen.add(low);
                            collected.push({
                                address: rawAddr,
                                note: trip.taskType || trip.time ? [trip.taskType, trip.time].filter(Boolean).join(', ') : ''
                            });
                        });
                    });
                });

                if (collected.length === 0) {
                    if (showToast) showToast('В загруженных маршрутах не найдено новых адресов.', 'info');
                    return;
                }

                const updated = ensureDefaultOfficeAddress([...addresses, ...collected], profile?.startPoint);
                onUpdateAddresses(updated, true);
                if (showToast) showToast(`✓ Успешно добавлено ${collected.length} новых адресов из маршрутов!`, 'success');
            };

            /* ── Удаление адреса из справочника ── */
            const handleDeleteAddress = async (idx) => {
                const item = addresses[idx];
                const cleanItem = (item?.address || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                const cleanOffice = DEFAULT_OFFICE_ADDRESS.address.toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                if (cleanItem === cleanOffice) {
                    const confirmed = showConfirm
                        ? await showConfirm({
                            title: 'Удаление адреса офиса',
                            message: 'Это стандартный адрес офиса и склада. Вы уверены, что хотите удалить его из списка?',
                            confirmText: 'Удалить адрес',
                            danger: true
                        })
                        : true;
                    if (!confirmed) return;
                }
                const updated = addresses.filter((_, i) => i !== idx);
                onUpdateAddresses(updated, true);
                if (showToast) showToast('Адрес удалён из справочника', 'info');
            };

            /* ── Расчёт реального пробега загруженных из CSV маршрутов ── */
            const calculateExistingRoutesKm = async () => {
                const targetDayKeys = workdayKeys.filter(k => {
                    const d = workdays[k];
                    return d?.isWorkday && (d.trips || []).length > 0 && (Number(d.tripKm) || 0) === 0;
                });

                if (targetDayKeys.length === 0) {
                    if (showToast) showToast('Все дни с маршрутами уже имеют рассчитанный пробег.', 'info');
                    return;
                }

                const startPoint = (profile?.startPoint || '').trim();
                if (!startPoint) {
                    if (showToast) showToast('Укажите домашний адрес (Точку старта) во вкладке «Профиль»!', 'error');
                    return;
                }

                setIsCalculatingRouteKm(true);

                try {
                    const yandexKey = settings?.yandexApiKey || '';
                    const initialCache = getGeoCache();

                    // Геокодируем стартовую точку
                    const startKey = normalizeGeoKey(startPoint);
                    const isStartCached = !!initialCache[startKey];
                    const startCoords = await geocodeAddress(startPoint, yandexKey);
                    if (!isStartCached) {
                        await new Promise(r => setTimeout(r, 250));
                    }

                    if (!startCoords) {
                        if (showToast) showToast('Не удалось определить координаты точки старта. Проверьте адрес в профиле.', 'error');
                        return;
                    }

                    const newWorkdays = { ...workdays };
                    const newCacheEntries = {};
                    let totalAddedKm = 0;
                    let updatedDaysCount = 0;

                    for (const dateKey of targetDayKeys) {
                        const dayObj = workdays[dateKey];
                        const trips = dayObj?.trips || [];
                        const tripAddrs = trips
                            .map(tr => (typeof tr === 'string' ? tr : (tr.address || tr.to || '')).trim())
                            .filter(Boolean);

                        if (tripAddrs.length === 0) continue;

                        // Геокодируем адреса дня с паузой 250 мс для некашированных адресов
                        const coordsList = [];
                        for (const addr of tripAddrs) {
                            const k = normalizeGeoKey(addr);
                            const isCached = !!getGeoCache()[k];
                            const c = await geocodeAddress(addr, yandexKey);
                            if (!isCached) {
                                await new Promise(r => setTimeout(r, 250));
                            }
                            coordsList.push(c || findApproxCoords(addr));
                        }

                        // Собираем полную петлю: Точка старта -> промежуточные точки -> Точка старта
                        const loopCoords = [startCoords, ...coordsList, startCoords];
                        const osrmResult = await fetchOsrmLoop(loopCoords);
                        const loopKm = osrmResult.totalKm;
                        const legs = osrmResult.legs || [];

                        // Сохраняем плечи в кэш расстояний
                        const fullAddrs = [startPoint, ...tripAddrs, startPoint];
                        for (let li = 0; li < fullAddrs.length - 1; li++) {
                            const cKey = makeDistanceCacheKey(fullAddrs[li], fullAddrs[li + 1]);
                            const legDist = legs[li] || 0;
                            if (legDist > 0) newCacheEntries[cKey] = legDist;
                        }

                        // Округляем итоговый пробег дня до целого числа (Math.round)
                        const roundedDayKm = Math.round(loopKm);

                        // Записываем плечи в trips (trip.distanceKm)
                        const updatedTrips = trips.map((tr, idx) => {
                            const tripObj = typeof tr === 'string' ? { address: tr } : { ...tr };
                            return {
                                ...tripObj,
                                distanceKm: legs[idx] || 0
                            };
                        });

                        newWorkdays[dateKey] = {
                            ...dayObj,
                            tripKm: roundedDayKm,
                            trips: updatedTrips
                        };

                        totalAddedKm += roundedDayKm;
                        updatedDaysCount++;
                    }

                    // Обновляем кэш расстояний
                    if (Object.keys(newCacheEntries).length > 0 && onUpdateDistanceCache) {
                        Object.entries(newCacheEntries).forEach(([k, v]) => {
                            onUpdateDistanceCache(k, v);
                        });
                    }

                    // Пересчитываем цепочку месяца через recalcWorkdays
                    const recalced = recalcWorkdays(
                        newWorkdays,
                        monthData.odometerStart,
                        monthData.fuelStart,
                        monthData.refuels || [],
                        activeNorm
                    );

                    // Обновляем месяц (с автосохранением на сервер)
                    if (onUpdateMonth) {
                        onUpdateMonth({
                            ...monthData,
                            workdays: recalced
                        }, true);
                    }

                    setDistributionMap(null);
                    if (showToast) showToast(`✓ Рассчитан пробег для ${updatedDaysCount} дн.: +${totalAddedKm} км`, 'success');
                } catch (err) {
                    console.error('Ошибка расчёта пробега маршрутов:', err);
                    if (showToast) showToast('Ошибка расчёта пробега маршрутов: ' + (err.message || err), 'error');
                } finally {
                    setIsCalculatingRouteKm(false);
                }
            };

            /* ── Генерация маршрутов-петель для пустых рабочих дней (OSRM / реальные дороги) ── */
            const handleGenerateRoutes = async () => {
                if (isEndMonthOverloaded) return;
                const startPoint = (profile?.startPoint || '').trim();
                if (!startPoint) {
                    if (showToast) showToast('Укажите домашний адрес (Точку старта) во вкладке «Профиль»!', 'error');
                    return;
                }

                // Отбираем рабочие дни, где есть километраж, но ЕЩЁ НЕТ маршрутов (сохраняем загруженные из CSV дни!)
                const eligibleDayKeys = workdayKeys.filter(k => {
                    const d = workdays[k];
                    const km = Number(d?.tripKm) || 0;
                    const trips = d?.trips || [];
                    return km > 0 && trips.length === 0;
                });

                if (eligibleDayKeys.length === 0) {
                    const hasAnyTrips = workdayKeys.some(k => (workdays[k]?.trips || []).length > 0);
                    if (hasAnyTrips) {
                        if (showToast) showToast('Во всех рабочих днях с пробегом уже заполнены маршруты', 'info');
                    } else {
                        if (showToast) showToast('Сначала распределите километраж по дням (Шаг 1)!', 'info');
                    }
                    return;
                }

                setIsGeneratingRoutes(true);
                setGenerationProgress('Геокодирование точки старта и адресов...');

                try {
                    const yandexKey = settings?.yandexApiKey || '';
                    const cleanStart = normalizeGeoKey(startPoint);
                    const cleanOffice = normalizeGeoKey(DEFAULT_OFFICE_ADDRESS.address);

                    // Хелпер проверки адреса офиса (по подстроке Бутырская 62 или точному ключу)
                    const isOfficeAddress = (addr) => {
                        if (!addr) return false;
                        const str = String(addr).toLowerCase();
                        if (str.includes('бутырск') && str.includes('62')) return true;
                        const k = normalizeGeoKey(addr);
                        return k === cleanOffice;
                    };

                    // 1. Посчитаем, сколько рабочих дней месяца (с уже загруженными из CSV поездками) уже содержат адрес офиса
                    let existingOfficeCount = 0;
                    workdayKeys.forEach(k => {
                        const dayObj = workdays[k];
                        const trips = dayObj?.trips || [];
                        if (trips.length > 0) {
                            const hasOfficeInDay = trips.some(tr => isOfficeAddress(typeof tr === 'string' ? tr : (tr.address || tr.to || '')));
                            if (hasOfficeInDay) {
                                existingOfficeCount++;
                            }
                        }
                    });

                    // 2. Остаток лимита заездов в офис на весь месяц (максимум 2 раза за весь месяц)
                    const remainingOfficeSlots = Math.max(0, 2 - existingOfficeCount);

                    // 3. Заранее выбираем дни для заезда в офис из списка eligibleDayKeys
                    const officeTargetDays = new Set();
                    const totalEligible = eligibleDayKeys.length;
                    if (remainingOfficeSlots >= 2 && totalEligible >= 4) {
                        const half = Math.floor(totalEligible / 2);
                        // 1 случайный день из первой половины и 1 случайный день из второй половины
                        const idx1 = Math.floor(Math.random() * half);
                        const idx2 = half + Math.floor(Math.random() * (totalEligible - half));
                        officeTargetDays.add(eligibleDayKeys[idx1]);
                        officeTargetDays.add(eligibleDayKeys[idx2]);
                    } else if (remainingOfficeSlots >= 2 && totalEligible > 0) {
                        const shuffled = [...eligibleDayKeys].sort(() => 0.5 - Math.random());
                        shuffled.slice(0, Math.min(remainingOfficeSlots, totalEligible)).forEach(k => officeTargetDays.add(k));
                    } else if (remainingOfficeSlots === 1 && totalEligible > 0) {
                        const idx = Math.floor(Math.random() * totalEligible);
                        officeTargetDays.add(eligibleDayKeys[idx]);
                    }

                    // Черновик рабочих дней для пошагового контроля расхода топлива
                    const tempWorkdays = {};
                    for (let d = 1; d <= totalDays; d++) {
                        const dk = toDateStr(year, month, d);
                        const orig = workdays[dk];
                        tempWorkdays[dk] = orig
                            ? { ...orig, isWorkday: !!orig.isWorkday, tripKm: Number(orig.tripKm) || 0 }
                            : { isWorkday: false, tripKm: 0, trips: [] };
                    }

                    // Проверяем, нет ли дефицита топлива в зафиксированных днях (например, из CSV)
                    const preCheck = recalcWorkdays(
                        tempWorkdays,
                        monthData.odometerStart,
                        monthData.fuelStart,
                        monthData.refuels || [],
                        activeNorm
                    );
                    const deficitDay = Object.keys(preCheck).sort().find(k => preCheck[k].isWorkday && Number(preCheck[k].fuelEnd) < -0.0001);
                    if (deficitDay) {
                        const [defY, defM, defD] = deficitDay.split('-');
                        const deficitMsg = `Внимание: обнаружен дефицит топлива в дне ${defD} ${MONTH_NAMES[Number(defM)]} (остаток: ${formatFuel(preCheck[deficitDay].fuelEnd)} л). Проверьте заправки перед подбором маршрутов!`;
                        if (showAlert) await showAlert(deficitMsg, 'Дефицит топлива');
                        else if (showToast) showToast(deficitMsg, 'error');
                        setIsGeneratingRoutes(false);
                        setGenerationProgress('');
                        return;
                    }

                    // Общий плановый километраж по генерируемым дням (с запасом не более +5%)
                    const totalPlanKm = eligibleDayKeys.reduce((s, k) => s + (Number(workdays[k]?.tripKm) || 0), 0);
                    let remainingMonthBudgetKm = Math.round(totalPlanKm * 1.05);

                    // 1. Геокодируем точку старта
                    const startCoords = await geocodeAddress(startPoint, yandexKey);
                    const startSectorLabel = getSectorLabel(startCoords);
                    setDetectedStartInfo({
                        label: startSectorLabel,
                        lat: startCoords?.lat,
                        lon: startCoords?.lon,
                        verified: startCoords?.verified !== false
                    });

                    // 2. Геокодируем адреса из личного справочника (с вежливой паузой 250 мс для внешних запросов)
                    const userAddressesWithCoords = [];
                    const initialCache = getGeoCache();
                    for (const item of (addresses || [])) {
                        const rawAddr = (item.address || '').trim();
                        if (!rawAddr) continue;
                        const k = normalizeGeoKey(rawAddr);
                        const isAlreadyCached = !!initialCache[k];
                        const c = await geocodeAddress(rawAddr, yandexKey);
                        if (!isAlreadyCached) {
                            await new Promise(r => setTimeout(r, 250));
                        }
                        if (c) {
                            userAddressesWithCoords.push({ address: rawAddr, note: item.note || '', lat: c.lat, lon: c.lon });
                        }
                    }

                    // 3. Собираем адреса, уже занятые в загруженных из CSV днях текущего месяца
                    const usedInMonth = new Set();
                    workdayKeys.forEach(k => {
                        const dayObj = workdays[k];
                        (dayObj?.trips || []).forEach(t => {
                            if (t.address) usedInMonth.add(normalizeGeoKey(t.address));
                        });
                    });
                    // Исключаем старт и офис из пула обычных клиентов
                    usedInMonth.add(cleanStart);
                    usedInMonth.add(cleanOffice);

                    // 4. Формируем единую колоду кандидатов без повторов (офис гарантированно исключён)
                    const rawCandidates = [...userAddressesWithCoords, ...MOSCOW_MO_ADDRESS_POOL]
                        .filter(a => {
                            const k = normalizeGeoKey(a.address);
                            return k && k !== cleanStart && !isOfficeAddress(a.address) && !usedInMonth.has(k);
                        });

                    const seenCandKeys = new Set();
                    const uniqueCandidates = [];
                    rawCandidates.forEach(cand => {
                        const k = normalizeGeoKey(cand.address);
                        if (!seenCandKeys.has(k)) {
                            seenCandKeys.add(k);
                            uniqueCandidates.push(cand);
                        }
                    });

                    // Фильтрация по сектору от Точки старта сотрудника и дальности выезда
                    let sectorDeck = uniqueCandidates.filter(a => isAddressInEmployeeSector(startCoords, a));

                    // Безопасный fallback: если кандидатов меньше 15, добираем с расширенным углом 105° (дальность <= 90 км)
                    if (sectorDeck.length < 15) {
                        const sectorKeys = new Set(sectorDeck.map(a => normalizeGeoKey(a.address)));
                        const extras105 = uniqueCandidates.filter(a => {
                            const k = normalizeGeoKey(a.address);
                            return !sectorKeys.has(k) && isAddressInEmployeeSector(startCoords, a, 105);
                        });
                        sectorDeck = [...sectorDeck, ...extras105];
                    }

                    // Если и после fallback мало (например, крайний город МО) — добираем по дальности <= 90 км
                    if (sectorDeck.length < 15) {
                        const sectorKeys = new Set(sectorDeck.map(a => normalizeGeoKey(a.address)));
                        const distLimit = haversineKm(MOSCOW_CENTER, startCoords) <= 20 ? 85 : 90;
                        const extrasDist = uniqueCandidates.filter(a => {
                            const k = normalizeGeoKey(a.address);
                            return !sectorKeys.has(k) && haversineKm(startCoords, a) <= distLimit;
                        });
                        sectorDeck = [...sectorDeck, ...extrasDist];
                    }

                    // Если все адреса были заняты, открываем пул МО по сектору
                    if (sectorDeck.length === 0) {
                        sectorDeck = MOSCOW_MO_ADDRESS_POOL.filter(a =>
                            normalizeGeoKey(a.address) !== cleanStart &&
                            !isOfficeAddress(a.address) &&
                            isAddressInEmployeeSector(startCoords, a, 105)
                        );
                    }

                    let availableDeck = sectorDeck.sort(() => 0.5 - Math.random());

                    const newPreview = {};
                    const newCacheEntries = {};
                    let carryDelta = 0;
                    let anyOsrm = false;

                    // Сортировка точек алгоритмом «ближайший сосед» от стартовой точки для исключения зигзагов
                    const sortRouteNearestNeighbor = (startPt, pts) => {
                        if (!pts || pts.length <= 1) return [...(pts || [])];
                        const remaining = [...pts];
                        const sorted = [];
                        let current = startPt;
                        while (remaining.length > 0) {
                            let nearestIdx = 0;
                            let minDist = Infinity;
                            for (let i = 0; i < remaining.length; i++) {
                                const d = haversineKm(current, remaining[i]);
                                if (d < minDist) {
                                    minDist = d;
                                    nearestIdx = i;
                                }
                            }
                            const nextPt = remaining.splice(nearestIdx, 1)[0];
                            sorted.push(nextPt);
                            current = nextPt;
                        }
                        return sorted;
                    };

                    // Быстрая вспомогательная оценка протяжённости цепочки по координатам Haversine * 1.32
                    const estimateCoordsLoopKm = (pts) => {
                        const coords = [startCoords, ...pts, startCoords];
                        let sum = 0;
                        for (let i = 0; i < coords.length - 1; i++) {
                            sum += haversineDistance(coords[i].lat, coords[i].lon, coords[i + 1].lat, coords[i + 1].lon) * 1.32;
                        }
                        return Math.round(sum * 10) / 10;
                    };

                    // Распределение слотов времени под рабочий график 09:00–21:00 (4 интервала: 09–12, 12–15, 15–18, 18–21)
                    const getTimeSlotsForDay = (count, isMontage) => {
                        if (isMontage || count <= 4) {
                            const montageBase = ['09:00', '12:00', '15:00', '18:00', '19:30'];
                            return montageBase.slice(0, count);
                        }
                        if (count === 5) {
                            return Math.random() < 0.5
                                ? ['09:00', '10:30', '12:00', '15:00', '18:00']
                                : ['09:00', '12:00', '13:30', '16:00', '18:00'];
                        }
                        if (count === 6) {
                            return Math.random() < 0.5
                                ? ['09:00', '10:30', '12:00', '13:30', '15:00', '18:00']
                                : ['09:00', '12:00', '13:30', '15:00', '16:30', '18:00'];
                        }
                        if (count === 7) {
                            return ['09:00', '10:30', '12:00', '13:30', '15:00', '16:30', '18:00'];
                        }
                        const grid = ['09:00', '10:30', '12:00', '13:30', '15:00', '16:30', '18:00', '19:30'];
                        if (count <= grid.length) return grid.slice(0, count);
                        const res = [];
                        for (let i = 0; i < count; i++) {
                            const totalMinutes = 9 * 60 + Math.floor(i * (11 * 60) / Math.max(1, count - 1));
                            const h = Math.floor(totalMinutes / 60);
                            const m = totalMinutes % 60;
                            res.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                        }
                        return res;
                    };

                    for (let dayIdx = 0; dayIdx < eligibleDayKeys.length; dayIdx++) {
                        const dateKey = eligibleDayKeys[dayIdx];
                        const dayObj = workdays[dateKey];
                        const plannedDayKm = Number(dayObj?.tripKm) || 0;

                        setGenerationProgress(`Подбор маршрутов: день ${dayIdx + 1} из ${eligibleDayKeys.length}...`);

                        // Безопасный потолок дня с учётом остатка топлива всех будущих дней
                        const safeCapKm = getMaxSafeKmForDay(
                            tempWorkdays,
                            dateKey,
                            monthData.refuels,
                            monthData.fuelStart,
                            activeNorm,
                            0.2
                        );

                        if (safeCapKm < 15) {
                            const [dY, dM, dD] = dateKey.split('-');
                            const capMsg = `Невозможно подобрать маршрут на ${dD} ${MONTH_NAMES[Number(dM)]}: доступный лимит топлива всего ${safeCapKm} км. Проверьте заправки или распределение пробега!`;
                            if (showAlert) await showAlert(capMsg, 'Лимит топлива');
                            else if (showToast) showToast(capMsg, 'error');
                            setIsGeneratingRoutes(false);
                            setGenerationProgress('');
                            return;
                        }

                        // Ограничение переноса невязки: не более ±20% от планового километража дня
                        const maxDeltaAllowed = Math.round(plannedDayKm * 0.20 * 10) / 10;
                        const clampedDelta = Math.max(-maxDeltaAllowed, Math.min(maxDeltaAllowed, carryDelta));
                        const targetKmForDay = fitRoutesToMonthlyOdometer
                            ? Math.min(190, Math.max(20, Math.round((plannedDayKm + clampedDelta) * 10) / 10))
                            : plannedDayKm;

                        // dayCapKm: не более 115% от цели, не более safeCapKm, не более остатка бюджета месяца
                        const dayCapKm = Math.min(
                            Math.round(targetKmForDay * 1.15),
                            safeCapKm,
                            Math.max(20, remainingMonthBudgetKm)
                        );

                        // Включение заезда в офис/склад строго по заранее распределённым дням (максимум 2 раза за весь месяц)
                        const includeOffice = officeTargetDays.has(dateKey);

                        // 1. Определение типа дня (монтажный / обычный) и количества промежуточных точек
                        let isMontageDay = false;
                        let pointsCount = 6;
                        if (targetKmForDay < 150 && Math.random() < 0.20) {
                            isMontageDay = true;
                            pointsCount = Math.random() < 0.6 ? 3 : 4;
                        } else {
                            isMontageDay = false;
                            if (targetKmForDay >= 150) {
                                pointsCount = Math.random() < 0.5 ? 6 : 7;
                            } else if (targetKmForDay >= 85) {
                                pointsCount = 6;
                            } else {
                                pointsCount = Math.random() < 0.5 ? 5 : 6;
                            }
                        }

                        const otherPointsNeeded = includeOffice ? Math.max(1, pointsCount - 1) : pointsCount;

                        // 2. Пополнение свободной колоды адресов строго без дубликатов
                        if (availableDeck.length < Math.max(16, otherPointsNeeded * 2)) {
                            let refill = uniqueCandidates
                                .filter(a => isAddressInEmployeeSector(startCoords, a))
                                .sort(() => 0.5 - Math.random());
                            if (refill.length < otherPointsNeeded) {
                                refill = uniqueCandidates
                                    .filter(a => isAddressInEmployeeSector(startCoords, a, 105))
                                    .sort(() => 0.5 - Math.random());
                            }
                            if (refill.length < otherPointsNeeded) {
                                refill = uniqueCandidates.sort(() => 0.5 - Math.random());
                            }
                            const existingKeys = new Set(availableDeck.map(a => normalizeGeoKey(a.address)));
                            refill.forEach(cand => {
                                const k = normalizeGeoKey(cand.address);
                                if (!existingKeys.has(k) && !usedInMonth.has(k) && k !== cleanStart && !isOfficeAddress(cand.address)) {
                                    existingKeys.add(k);
                                    availableDeck.push(cand);
                                }
                            });
                            // Если адреса в месяце исчерпаны — пополняем из сектора, строго избегая дубликатов в availableDeck
                            if (availableDeck.length < otherPointsNeeded) {
                                refill.forEach(cand => {
                                    const k = normalizeGeoKey(cand.address);
                                    if (!existingKeys.has(k) && k !== cleanStart && !isOfficeAddress(cand.address)) {
                                        existingKeys.add(k);
                                        availableDeck.push(cand);
                                    }
                                });
                            }
                        }

                        // 3. Перебор ~30 комбинаций вокруг случайной якорной точки: кластер ближайших адресов + сортировка Nearest Neighbor
                        let bestCombo = null;
                        let bestDiff = Infinity;
                        let bestWithinCap = null;
                        let bestDiffWithinCap = Infinity;
                        const attempts = Math.min(30, Math.max(12, availableDeck.length));

                        for (let a = 0; a < attempts; a++) {
                            // Выбираем 1 якорную точку
                            const anchor = availableDeck[Math.floor(Math.random() * availableDeck.length)];
                            const anchorKey = normalizeGeoKey(anchor.address);

                            // Отбираем остальные адреса колоды, отсортированные по расстоянию до якоря
                            const otherDeck = availableDeck.filter(x => normalizeGeoKey(x.address) !== anchorKey);
                            otherDeck.sort((p1, p2) => haversineKm(anchor, p1) - haversineKm(anchor, p2));

                            // Пул из ближайших до 14 точек к якорю
                            const poolSize = Math.min(14, otherDeck.length);
                            const clusterPool = otherDeck.slice(0, poolSize);
                            const shuffledCluster = [...clusterPool].sort(() => 0.5 - Math.random());
                            const pickedOthers = shuffledCluster.slice(0, Math.max(0, otherPointsNeeded - 1));

                            // Строгая дедупликация адресов внутри комбинации
                            const dayCandMap = new Map();
                            dayCandMap.set(anchorKey, anchor);
                            pickedOthers.forEach(p => {
                                const k = normalizeGeoKey(p.address);
                                if (!dayCandMap.has(k)) dayCandMap.set(k, p);
                            });

                            if (dayCandMap.size < otherPointsNeeded) {
                                for (const p of otherDeck) {
                                    const k = normalizeGeoKey(p.address);
                                    if (!dayCandMap.has(k)) {
                                        dayCandMap.set(k, p);
                                        if (dayCandMap.size >= otherPointsNeeded) break;
                                    }
                                }
                            }

                            let candidateList = Array.from(dayCandMap.values());
                            if (includeOffice) {
                                candidateList.push(DEFAULT_OFFICE_ADDRESS);
                            }

                            // Выстраиваем цепочку алгоритмом «ближайший сосед» от точки старта
                            candidateList = sortRouteNearestNeighbor(startCoords, candidateList);

                            const estKm = estimateCoordsLoopKm(candidateList);

                            // Кластеризация: максимальное расстояние между точками внутри одного дня
                            let maxSpreadKm = 0;
                            for (let p1 = 0; p1 < candidateList.length; p1++) {
                                for (let p2 = p1 + 1; p2 < candidateList.length; p2++) {
                                    const d = haversineKm(candidateList[p1], candidateList[p2]);
                                    if (d > maxSpreadKm) maxSpreadKm = d;
                                }
                            }
                            // Штраф к оценке, если точки раскиданы более чем на 50 км друг от друга
                            const spreadPenalty = maxSpreadKm > 50 ? (maxSpreadKm - 50) * 1.5 : 0;
                            const score = Math.abs(estKm - targetKmForDay) + spreadPenalty;

                            if (score < bestDiff) {
                                bestDiff = score;
                                bestCombo = candidateList;
                            }

                            // Приоритетно оцениваем комбинации, чья оценка <= dayCapKm
                            if (estKm <= dayCapKm) {
                                if (score < bestDiffWithinCap) {
                                    bestDiffWithinCap = score;
                                    bestWithinCap = candidateList;
                                }
                            }
                        }

                        let chosenCombo = bestWithinCap || bestCombo || (
                            includeOffice
                                ? sortRouteNearestNeighbor(startCoords, [DEFAULT_OFFICE_ADDRESS, ...availableDeck.slice(0, otherPointsNeeded)])
                                : sortRouteNearestNeighbor(startCoords, availableDeck.slice(0, otherPointsNeeded))
                        );

                        // Фиксируем выбранные адреса клиентов в usedInMonth и удаляем их из свободной колоды
                        chosenCombo.forEach(pt => {
                            const k = normalizeGeoKey(pt.address);
                            if (!isOfficeAddress(pt.address) && k !== cleanStart) {
                                usedInMonth.add(k);
                            }
                        });
                        availableDeck = availableDeck.filter(a => !usedInMonth.has(normalizeGeoKey(a.address)));

                        // 4. Реальный расчёт выбранной дорожной петли через OSRM
                        let currentCombo = sortRouteNearestNeighbor(startCoords, [...chosenCombo]);
                        let loopCoords = [startCoords, ...currentCombo.map(p => ({ lat: p.lat, lon: p.lon })), startCoords];
                        let osrmResult = await fetchOsrmLoop(loopCoords);
                        if (!osrmResult.isOffline) {
                            anyOsrm = true;
                        }

                        let actualLoopKm = osrmResult.totalKm;
                        let legsKm = osrmResult.legs || [];

                        // Если реальный дорожный пробег превышает safeCapKm или бюджет месяца более чем на 5% — аккуратно укорачиваем петлю
                        const maxBudgetAllowed = Math.round(remainingMonthBudgetKm * 1.05);
                        const effectiveMaxKm = Math.min(safeCapKm, maxBudgetAllowed);

                        let trimTries = 0;
                        while (Math.round(actualLoopKm) > effectiveMaxKm && currentCombo.length > 2 && trimTries < 5) {
                            trimTries++;
                            // Ищем самую дальнюю точку от старта
                            let farthestIdx = -1;
                            let maxDist = -1;
                            for (let ci = 0; ci < currentCombo.length; ci++) {
                                const pt = currentCombo[ci];
                                const isOff = isOfficeAddress(pt.address);
                                if (isOff && currentCombo.length > 2) continue; // не удаляем офис, если есть клиенты
                                const dFromStart = haversineDistance(startCoords.lat, startCoords.lon, pt.lat, pt.lon);
                                if (dFromStart > maxDist) {
                                    maxDist = dFromStart;
                                    farthestIdx = ci;
                                }
                            }

                            if (farthestIdx >= 0) {
                                currentCombo.splice(farthestIdx, 1);
                                currentCombo = sortRouteNearestNeighbor(startCoords, currentCombo);
                                loopCoords = [startCoords, ...currentCombo.map(p => ({ lat: p.lat, lon: p.lon })), startCoords];
                                osrmResult = await fetchOsrmLoop(loopCoords);
                                actualLoopKm = osrmResult.totalKm;
                                legsKm = osrmResult.legs || [];
                            } else {
                                break;
                            }
                        }

                        // Округляем итоговый пробег дня строго до целого числа (целевой километраж дня)
                        const finalDayKm = Math.round(actualLoopKm);

                        // Сохраняем пары плеч в кэш расстояний
                        const fullAddrs = [startPoint, ...currentCombo.map(p => p.address), startPoint];
                        for (let li = 0; li < fullAddrs.length - 1; li++) {
                            const cKey = makeDistanceCacheKey(fullAddrs[li], fullAddrs[li + 1]);
                            const legDist = legsKm[li] || 0;
                            if (legDist > 0) newCacheEntries[cKey] = legDist;
                        }

                        // Накапливаем разницу между плановым и фактическим пробегом
                        const dayDiff = plannedDayKm - finalDayKm;
                        carryDelta += dayDiff;
                        remainingMonthBudgetKm = Math.max(0, remainingMonthBudgetKm - finalDayKm);

                        // 5. Формируем промежуточные точки маршрута под рабочий график 09:00–21:00
                        const intermediateAddrs = currentCombo.map(p => p.address);
                        const timeSlots = getTimeSlotsForDay(intermediateAddrs.length, isMontageDay);

                        let montageIndices = new Set();
                        if (!isMontageDay) {
                            const nonOfficeIndices = [];
                            intermediateAddrs.forEach((addr, idx) => {
                                if (!isOfficeAddress(addr)) nonOfficeIndices.push(idx);
                            });
                            const montageCount = Math.min(nonOfficeIndices.length, Math.random() < 0.6 ? 1 : 2);
                            const shuffledNonOffice = [...nonOfficeIndices].sort(() => 0.5 - Math.random());
                            shuffledNonOffice.slice(0, montageCount).forEach(idx => montageIndices.add(idx));
                        }

                        const dayTrips = intermediateAddrs.map((addr, idx) => {
                            const isOffice = isOfficeAddress(addr);
                            let taskType = '';
                            if (isOffice) {
                                taskType = 'Офис и склад';
                            } else if (isMontageDay) {
                                taskType = 'М';
                            } else {
                                taskType = montageIndices.has(idx) ? 'М' : 'С';
                            }

                            return {
                                order: idx + 1,
                                address: addr,
                                taskType: taskType,
                                time: timeSlots[idx] || '09:00',
                                distanceKm: legsKm[idx] || 0
                            };
                        });

                        // ОБНОВЛЯЕМ tempWorkdays[dateKey].tripKm, чтобы следующий день в цикле сразу видел реальный остаток топлива!
                        tempWorkdays[dateKey] = {
                            ...tempWorkdays[dateKey],
                            isWorkday: true,
                            tripKm: finalDayKm,
                            trips: dayTrips
                        };

                        newPreview[dateKey] = {
                            dateKey,
                            targetKm: plannedDayKm,
                            actualKm: finalDayKm,
                            intermediateAddrs,
                            trips: dayTrips,
                            chain: fullAddrs,
                            scaledLegs: legsKm,
                            hasOffice: includeOffice,
                            fitApplied: fitRoutesToMonthlyOdometer,
                            isOffline: osrmResult.isOffline
                        };
                    }

                    // 5. Точная целочисленная доводка diff до 0 км (при включённой подгонке пробега)
                    if (fitRoutesToMonthlyOdometer && eligibleDayKeys.length > 0) {
                        const targetTotalKm = goalType === 'odometer'
                            ? Math.max(0, (Number(targetOdometer) || 0) - odometerStart)
                            : Math.round(requiredKm);

                        // Пробег дней месяца, не участвовавших в генерации (например, загруженные из Маршрутов)
                        const fixedOtherKm = workdayKeys
                            .filter(k => !newPreview[k])
                            .reduce((s, k) => s + (Number(workdays[k]?.tripKm) || 0), 0);

                        // Функция проверки допустимости топливного баланса для тестового набора пробегов
                        const isFuelBalanceValid = (testWorkdaysMap) => {
                            const sim = {};
                            for (let d = 1; d <= totalDays; d++) {
                                const dk = toDateStr(year, month, d);
                                const orig = workdays[dk];
                                const previewDay = testWorkdaysMap[dk];
                                if (previewDay) {
                                    sim[dk] = {
                                        ...orig,
                                        isWorkday: true,
                                        tripKm: previewDay.actualKm
                                    };
                                } else if (orig) {
                                    sim[dk] = {
                                        ...orig,
                                        isWorkday: !!orig.isWorkday,
                                        tripKm: Number(orig.tripKm) || 0
                                    };
                                } else {
                                    sim[dk] = { isWorkday: false, tripKm: 0, trips: [] };
                                }
                            }
                            const check = recalcWorkdays(
                                sim,
                                monthData.odometerStart,
                                monthData.fuelStart,
                                monthData.refuels || [],
                                activeNorm
                            );
                            return !Object.values(check).some(day => day.isWorkday && Number(day.fuelEnd) < -0.0001);
                        };

                        let currentGenTotal = eligibleDayKeys.reduce((s, k) => s + (Number(newPreview[k]?.actualKm) || 0), 0);
                        let diff = Math.round(targetTotalKm - fixedOtherKm) - currentGenTotal;

                        let guard = 0;
                        while (diff !== 0 && guard < 2000) {
                            guard++;
                            let changed = false;

                            if (diff > 0) {
                                // Нужно добавить пробег: сортируем от меньшего пробега к большему
                                const sortedKeys = [...eligibleDayKeys].sort((a, b) => {
                                    return (newPreview[a]?.actualKm || 0) - (newPreview[b]?.actualKm || 0);
                                });

                                for (const dk of sortedKeys) {
                                    const dayPreview = newPreview[dk];
                                    if (!dayPreview) continue;
                                    const curKm = Number(dayPreview.actualKm) || 0;
                                    if (curKm + 1 > 210) continue; // ограничение дневного пробега

                                    // Тестируем +1 км
                                    const testMap = {
                                        ...newPreview,
                                        [dk]: { ...dayPreview, actualKm: curKm + 1 }
                                    };

                                    if (isFuelBalanceValid(testMap)) {
                                        dayPreview.actualKm = curKm + 1;
                                        if (tempWorkdays[dk]) {
                                            tempWorkdays[dk].tripKm = curKm + 1;
                                        }
                                        diff -= 1;
                                        changed = true;
                                        break;
                                    }
                                }
                            } else {
                                // Нужно убавить пробег: выбираем дни с пробегом > 15 км от большего к меньшему
                                const sortedKeys = [...eligibleDayKeys]
                                    .filter(k => (newPreview[k]?.actualKm || 0) > 15)
                                    .sort((a, b) => (newPreview[b]?.actualKm || 0) - (newPreview[a]?.actualKm || 0));

                                for (const dk of sortedKeys) {
                                    const dayPreview = newPreview[dk];
                                    if (!dayPreview) continue;
                                    const curKm = Number(dayPreview.actualKm) || 0;
                                    if (curKm - 1 < 15) continue;

                                    dayPreview.actualKm = curKm - 1;
                                    if (tempWorkdays[dk]) {
                                        tempWorkdays[dk].tripKm = curKm - 1;
                                    }
                                    diff += 1;
                                    changed = true;
                                    break;
                                }
                            }

                            if (!changed) break;
                        }
                    }

                    // Обновляем кэш расстояний новыми вычисленными парами
                    if (Object.keys(newCacheEntries).length > 0 && onUpdateDistanceCache) {
                        Object.entries(newCacheEntries).forEach(([k, v]) => {
                            onUpdateDistanceCache(k, v);
                        });
                    }

                    setHasAnyOsrmRoutes(anyOsrm);
                    setRoutePreviewMap(newPreview);
                } catch (err) {
                    console.error('Ошибка подбора маршрутов:', err);
                    if (showToast) showToast('Ошибка подбора маршрутов: ' + err.message, 'error');
                } finally {
                    setIsGeneratingRoutes(false);
                    setGenerationProgress('');
                }
            };

            /* ── Применение сгенерированных маршрутов ── */

                setDetectedStartInfo(null);

            /* ── Подсказка по диапазону дней ── */
            const selectedCount = selectedKeys.length;
            const loVal = Math.max(1, Number(minKm) || 70);
            const hiVal = Math.max(loVal, Number(maxKm) || 160);
            const minPossible = selectedCount * loVal;
            const maxPossible = selectedCount * hiVal;
            const recMinDays = Math.max(1, Math.ceil(targetTotal / hiVal));
            const recMaxDays = Math.max(1, Math.floor(targetTotal / loVal));
            let rangeHint = null;
            if (targetTotal > 0 && selectedCount > 0) {
                const recDaysText = recMinDays === recMaxDays ? `${recMinDays} дн.` : `${recMinDays}–${recMaxDays} дн.`;
                if (targetTotal < minPossible) {
                    rangeHint = `Выбрано много дней (${selectedCount}) для ${targetTotal} км при мин. ${loVal} км/д. Рекомендуется ${recDaysText}`;
                } else if (targetTotal > maxPossible) {
                    rangeHint = `Выбрано мало дней (${selectedCount}) для ${targetTotal} км при макс. ${hiVal} км/д. Рекомендуется ${recDaysText}`;
                }
            }

            return (
                <div className="max-w-3xl mx-auto w-full space-y-4 animate-fade-in pb-8">
                    {/* КАРТОЧКА 1: РАСЧЁТ ЦЕЛЕВОГО ТОПЛИВА И ПРОБЕГА */}

                        <p className="text-xs opacity-50 mb-3">
                            Выберите способ расчёта (по остатку топлива или по конечному одометру) — система рассчитает требуемый расход и недостающий километраж.
                        </p>

                        <div className="flex rounded-lg p-1 bg-black/10 dark:bg-white/5 mb-3 gap-1">
                            <button
                                type="button"
                                onClick={() => {
                                    if (goalType !== 'fuel') {
                                        setGoalType('fuel');
                                        setDistributionMap(null);
                                        setRoutePreviewMap(null);
                                    }
                                }}
                                className={`flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all ${
                                    goalType === 'fuel'
                                        ? `${t('bg-[#FFB300] text-black shadow','bg-amber-600 text-white shadow','bg-pink-600 text-white shadow','bg-blue-600 text-white shadow','bg-emerald-600 text-white shadow','bg-[#5D4037] text-white shadow','bg-[#C62828] text-white shadow')}`
                                        : 'opacity-60 hover:opacity-100'
                                }`}
                            >
                                По остатку топлива (л)
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    if (goalType !== 'odometer') {
                                        setGoalType('odometer');
                                        setDistributionMap(null);
                                        setRoutePreviewMap(null);
                                    }
                                }}
                                className={`flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all ${
                                    goalType === 'odometer'
                                        ? `${t('bg-[#FFB300] text-black shadow','bg-amber-600 text-white shadow','bg-pink-600 text-white shadow','bg-blue-600 text-white shadow','bg-emerald-600 text-white shadow','bg-[#5D4037] text-white shadow','bg-[#C62828] text-white shadow')}`
                                        : 'opacity-60 hover:opacity-100'

                                <input

                                </div>
                                <input
                                    type="number"
