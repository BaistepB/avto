        /** Нормализация ключа геокэша */

        /** Получение кэша координат из localStorage */
        const getGeoCache = () => {
            try { return JSON.parse(localStorage.getItem('expert_report_geo_cache') || '{}'); }
            catch { return {}; }
        };

        /** Сохранение кэша координат в localStorage */
        const saveGeoCache = (cache) => {
            try { localStorage.setItem('expert_report_geo_cache', JSON.stringify(cache)); }
            catch (e) {}
        };

        /** Симметричный ключ кэша пары адресов (A-B == B-A) */
        const makeDistanceCacheKey = (addr1, addr2) => {
            const clean = (a) => String(a || '').trim().toLowerCase().replace(/[\s\u00A0.,/\\-]/g, ' ');
            const n1 = clean(addr1);
            const n2 = clean(addr2);
            return n1 < n2 ? `${n1}|||${n2}` : `${n2}|||${n1}`;
        };

        /** Расчёт расстояния между координатами по формуле Haversine (в км) */
        const haversineDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        };

        /** Поиск приблизительных координат адреса (офлайн-fallback) */
        const findApproxCoords = (addr) => {
            const str = String(addr || '').toLowerCase();
            if (str.includes('бутырская') || str.includes('склад') || str.includes('офис')) {
                return { lat: 55.8012, lon: 37.5841 };
            }
            const matchInPool = MOSCOW_MO_ADDRESS_POOL.find(p => {
                const parts = p.address.toLowerCase().split(',');
                return str.includes(parts[1]?.trim() || '---');
            });
            if (matchInPool) return { lat: matchInPool.lat, lon: matchInPool.lon };

            if (str.includes('химки')) return { lat: 55.8924, lon: 37.4378 };
            if (str.includes('мытищи')) return { lat: 55.9145, lon: 37.7389 };
            if (str.includes('подольск')) return { lat: 55.4267, lon: 37.5389 };
            if (str.includes('красногорск')) return { lat: 55.8289, lon: 37.3392 };
            if (str.includes('одинцово')) return { lat: 55.6789, lon: 37.2845 };
            if (str.includes('люберцы')) return { lat: 55.6823, lon: 37.8923 };
            if (str.includes('балашиха')) return { lat: 55.7994, lon: 37.9456 };
            if (str.includes('видное')) return { lat: 55.5512, lon: 37.7023 };
            if (str.includes('королев') || str.includes('королёв')) return { lat: 55.9189, lon: 37.8234 };
            if (str.includes('долгопрудный')) return { lat: 55.9324, lon: 37.5089 };
            if (str.includes('зеленоград')) return { lat: 55.9967, lon: 37.1989 };

            // Детерминированный хэш для неизвестных адресов внутри контура Москвы
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
            const latOffset = ((Math.abs(hash) % 200) - 100) / 1000;
            const lonOffset = ((Math.abs(hash >> 3) % 200) - 100) / 1000;
            return { lat: 55.7512 + latOffset, lon: 37.6184 + lonOffset };
        };

        /** Асинхронное геокодирование адреса: кэш -> пул/офис -> Яндекс -> Nominatim -> fallback */
        const geocodeAddress = async (address, yandexApiKey) => {
            const raw = String(address || '').trim();
            if (!raw) return null;
            const key = normalizeGeoKey(raw);
            const cache = getGeoCache();
            if (cache[key] && typeof cache[key].lat === 'number' && typeof cache[key].lon === 'number') {
                return cache[key];
            }

            // 1. Поиск в офисе по умолчанию
            const cleanOffice = normalizeGeoKey(DEFAULT_OFFICE_ADDRESS.address);
            if (key === cleanOffice || key.includes('бутырская') || key.includes('склад') || key.includes('офис')) {
                const res = { lat: DEFAULT_OFFICE_ADDRESS.lat, lon: DEFAULT_OFFICE_ADDRESS.lon };
                cache[key] = res;
                saveGeoCache(cache);
                return res;
            }

            // 2. Поиск в пуле MOSCOW_MO_ADDRESS_POOL
            const matchInPool = MOSCOW_MO_ADDRESS_POOL.find(p => {
                const pk = normalizeGeoKey(p.address);
                return pk === key || key.includes(pk) || pk.includes(key);
            });
            if (matchInPool) {
                const res = { lat: matchInPool.lat, lon: matchInPool.lon };
                cache[key] = res;
                saveGeoCache(cache);
                return res;
            }

            // 3. Запрос к Яндекс Геокодеру (если задан API-ключ) с таймаутом 3 сек через AbortController
            if (yandexApiKey && String(yandexApiKey).trim().length > 5) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(yandexApiKey.trim())}&format=json&geocode=${encodeURIComponent(raw)}&results=1`;
                    const resp = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (resp.ok) {
                        const data = await resp.json();
                        const member = data?.response?.GeoObjectCollection?.featureMember?.[0];
                        const pos = member?.GeoObject?.Point?.pos;
                        if (pos) {
                            const [lonStr, latStr] = pos.split(' ');
                            const lat = parseFloat(latStr);
                            const lon = parseFloat(lonStr);
                            if (!isNaN(lat) && !isNaN(lon)) {
                                const res = { lat, lon };
                                cache[key] = res;
                                saveGeoCache(cache);
                                return res;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Яндекс Геокодер таймаут или недоступен:', e.message);
                }
            }

            // 4. Запрос к Nominatim OSM с таймаутом 3 сек через AbortController
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q=${encodeURIComponent(raw)}`;
                const resp = await fetch(url, {
                    headers: { 'Accept-Language': 'ru' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (resp.ok) {
                    const data = await resp.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        if (!isNaN(lat) && !isNaN(lon)) {
                            const res = { lat, lon };
                            cache[key] = res;
                            saveGeoCache(cache);
                            return res;
                        }
                    }
                }
            } catch (e) {
                console.warn('Nominatim таймаут или недоступен:', e.message);
            }

            // 5. Детерминированный fallback
            const approx = findApproxCoords(raw);
            cache[key] = approx;
            saveGeoCache(cache);
            return approx;
        };

        /** Пакетный расчёт реальной дорожной петли через OSRM: Старт -> точки -> Финиш */
        const fetchOsrmLoop = async (coordsList) => {
            if (!Array.isArray(coordsList) || coordsList.length < 2) {
                return { success: false, totalKm: 0, legs: [], isOffline: true };
            }

            // Координаты для OSRM: lon,lat;lon,lat;...
            const coordsStr = coordsList.map(c => `${c.lon.toFixed(5)},${c.lat.toFixed(5)}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=false`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                const resp = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (resp.ok) {
                    const data = await resp.json();
                    if (data && data.code === 'Ok' && Array.isArray(data.routes) && data.routes.length > 0) {
                        const r = data.routes[0];
                        const totalKm = Math.round((r.distance / 1000) * 10) / 10;
                        const legs = (r.legs || []).map(l => Math.round((l.distance / 1000) * 10) / 10);
                        return { success: true, totalKm, legs, isOffline: false };
                    }
                }
            } catch (e) {
                console.warn('OSRM сервис недоступен или таймаут, переключаемся на офлайн-расчёт:', e.message);
            }

            // Офлайн-расчёт по координатам Haversine * 1.32
            const legs = [];
            for (let i = 0; i < coordsList.length - 1; i++) {
                const c1 = coordsList[i];
                const c2 = coordsList[i + 1];
                const geo = haversineDistance(c1.lat, c1.lon, c2.lat, c2.lon);
                legs.push(Math.max(1.0, Math.round(geo * 1.32 * 10) / 10));
            }
            const totalKm = Math.round(legs.reduce((s, v) => s + v, 0) * 10) / 10;
            return { success: false, totalKm, legs, isOffline: true };
        };

        /** Оценка дорожного расстояния между двумя адресами (с коэффициентом 1.32) */
        const estimateRoadDistanceKm = (addr1, addr2) => {
            const clean1 = String(addr1 || '').trim().toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
            const clean2 = String(addr2 || '').trim().toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
            if (!clean1 || !clean2 || clean1 === clean2) return 0;

            const c1 = findApproxCoords(addr1);
            const c2 = findApproxCoords(addr2);
            const geo = haversineDistance(c1.lat, c1.lon, c2.lat, c2.lon);
            return Math.max(3.0, Math.round(geo * 1.32 * 10) / 10);
        };

        /* ═══════════════════════════════════════════════════
           4. ВСПОМОГАТЕЛЬНЫЕ ЧИСТЫЕ ФУНКЦИИ
        ═══════════════════════════════════════════════════ */

        /** Количество дней в месяце */
        const daysInMonth = (year, month) => new Date(year, month, 0).getDate();

        /** Автосезон: апрель (4) – октябрь (10) = лето, иначе зима */
        const getSeason = (year, month) =>
            (month >= 4 && month <= 10) ? 'summer' : 'winter';

        /** YYYY-MM-DD → { year, month, day } */
        const parseDate = (s) => {
            const [y, m, d] = s.split('-').map(Number);
            return { year: y, month: m, day: d };
        };

        /** Строка YYYY-MM-DD */
        const toDateStr = (year, month, day) =>
            `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        /** Имя месяца на русском */
        const MONTH_NAMES = [
            '', 'Январь','Февраль','Март','Апрель','Май','Июнь',
            'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
        ];
        const MONTH_NAMES_GEN = [
            '', 'января','февраля','марта','апреля','мая','июня',
            'июля','августа','сентября','октября','ноября','декабря'
        ];

        /** Безопасное чтение значения ячейки ExcelJS (строка, число, richText, формула) */
        const cellValue = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return '';
            const v = cell.value;
            if (typeof v === 'string' || typeof v === 'number') return String(v);
            if (typeof v === 'object') {
                if (v.result !== undefined) return String(v.result); // формула
                if (v.richText)            return v.richText.map(r => r.text).join(''); // richText
                if (v.text !== undefined)  return String(v.text);
            }
            return String(v);
        };

        /** Универсальное извлечение числового значения из ячейки ExcelJS */
        const extractNumericCell = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return null;
            let raw = cell.value;
            if (raw && typeof raw === 'object' && 'result' in raw) {
                raw = raw.result;
            } else if (raw && typeof raw === 'object' && 'richText' in raw && Array.isArray(raw.richText)) {
                raw = raw.richText.map(r => r.text).join('');
            }
            if (typeof raw === 'number') {
                return Number.isFinite(raw) ? raw : null;
            }
            if (typeof raw === 'string') {
                const cleaned = raw.replace(/[\s\u00A0]/g, '').replace(',', '.');
                if (!cleaned) return null;
                const num = Number(cleaned);
                return Number.isFinite(num) ? num : null;
            }
            return null;
        };

        /** Форматирование значения топлива строго с 3 знаками после запятой (0.000) */
        const formatFuel = (val) => {
            if (val === null || val === undefined || val === '') return '0.000';
            const num = Number(val);
            return Number.isFinite(num) ? num.toFixed(3) : '0.000';
        };

        /** Парсинг введенного значения топлива (поддерживает пробелы, запятую и точку, округляет до 3 знаков) */
        const parseFuelInput = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            const cleaned = String(val).replace(/[\s\u00A0]/g, '').replace(',', '.');
            const num = Number(cleaned);
            return Number.isFinite(num) ? Number(num.toFixed(3)) : 0;
        };

        /** Разбор одной строки CSV с поддержкой кавычек "..." (экранированные кавычки, запятые и точки с запятой внутри) */
        const parseCsvLine = (line, delimiter) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === delimiter && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(val => {
                let s = val.trim();
                if (s.startsWith('"') && s.endsWith('"') && s.length >= 2) {
                    s = s.slice(1, -1).replace(/""/g, '"').trim();
                }
                return s;
            });
        };

        /** Нормализация заголовка колонки CSV (русские и английские варианты) */
        const normalizeHeader = (h) => {
            const raw = (h || '').trim().toLowerCase().replace(/^["']|["']$/g, '');
            if (raw === 'дата' || raw === 'date') return 'date';
            if (raw === '№' || raw === 'номер' || raw === 'order' || raw === 'n' || raw === 'no') return 'order';
            if (raw === 'заявка' || raw === 'claim' || raw === 'task' || raw === 'ticket') return 'task';
            if (raw === 'тип' || raw === 'tasktype' || raw === 'type') return 'taskType';
            if (raw === 'время' || raw === 'time') return 'time';
            if (raw === 'адрес' || raw === 'address') return 'address';
            if (raw === 'старт' || raw === 'start') return 'start';
            if (raw === 'возврат' || raw === 'return') return 'return';
            return raw;
        };

        /** Нормализация строки даты в формат YYYY-MM-DD */
        const normalizeDateStr = (val) => {
            if (!val) return '';
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const dmY = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (dmY) {
                return `${dmY[3]}-${dmY[2].padStart(2, '0')}-${dmY[1].padStart(2, '0')}`;
            }
            return s;
        };

        /** Нормализация номера телефона (строго 11 цифр, начиная с 7) */
        const normalizePhone = (raw) => {
            if (!raw) return '';
            let digits = String(raw).replace(/\D/g, '');
            if (digits.length === 11 && (digits.startsWith('7') || digits.startsWith('8'))) {
                digits = '7' + digits.slice(1);
            } else if (digits.length === 10) {
                digits = '7' + digits;
            }
            return digits.slice(0, 11);
        };

        /** Форматирование номера телефона в корпоративную маску +7 ХХХ ХХХ ХХ ХХ */
        const formatPhoneMask = (raw) => {
            if (!raw) return '';
            let digits = String(raw).replace(/\D/g, '');
            if (digits.startsWith('8')) digits = '7' + digits.slice(1);
            if (!digits.startsWith('7')) digits = '7' + digits;
            digits = digits.slice(0, 11);

            let res = '+7';
            if (digits.length > 1) {
                res += ' ' + digits.slice(1, Math.min(4, digits.length));
            }
            if (digits.length > 4) {
                res += ' ' + digits.slice(4, Math.min(7, digits.length));
            }
            if (digits.length > 7) {
                res += ' ' + digits.slice(7, Math.min(9, digits.length));
            }
            if (digits.length > 9) {
                res += ' ' + digits.slice(9, 11);
            }
            return res;
        };

        /** Нормализация ПИН-кода (ровно 4 цифры) */
        const normalizePin = (raw) => {
            if (!raw) return '';
            return String(raw).replace(/\D/g, '').slice(0, 4);
        };

        /** Получить ключ YYYY-MM предыдущего календарного месяца */
        const getPrevMonthKey = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            const prevYear = m === 1 ? y - 1 : y;
            const prevMonth = m === 1 ? 12 : m - 1;
            return `${prevYear}-${String(prevMonth).padStart(2, '0')}`;
        };

        /** Расчет итогов месяца (одометр, остатки, расход) */
        const getMonthSummary = (monthData, activeNorm) => {
            const odomStart = Number(monthData.odometerStart) || 0;
            const fuelStart = Number(monthData.fuelStart) || 0;
            const workdays = monthData.workdays || {};
            const workdayKeys = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalRefuels = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const norm = Number(activeNorm) || 0;
            const totalFuelUsed = norm > 0 ? (totalKm * norm / 100) : 0;
            const fuelEnd = fuelStart + totalRefuels - totalFuelUsed;

            let odomEnd = odomStart;
            if (workdayKeys.length > 0) {
                const lastKey = workdayKeys[workdayKeys.length - 1];
                odomEnd = Number(workdays[lastKey].odometerEnd) || (odomStart + totalKm);
            } else {
                odomEnd = odomStart;
            }

            return {
                odometerStart: odomStart,
                fuelStart: Number(fuelStart.toFixed(3)),
                odometerEnd: Number(odomEnd.toFixed(2)),
                fuelEnd: Number(fuelEnd.toFixed(3)),
                totalKm: Number(totalKm.toFixed(2)),
                totalFuelUsed: Number(totalFuelUsed.toFixed(3)),
                workdaysCount: workdayKeys.length
            };
        };

        /** Универсальный вызов Google Apps Script Web App (строго text/plain для обхода CORS) */
        const callGoogleScript = async (url, action, payload = {}) => {
            const targetUrl = url || DEFAULT_GOOGLE_SCRIPT_URL;
            const body = JSON.stringify({ action, ...payload });
            const res = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: body
            });
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }
            const data = await res.json();
            return data;
        };

        /** Пересчёт цепочки рабочих дней месяца */
        const recalcWorkdays = (workdays, odometerStart, fuelStart, refuels, activeNorm) => {
            const sortedKeys = Object.keys(workdays).sort();
            const refuelMap = {};
            refuels.forEach(r => {
                if (!refuelMap[r.date]) refuelMap[r.date] = 0;
                refuelMap[r.date] += Number(r.liters) || 0;
            });

            let odom = Number(odometerStart) || 0;
            let fuel = Number(fuelStart)     || 0;
            const updated = {};

            sortedKeys.forEach(dateKey => {
                const day = { ...workdays[dateKey] };
                const refuelToday = refuelMap[dateKey] || 0;
                const km = Number(day.tripKm) || 0;
                const norm = Number(activeNorm) || 0;

                day.odometerStart = odom;
                day.fuelStart     = fuel + refuelToday;  // заправка учитывается утром дня
                day.odometerEnd   = odom + km;
                day.fuelEnd       = day.fuelStart - (norm > 0 ? (km * norm / 100) : 0);

                if (day.isWorkday) {
                    odom = day.odometerEnd;
                    fuel = day.fuelEnd;

                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors focus:outline-none focus:ring-2 ${inputClass}`}
                                    value={profile.normWinter || ''}

                                    placeholder="Адрес начала и конца каждого маршрута"

        /* ═══════════════════════════════════════════════════
           7.1. КОМПОНЕНТ: СТРОКА ЗАПРАВКИ (ТОЧНОСТЬ ДО 3 ЗНАКОВ)
        ═══════════════════════════════════════════════════ */
        const RefuelItem = ({ r, idx, totalDays, year, month, updateRefuel, removeRefuel, inputSm }) => {
            const [litersStr, setLitersStr] = useState(() => (
                r.liters !== undefined && r.liters !== null && r.liters !== '' ? formatFuel(r.liters) : ''
            ));
            const [isFocused, setIsFocused] = useState(false);

            useEffect(() => {
                if (!isFocused) {
                    setLitersStr(
                        r.liters !== undefined && r.liters !== null && r.liters !== '' ? formatFuel(r.liters) : ''
                    );
                }
            }, [r.liters, isFocused]);

            return (
                <div className="flex items-center gap-2">
                    {/* Дата — выпадающий список с числами месяца */}
                    <select
                        className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                        value={parseDate(r.date || toDateStr(year, month, 1)).day}
                        onChange={e => {
                            const day = Number(e.target.value);
                            updateRefuel(idx, 'date', toDateStr(year, month, day));
                        }}
                    >
                        {Array.from({ length: totalDays }, (_, i) => i + 1).map(d => (
                            <option key={d} value={d}>{d} {MONTH_NAMES_GEN[month]}</option>
                        ))}
                    </select>
                    {/* Литры — строковый ввод с форматированием до 3 знаков при потере фокуса */}
                    <input
                        type="text"
                        inputMode="decimal"
                        className={`w-28 p-2 text-[16px] sm:text-sm rounded border text-center ${inputSm}`}
                        placeholder="0.000"
                        value={litersStr}
                        onFocus={() => setIsFocused(true)}
                        onChange={e => {
                            setLitersStr(e.target.value);
                            const val = parseFuelInput(e.target.value);
                            updateRefuel(idx, 'liters', val);
                        }}
                        onBlur={() => {
                            setIsFocused(false);
                            const val = parseFuelInput(litersStr);
                            setLitersStr(val > 0 ? formatFuel(val) : (litersStr.trim() === '' ? '' : '0.000'));
                            updateRefuel(idx, 'liters', val);
                        }}
                    />
                    <span className="text-xs opacity-50">л</span>
                    <button
                        type="button"
                        onClick={() => removeRefuel(idx)}
                        className="p-2 min-h-[36px] rounded text-red-400 hover:text-red-600 transition-colors"
                        aria-label="Удалить заправку"
                    >
                        <IconTrash size={16} />
                    </button>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           7.5. ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ: ЗАГРУЗКА ШАБЛОНА .xlsx
        ═══════════════════════════════════════════════════ */
        const loadTemplateBuffer = async (templateBufferRef) => {
            if (templateBufferRef && templateBufferRef.current) {
                return templateBufferRef.current;
            }
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 5000);
                const resp = await fetch('./template.xlsx', { signal: ctrl.signal });
                clearTimeout(timer);
                if (resp.ok) {
                    const buf = await resp.arrayBuffer();
                    if (templateBufferRef) templateBufferRef.current = buf;
                    return buf;
                }
            } catch {}
            return new Promise((resolve, reject) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.onchange = async (e) => {
                    document.body.removeChild(input);
                    const file = e.target.files && e.target.files[0];
                    if (!file) { reject(new Error('Файл не выбран')); return; }
                    const buf = await file.arrayBuffer();
                    if (templateBufferRef) templateBufferRef.current = buf;
                    resolve(buf);
                };
                input.oncancel = () => { try { document.body.removeChild(input); } catch {} reject(new Error('Отменено')); };
                input.click();
            });
        };

        /* ═══════════════════════════════════════════════════
           8. КОМПОНЕНТ: НАСТРОЙКА МЕСЯЦА + РАБОЧИЕ ДНИ
        ═══════════════════════════════════════════════════ */
        const MonthSetup = ({ monthData, profile, onUpdate, allMonths, onUpdateAllMonths, onChangeMonthKey, onPullPrevMonth, onSaveMonthCloud, onLoadMonthCloud, onExportExcel, cloudStatus, userPhone, t }) => {

            const year  = monthData.year;
            const month = monthData.month;
            const totalDays = daysInMonth(year, month);
            const prevKey = getPrevMonthKey(year, month);
            const [pYear, pMonth] = prevKey.split('-').map(Number);
            const prevMonthName = `${MONTH_NAMES[pMonth]} ${pYear}`;

            /* ---- Автосезон ---- */
            const autoSeason  = getSeason(year, month);
            const activeSeason = monthData.seasonOverride || autoSeason;
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            /* ---- Локальное строковое состояние для ввода остатка топлива на начало ---- */
            const [fuelStartStr, setFuelStartStr] = useState(() => (
                monthData.fuelStart !== undefined && monthData.fuelStart !== null && monthData.fuelStart !== ''
                    ? formatFuel(monthData.fuelStart)
                    : ''
            ));
            const [isFuelStartFocused, setIsFuelStartFocused] = useState(false);

            /* ---- Состояние раскрытого дня для просмотра и редактирования маршрута ---- */
            const [expandedDayKey, setExpandedDayKey] = useState(null);

            useEffect(() => {
                if (!isFuelStartFocused && document.activeElement?.id !== 'input-fuel-start') {
                    setFuelStartStr(
                        monthData.fuelStart !== undefined && monthData.fuelStart !== null && monthData.fuelStart !== ''
                            ? formatFuel(monthData.fuelStart)
                            : ''
                    );
                }
            }, [monthData.fuelStart, year, month, isFuelStartFocused]);

            /* ---- Загрузка текущего месяца из Google Таблицы с подтверждением ---- */
            const handleLoadMonthClick = () => {
                if (!onLoadMonthCloud) return;
                const hasWorkdays = Object.values(monthData.workdays || {}).some(d => d.isWorkday && ((Number(d.tripKm) || 0) > 0 || (d.trips || []).length > 0));
                const hasRefuels = (monthData.refuels || []).length > 0;
                if (hasWorkdays || hasRefuels) {
                    const confirmed = confirm('Загрузить данные за этот месяц из Google Таблицы? Текущие несохранённые изменения будут заменены.');
                    if (!confirmed) return;
                }
                onLoadMonthCloud();
            };

            /* ---- Вспомогалки обновления состояния ---- */
            const update = (patch) => onUpdate({ ...monthData, ...patch }, true);

            const updateWorkdays = (newWd) => {
                const recalced = recalcWorkdays(
                    newWd,
                    monthData.odometerStart,
                    monthData.fuelStart,
                    monthData.refuels,
                    activeNorm
                );
                update({ workdays: recalced });
            };

            /* ---- Обеспечение наличия workdays для всех дней месяца ---- */
            const ensureWorkdays = () => {
                const wd = { ...(monthData.workdays || {}) };
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (!wd[key]) {
                        wd[key] = {
                            isWorkday:     false,
                            tripKm:        0,
                            odometerStart: 0,
                            odometerEnd:   0,
                            fuelStart:     0,
                            fuelEnd:       0,
                            trips:         [],
                        };
                    }
                }
                return wd;
            };

            /* ---- Переключение рабочего дня ---- */
            const toggleWorkday = (dateKey) => {
                const wd = ensureWorkdays();
                // Нельзя снять флаг если в этот день есть заправка
                const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                if (hasRefuel && wd[dateKey].isWorkday) return; // заправочный день всегда рабочий
                wd[dateKey] = { ...wd[dateKey], isWorkday: !wd[dateKey].isWorkday };
                updateWorkdays(wd);
            };

            /* ---- Изменение пробега дня ---- */
            const setDayKm = (dateKey, km) => {
                const wd = ensureWorkdays();
                wd[dateKey] = { ...wd[dateKey], tripKm: Number(km) || 0 };
                updateWorkdays(wd);
            };

            /* ---- Редактирование промежуточных точек маршрута дня ---- */
            const addDayTrip = (dateKey) => {
                const wd = ensureWorkdays();
                const curTrips = Array.isArray(wd[dateKey]?.trips) ? [...wd[dateKey].trips] : [];
                curTrips.push({
                    order: curTrips.length + 1,
                    address: '',
                    time: '',
                    taskType: ''
                });
                wd[dateKey] = { ...wd[dateKey], isWorkday: true, trips: curTrips };
                updateWorkdays(wd);
            };

            const updateDayTrip = (dateKey, tripIdx, field, val) => {
                const wd = ensureWorkdays();
                const curTrips = Array.isArray(wd[dateKey]?.trips) ? [...wd[dateKey].trips] : [];
                if (curTrips[tripIdx]) {
                    curTrips[tripIdx] = { ...curTrips[tripIdx], [field]: val };
                    wd[dateKey] = { ...wd[dateKey], trips: curTrips };
                    updateWorkdays(wd);
                }
            };

            const removeDayTrip = (dateKey, tripIdx) => {
                const wd = ensureWorkdays();
                const curTrips = (Array.isArray(wd[dateKey]?.trips) ? wd[dateKey].trips : [])
                    .filter((_, i) => i !== tripIdx)
                    .map((pt, i) => ({ ...pt, order: i + 1 }));
                wd[dateKey] = { ...wd[dateKey], trips: curTrips };
                updateWorkdays(wd);
            };

            /* ---- Таблица заправок ---- */
            const addRefuel = () => {
                const refuels = [...(monthData.refuels || [])];
                // День по умолчанию — 1-е число
                const defaultDate = toDateStr(year, month, 1);
                refuels.push({ date: defaultDate, liters: 0 });
                // Автоматически делаем день рабочим
                const wd = ensureWorkdays();
                wd[defaultDate] = { ...wd[defaultDate], isWorkday: true };
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const removeRefuel = (idx) => {
                const oldRefuel = (monthData.refuels || [])[idx];
                const oldDate = oldRefuel ? oldRefuel.date : null;
                const refuels = (monthData.refuels || []).filter((_, i) => i !== idx);
                const wd = ensureWorkdays();
                if (oldDate) {
                    const hasOtherRefuels = refuels.some(r => r.date === oldDate);
                    const oldDay = wd[oldDate];
                    const tripKm = Number(oldDay?.tripKm) || 0;
                    const tripsCount = (oldDay?.trips || []).length;
                    if (!hasOtherRefuels && tripKm === 0 && tripsCount === 0) {
                        wd[oldDate] = { ...wd[oldDate], isWorkday: false };
                    }
                }
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const updateRefuel = (idx, field, val) => {
                const oldRefuel = (monthData.refuels || [])[idx];
                const oldDate = oldRefuel ? oldRefuel.date : null;

                const refuels = (monthData.refuels || []).map((r, i) => {
                    if (i !== idx) return r;
                    const updated = { ...r, [field]: val };
                    return updated;
                });
                const wd = ensureWorkdays();

                // Если поменялась дата заправки — снимаем флаг со старой даты, если там больше нет заправок и поездок
                if (field === 'date' && oldDate && oldDate !== val) {
                    const hasOtherRefuelsOnOldDate = refuels.some((r, i) => i !== idx && r.date === oldDate);
                    const oldDay = wd[oldDate];
                    const tripKm = Number(oldDay?.tripKm) || 0;
                    const tripsCount = (oldDay?.trips || []).length;
                    if (!hasOtherRefuelsOnOldDate && tripKm === 0 && tripsCount === 0) {
                        wd[oldDate] = { ...wd[oldDate], isWorkday: false };
                    }
                }

                // Новая дата заправки обязательно становится рабочим днем
                refuels.forEach(r => {
                    if (r.date) {
                        wd[r.date] = { ...wd[r.date], isWorkday: true };
                    }
                });

                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            /* ---- Импорт поездок из JSON/CSV (поддержка выгрузки из «Маршрутов» routes_all.csv) ---- */
            const handleImportRoutes = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        let text = ev.target.result;
                        if (!text) {
                            alert('Выбранный файл пуст.');
                            return;
                        }

                        // 1. Снимаем UTF-8 BOM
                        text = text.replace(/^\uFEFF/, '');
                        const groupedByDate = {}; // { 'YYYY-MM-DD': [ { order, taskType, time, address } ] }
                        let totalPointsCount = 0;

                        // Очищенный базовый адрес старта/финиша для исключения дублирования
                        const cleanStartPoint = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                        const isStartPointAddr = (addr) => {
                            if (!cleanStartPoint || !addr) return false;
                            return String(addr).toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '') === cleanStartPoint;
                        };

                        if (file.name.endsWith('.json')) {
                            // JSON формат
                            const parsed = JSON.parse(text);
                            if (Array.isArray(parsed)) {
                                parsed.forEach(item => {
                                    const d = normalizeDateStr(item.date || item.Date);
                                    const rawAddr = (item.address || item['Адрес'] || '').trim();
                                    if (d && rawAddr && !isStartPointAddr(rawAddr)) {
                                        if (!groupedByDate[d]) groupedByDate[d] = [];
                                        const ord = Number(item.order || item['№']) || (groupedByDate[d].length + 1);
                                        groupedByDate[d].push({
                                            order: ord,
                                            taskType: item.taskType || item.type || item['Тип'] || '',
                                            time: item.time || item['Время'] || '',
                                            address: rawAddr
                                        });
                                        totalPointsCount++;
                                    }
                                });
                            } else if (typeof parsed === 'object' && parsed !== null) {
                                Object.entries(parsed).forEach(([dKey, val]) => {
                                    const d = normalizeDateStr(dKey);
                                    if (!d) return;
                                    const pts = Array.isArray(val) ? val : (Array.isArray(val?.points) ? val.points : []);
                                    if (!groupedByDate[d]) groupedByDate[d] = [];
                                    pts.forEach(p => {
                                        const rawAddr = (p.address || p['Адрес'] || '').trim();
                                        if (rawAddr && !isStartPointAddr(rawAddr)) {
                                            const ord = Number(p.order || p['№']) || (groupedByDate[d].length + 1);
                                            groupedByDate[d].push({
                                                order: ord,
                                                taskType: p.taskType || p.type || p['Тип'] || '',
                                                time: p.time || p['Время'] || '',
                                                address: rawAddr
                                            });
                                            totalPointsCount++;
                                        }
                                    });
                                });
                            }
                        } else {
                            // CSV формат (routes_all.csv и др.)
                            const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                            if (rawLines.length === 0) {
                                alert('В файле CSV отсутствуют строки данных.');
                                return;
                            }

                            // 2. Автоопределение разделителя: точка с запятой ';' или запятая ','
                            const firstLine = rawLines[0];
                            const delimiter = firstLine.includes(';') ? ';' : ',';

                            // 3. Разбор заголовков с нормализацией (русские и английские варианты)
                            const headerCols = parseCsvLine(firstLine, delimiter);
                            const headers = headerCols.map(h => normalizeHeader(h));

                            // 4. Разбор строк поездок
                            for (let i = 1; i < rawLines.length; i++) {
                                const cols = parseCsvLine(rawLines[i], delimiter);
                                if (cols.length === 0 || cols.every(c => !c)) continue;

                                const row = {};
                                headers.forEach((h, colIdx) => {
                                    row[h] = cols[colIdx] !== undefined ? cols[colIdx] : '';
                                });

                                const rawDate = row.date;
                                if (!rawDate) continue;
                                const date = normalizeDateStr(rawDate);
                                if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;

                                const rawAddress = (row.address || '').trim();
                                if (!rawAddress) continue;

                                // Если адрес совпадает с profile.startPoint — пропускаем, так как старт/возврат закреплены динамически
                                if (isStartPointAddr(rawAddress)) {
                                    continue;
                                }

                                if (!groupedByDate[date]) {
                                    groupedByDate[date] = [];
                                }

                                const ord = Number(String(row.order).replace(/\D/g, '')) || (groupedByDate[date].length + 1);
                                groupedByDate[date].push({
                                    order: ord,
                                    taskType: row.taskType || row.task || '',
                                    time: row.time || '',
                                    address: rawAddress
                                });
                                totalPointsCount++;
                            }
                        }

                        // Сортировка точек внутри каждого дня по порядку № (order)
                        Object.keys(groupedByDate).forEach(d => {
                            groupedByDate[d].sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
                        });

                        const datesFound = Object.keys(groupedByDate);
                        if (datesFound.length === 0) {
                            alert('В файле не найдено строк с корректными датами поездок.');
                            return;
                        }

                        // Группировка дат по месяцам 'YYYY-MM'
                        const byMonth = {};
                        datesFound.forEach(d => {
                            const mKey = d.slice(0, 7);
                            if (!byMonth[mKey]) byMonth[mKey] = {};
                            byMonth[mKey][d] = groupedByDate[d];
                        });

                        const currentKey = `${year}-${String(month).padStart(2, '0')}`;
                        const otherMonthKeys = Object.keys(byMonth).filter(k => k !== currentKey);

                        // Применение данных: обновляем месяцы в общем хранилище
                        if (typeof onUpdateAllMonths === 'function') {
                            onUpdateAllMonths(prevMonths => {
                                const updatedMonths = { ...prevMonths };
                                Object.entries(byMonth).forEach(([mKey, daysMap]) => {
                                    const [y, m] = mKey.split('-').map(Number);
                                    const mData = updatedMonths[mKey] ? { ...updatedMonths[mKey] } : {
                                        year: y,
                                        month: m,
                                        seasonOverride: null,
                                        odometerStart: 0,
                                        fuelStart: 0,
                                        refuels: [],
                                        workdays: {}
                                    };
                                    const totDays = daysInMonth(y, m);
                                    const wd = { ...(mData.workdays || {}) };
                                    for (let dayNum = 1; dayNum <= totDays; dayNum++) {
                                        const dayKey = toDateStr(y, m, dayNum);
                                        if (!wd[dayKey]) {
                                            wd[dayKey] = {
                                                isWorkday: false,
                                                tripKm: 0,
                                                odometerStart: 0,
                                                odometerEnd: 0,
                                                fuelStart: 0,
                                                fuelEnd: 0,
                                                trips: []
                                            };
                                        }
                                    }
                                    Object.entries(daysMap).forEach(([dKey, pts]) => {
                                        if (wd[dKey]) {
                                            wd[dKey] = {
                                                ...wd[dKey],
                                                isWorkday: true,
                                                trips: pts
                                            };
                                        }
                                    });
                                    const season = mData.seasonOverride || getSeason(y, m);
                                    const norm = season === 'summer'
                                        ? (Number(profile.normSummer) || 0)
                                        : (Number(profile.normWinter) || 0);
                                    mData.workdays = recalcWorkdays(
                                        wd,
                                        mData.odometerStart,
                                        mData.fuelStart,
                                        mData.refuels || [],
                                        norm
                                    );
                                    updatedMonths[mKey] = mData;
                                });
                                return updatedMonths;
                            });
                        } else {
                            // Резервное локальное обновление только текущего месяца
                            const wd = ensureWorkdays();
                            if (byMonth[currentKey]) {
                                Object.entries(byMonth[currentKey]).forEach(([dKey, pts]) => {
                                    if (wd[dKey]) {
                                        wd[dKey] = {
                                            ...wd[dKey],
                                            isWorkday: true,
                                            trips: pts
                                        };
                                    }
                                });
                                updateWorkdays(wd);
                            }
                        }

                        // Информативное уведомление
                        let msg = `Маршруты успешно загружены (${totalPointsCount} точек, ${datesFound.length} дн.)!\n`;
                        if (byMonth[currentKey]) {
                            const curDays = Object.keys(byMonth[currentKey]).length;
                            const curPts = Object.values(byMonth[currentKey]).reduce((s, p) => s + p.length, 0);
                            msg += `• Текущий месяц (${MONTH_NAMES[month]} ${year}): ${curDays} дн., ${curPts} точек\n`;
                        } else {
                            msg += `• Внимание: в файле нет поездок за текущий месяц (${MONTH_NAMES[month]} ${year})\n`;
                        }
                        if (otherMonthKeys.length > 0) {
                            msg += '• Другие месяцы в файле:\n';
                            otherMonthKeys.sort().forEach(mk => {
                                const [oy, om] = mk.split('-').map(Number);
                                const oDays = Object.keys(byMonth[mk]).length;
                                const oPts = Object.values(byMonth[mk]).reduce((s, p) => s + p.length, 0);
                                msg += `  - ${MONTH_NAMES[om]} ${oy}: ${oDays} дн., ${oPts} точек\n`;
                            });
                            msg += 'Переключите месяц во вкладке, чтобы просмотреть их.';
                        }
                        alert(msg.trim());

                    } catch (err) {
                        alert('Ошибка разбора файла маршрутов: ' + (err?.message || err));
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file, 'utf-8');
            };

            /* ---- Подтянуть из истории браузера ---- */
            const pullFromHistory = () => {
                try {
                    const raw = localStorage.getItem('expert_app_route_history_v1');
                    if (!raw) { alert('История маршрутов не найдена в браузере'); return; }
                    const history = JSON.parse(raw);
                    const prefix  = `${year}-${String(month).padStart(2,'0')}-`;
                    const wd = ensureWorkdays();
                    let count = 0;
                    Object.entries(history).forEach(([dateKey, dayData]) => {
                        if (!dateKey.startsWith(prefix)) return;
                        if (!wd[dateKey]) return;
                        const points = Array.isArray(dayData.points) ? dayData.points : [];
                        wd[dateKey] = { ...wd[dateKey], isWorkday: true, trips: points };
                        count++;
                    });
                    if (count === 0) { alert('Нет маршрутов за выбранный месяц в истории браузера'); return; }
                    updateWorkdays(wd);
                    alert(`Подтянуто ${count} дн. из истории браузера`);
                } catch (err) {
                    alert('Ошибка чтения истории: ' + err.message);
                }
            };

            /* ---- Импорт входящих данных из прошлого отчёта ---- */
            const handleImportPrevMonth = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const buf = await file.arrayBuffer();
                    const wb  = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);

                    // Лист «Расчет» — ищем по имени без учета регистра и пробелов (с поддержкой буквы «ё»)
                    const ws = (wb.worksheets || []).find(s => {
                        const n = (s.name || '').trim().toLowerCase();
                        return n === 'расчет' || n === 'расчёт';
                    }) || wb.getWorksheet('Расчет') || wb.getWorksheet('Расчёт');

                    if (!ws) {
                        alert('Лист «Расчет» не найден в выбранном файле Excel. Проверьте правильность файла отчёта.');
                        return;
                    }

                    // Конечный одометр (odometerEnd): снизу вверх по строкам от 35 до 5 по колонке D.
                    // Первое найденное число > 0 (нерабочие дни в конце месяца пустые).
                    let odometerEnd = null;
                    for (let row = 35; row >= 5; row--) {
                        const val = extractNumericCell(ws.getCell('D' + row));
                        if (val !== null && val > 0) {
                            odometerEnd = Math.round(val);
                            break;
                        }
                    }

                    // Конечный остаток топлива (fuelEnd): снизу вверх по строкам от 35 до 5 по колонке J.
                    // Первое найденное число >= 0 (обычно J35), округлить до 3 знаков после запятой.
                    let fuelEnd = null;
                    for (let row = 35; row >= 5; row--) {
                        const val = extractNumericCell(ws.getCell('J' + row));
                        if (val !== null && val >= 0) {
                            fuelEnd = Number(val.toFixed(3));
                            break;
                        }
                    }

                    if (odometerEnd === null && fuelEnd === null) {
                        alert('Не удалось найти данные одометра (колонка D) и остатка топлива (колонка J) в строках 5–35 на листе «Расчет».');
                        return;
                    }
                    if (odometerEnd === null) {
                        alert('Не удалось найти конечный одометр в колонке D (строки 5–35) на листе «Расчет».');
                        return;
                    }
                    if (fuelEnd === null) {
                        alert('Не удалось найти конечный остаток топлива в колонке J (строки 5–35) на листе «Расчет».');
                        return;
                    }

                    // Применяем входящие данные в текущий месяц и пересчитываем цепочку рабочих дней
                    const wd = recalcWorkdays(
                        ensureWorkdays(),
                        odometerEnd,
                        fuelEnd,
                        monthData.refuels || [],
                        activeNorm
                    );
                    update({
                        odometerStart: odometerEnd,
                        fuelStart: fuelEnd,
                        workdays: wd
                    });

                    const odomFmt = odometerEnd.toLocaleString('ru-RU');
                    alert(`Загружено из прошлого отчёта: одометр ${odomFmt} км, остаток ${formatFuel(fuelEnd)} л`);
                } catch (err) {
                    alert('Ошибка чтения файла: ' + (err?.message || err));
                } finally {
                    e.target.value = '';
                }
            };

            /* ---- Общая статистика ---- */
            const workdays      = monthData.workdays || {};
            const workdayKeys   = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm       = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalFuelUsed = activeNorm > 0 ? (totalKm * activeNorm / 100) : 0;
            const totalRefuels  = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const fuelEnd       = (Number(monthData.fuelStart) || 0) + totalRefuels - totalFuelUsed;

                                        !userPhone ? 'opacity-40 cursor-not-allowed bg-gray-600 text-white' : btnPrimary

                        {(monthData.refuels || []).length === 0 ? (

                        <div className="mt-2 text-right text-xs opacity-60">

                        </div>

                    {/* ── Импорт маршрутов ── */}

                                                    <button

                                                {/* 1. Первая строка: ЗАКРЕПЛЁННЫЙ СТАРТ (из profile.startPoint) */}

                        {/* Итоги месяца */}
                        <div className={`mt-3 pt-3 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                            <div className="grid grid-cols-2 gap-2 text-xs">
                                <div className="opacity-60">Рабочих дней:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{workdayKeys.length}</div>
                                <div className="opacity-60">Общий пробег:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{totalKm.toFixed(0)} км</div>
                                <div className="opacity-60">Расход топлива:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{formatFuel(totalFuelUsed)} л</div>
                                <div className="opacity-60">Итоговый остаток:</div>
                                <div className={`font-bold text-right ${fuelEnd < 0 ? 'text-red-500' : accentClass}`}>

                    {/* ── Кнопки синхронизации месяца с Google Таблицей ── */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <button
                            type="button"
                            onClick={handleLoadMonthClick}

                            className={`w-full min-h-[48px] flex items-center justify-center gap-2 rounded-lg text-sm font-bold transition-all ${

                            onClick={onSaveMonthCloud}

                        >
                            <IconCloud size={18} />

                        onClick={() => onExportExcel && onExportExcel()}
                        className="w-full min-h-[48px] flex items-center justify-center gap-2 rounded-lg text-sm font-bold bg-green-600 hover:bg-green-700 active:bg-green-800 text-white transition-colors"
                        title="Скачать отчёт в формате .xlsx"
