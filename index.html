                        title="Экспорт в xlsx будет доступен на Этапе 2"
                    >
                        <IconDownload size={18} />
                        Скачать отчёт (.xlsx) — доступно на Этапе 2
                    </button>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           9. КОМПОНЕНТ: ЭКРАН АВТОПОДБОРА
        ═══════════════════════════════════════════════════ */
        const AutoSelectScreen = ({ monthData, profile, t }) => {
            const year  = monthData.year;
            const month = monthData.month;
            const activeSeason = monthData.seasonOverride || getSeason(year, month);
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            const [targetFuel, setTargetFuel] = useState('');

            const fuelStart    = Number(monthData.fuelStart) || 0;
            const totalRefuels = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const workdays     = monthData.workdays || {};
            const workdayKeys  = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const kmFromRoutes = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);

            const target         = parseFuelInput(targetFuel);
            const requiredFuel   = fuelStart + totalRefuels - target;
            const requiredKm     = activeNorm > 0 ? (requiredFuel / activeNorm * 100) : 0;
            const missingKm      = Math.max(0, requiredKm - kmFromRoutes);

            const accentClass = t(
                'text-[#FFB300]','text-amber-700','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );
            const cardClass = t(
                'bg-[#1E2125] border-[#3A3D42]',
                'bg-gray-50 border-gray-200',
                'bg-pink-50 border-pink-200',
                'bg-blue-50/50 border-blue-200',
                'bg-emerald-50 border-emerald-200',
                'bg-[#F5F2EE] border-[#D7CCC8]',
                'bg-gray-50 border-gray-200'
            );
            const inputSm = t(
                'bg-[#282B30] border-gray-700 text-white',
                'bg-white border-gray-300 text-gray-900',
                'bg-pink-50 border-pink-200 text-pink-900',
                'bg-blue-50 border-blue-200 text-blue-900',
                'bg-emerald-50 border-emerald-200 text-emerald-900',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723]',
                'bg-white border-gray-300 text-gray-900'
            );

            return (
                <div className="max-w-3xl mx-auto w-full space-y-4 animate-fade-in">
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-1 ${accentClass}`}>АВТОПОДБОР ПРОБЕГА</p>
                        <p className="text-xs opacity-50 mb-3">
                            Введите целевой остаток топлива на конец месяца — система рассчитает нужный пробег.
                        </p>

                        <div className="mb-3">
                            <label className="block text-xs opacity-60 mb-1">Целевой остаток на конец месяца (л)</label>
                            <input
                                type="text"
                                inputMode="decimal"
                                className={`w-full p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                placeholder="Например: 10.000"
                                value={targetFuel}
                                onChange={e => setTargetFuel(e.target.value)}
                                onBlur={() => {
                                    if (targetFuel.trim() !== '') {
                                        const v = parseFuelInput(targetFuel);
                                        setTargetFuel(formatFuel(v));
                                    }
                                }}
                            />
                        </div>

                        <div className="space-y-2 text-sm">
                            <div className="flex justify-between">
                                <span className="opacity-60">Начальный остаток:</span>
                                <span className="font-mono font-bold">{formatFuel(fuelStart)} л</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="opacity-60">Сумма заправок:</span>
                                <span className="font-mono font-bold">+{formatFuel(totalRefuels)} л</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="opacity-60">Целевой остаток:</span>
                                <span className="font-mono font-bold">−{formatFuel(target)} л</span>
                            </div>
                            <div className={`flex justify-between font-bold pt-1 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                <span className={accentClass}>Требуемый расход:</span>
                                <span className={`font-mono ${accentClass}`}>{formatFuel(requiredFuel)} л</span>
                            </div>
                            <div className={`flex justify-between font-bold ${accentClass}`}>
                                <span>Требуемый пробег:</span>
                                <span className="font-mono">{requiredKm.toFixed(1)} км</span>
                            </div>
                            <div className="flex justify-between opacity-70">
                                <span>Пробег из маршрутов:</span>
                                <span className="font-mono">{kmFromRoutes.toFixed(1)} км</span>
                            </div>
                            <div className={`flex justify-between font-bold pt-1 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                <span className={missingKm > 0 ? 'text-orange-500' : 'text-green-500'}>
                                    {missingKm > 0 ? '⚠ Недостающий пробег:' : '✓ Маршрутов достаточно:'}
                                </span>
                                <span className={`font-mono ${missingKm > 0 ? 'text-orange-500' : 'text-green-500'}`}>
                                    {missingKm > 0 ? `${missingKm.toFixed(1)} км` : '0 км'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Выбор дней */}
                    {missingKm > 0 && workdayKeys.length > 0 && (
                        <div className={`rounded-lg border p-3 ${cardClass}`}>
                            <p className={`text-xs font-bold mb-2 ${accentClass}`}>
                                РАСПРЕДЕЛЕНИЕ НЕДОСТАЮЩЕГО ПРОБЕГА
                            </p>
                            <p className="text-xs opacity-50 mb-2">
                                Выберите дни для добавления пробега. Дни с заправками — обязательны.
                            </p>
                            <div className="flex flex-wrap gap-2">
                                {workdayKeys.map(dateKey => {
                                    const { day: d } = parseDate(dateKey);
                                    const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                                    return (
                                        <div
                                            key={dateKey}
                                            className={`w-9 h-9 rounded flex items-center justify-center text-sm font-bold border ${
                                                hasRefuel
                                                    ? t('bg-[#FFB300] text-black border-[#FFB300]','bg-amber-500 text-white border-amber-500','bg-pink-500 text-white border-pink-500','bg-blue-600 text-white border-blue-600','bg-emerald-600 text-white border-emerald-600','bg-[#6D4C41] text-white border-[#6D4C41]','bg-[#C62828] text-white border-[#C62828]')
                                                    : t('border-gray-600 text-gray-400','border-gray-300 text-gray-500','border-pink-200 text-pink-400','border-blue-200 text-blue-400','border-emerald-200 text-emerald-500','border-[#D7CCC8] text-[#A1887F]','border-gray-300 text-gray-500')
                                            }`}
                                            title={hasRefuel ? 'День с заправкой' : ''}
                                        >
                                            {d}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Заглушки кнопок Этапа 2 */}
                    <button
                        disabled
                        className="w-full min-h-[48px] flex items-center justify-center gap-2 rounded-lg text-sm font-bold opacity-40 cursor-not-allowed bg-gray-400 text-white"
                    >
                        🗺 Подобрать маршруты (Яндекс Карты) — Этап 2
                    </button>
                    <button
                        disabled
                        className="w-full min-h-[48px] flex items-center justify-center gap-2 rounded-lg text-sm font-bold opacity-40 cursor-not-allowed bg-gray-400 text-white"
                    >
                        <IconDownload size={18} />
                        Сформировать и скачать отчёт — Этап 2
                    </button>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           9.1. КОМПОНЕНТ: ОКНО АВТОРИЗАЦИИ (ТЕЛЕФОН + ПИН-КОД)
        ═══════════════════════════════════════════════════ */
        const AuthModal = ({ initialPhone = '', initialPin = '', onLogin, isLoading, errorMsg, t }) => {
            const [phoneInput, setPhoneInput] = useState(() => formatPhoneMask(initialPhone));
            const [pinInput, setPinInput] = useState(() => normalizePin(initialPin));
            const [localError, setLocalError] = useState('');

            const cleanPhone = normalizePhone(phoneInput);
            const cleanPin   = normalizePin(pinInput);
            const canSubmit  = cleanPhone.length === 11 && cleanPin.length === 4 && !isLoading;

            const handlePhoneChange = (e) => {
                const formatted = formatPhoneMask(e.target.value);
                setPhoneInput(formatted);
                setLocalError('');
            };

            const handlePhoneFocus = () => {
                if (!phoneInput) {
                    setPhoneInput('+7 ');
                }
            };

            const handlePinChange = (e) => {
                const p = normalizePin(e.target.value);
                setPinInput(p);
                setLocalError('');
            };

            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (cleanPhone.length !== 11) {
                    setLocalError('Введите корректный номер телефона (11 цифр)');
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLocalError('ПИН-код должен состоять из 4 цифр');
                    return;
                }
                onLogin(cleanPhone, cleanPin);
            };

            const cardClass = t(
                'bg-[#282B30] border-[#FFB300]',
                'bg-white border-gray-300',
                'bg-white border-pink-400',
                'bg-white border-blue-600',
                'bg-white border-emerald-600',
                'bg-[#FDFBF7] border-[#8D6E63]',
                'bg-white border-[#C62828]'
            );

            const overlayInput = t(
                'bg-[#1E2125] border-gray-700 text-white focus:ring-[#FFB300] focus:border-[#FFB300]',
                'bg-gray-50 border-gray-300 text-gray-900 focus:ring-amber-500 focus:border-amber-500',
                'bg-pink-50 border-pink-200 text-pink-900 focus:ring-pink-400 focus:border-pink-400',
                'bg-blue-50 border-blue-200 text-blue-900 focus:ring-blue-500 focus:border-blue-500',
                'bg-emerald-50 border-emerald-200 text-emerald-900 focus:ring-emerald-500 focus:border-emerald-500',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723] focus:ring-[#8D6E63] focus:border-[#8D6E63]',
                'bg-gray-50 border-gray-300 text-gray-900 focus:ring-[#C62828] focus:border-[#C62828]'
            );

            const accentClass = t(
                'text-[#FFB300]','text-amber-800','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );

            const displayError = errorMsg || localError;

            return (
                <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-sm rounded-2xl border-2 ${cardClass} shadow-2xl overflow-hidden`}>
                        {/* Шапка модалки */}
                        <div className={`p-4 border-b text-center ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                            <div className="w-12 h-12 mx-auto mb-2 rounded-full flex items-center justify-center bg-black/10">
                                <IconLock size={24} className={accentClass} />
                            </div>
                            <h3 className={`text-base font-black tracking-widest uppercase ${accentClass}`}>
                                АВТОРИЗАЦИЯ
                            </h3>
                            <p className="text-xs opacity-60 mt-0.5">Вход в учётную запись эксперта</p>
                        </div>

                        {/* Тело формы */}
                        <form onSubmit={handleSubmit} className="p-4 sm:p-5 space-y-4">
                            {/* Ошибка wrong_pin или валидации */}
                            {displayError && (
                                <div className="p-3 rounded-lg bg-red-500/15 border border-red-500/40 text-red-500 text-xs font-bold flex items-start gap-2 animate-fade-in">
                                    <IconAlertTriangle size={16} className="flex-shrink-0 mt-0.5" />
                                    <span>{displayError}</span>
                                </div>
                            )}

                            {/* Поле 1: Номер телефона */}
                            <div>
                                <label className="block text-xs font-bold mb-1 opacity-70">
                                    Номер телефона
                                </label>
                                <input
                                    type="tel"
                                    inputMode="numeric"
                                    maxLength={16}
                                    placeholder="+7 999 000 00 00"
                                    className={`w-full p-2.5 text-[16px] sm:text-sm rounded border font-mono transition-colors focus:outline-none focus:ring-2 ${overlayInput}`}
                                    value={phoneInput}
                                    onChange={handlePhoneChange}
                                    onFocus={handlePhoneFocus}
                                    autoComplete="tel"
                                    disabled={isLoading}
                                />
                            </div>

                            {/* Поле 2: ПИН-код */}
                            <div>
                                <label className="block text-xs font-bold mb-1 opacity-70 text-center">
                                    ПИН-код (4 цифры)
                                </label>
                                <input
                                    type="password"
                                    inputMode="numeric"
                                    maxLength={4}
                                    placeholder="••••"
                                    className={`w-full p-2.5 text-center text-xl tracking-[0.5em] font-mono font-bold rounded border transition-colors focus:outline-none focus:ring-2 ${overlayInput}`}
                                    value={pinInput}
                                    onChange={handlePinChange}
                                    disabled={isLoading}
                                />
                                <p className="text-[11px] opacity-60 text-center mt-1.5 leading-snug">
                                    Если входите впервые — придумайте любой 4-значный ПИН-код и запомните его
                                </p>
                            </div>

                            {/* Кнопка входа */}
                            <button
                                type="submit"
                                disabled={!canSubmit}
                                className={`w-full min-h-[48px] py-3 text-sm font-black rounded-lg uppercase tracking-wider flex items-center justify-center gap-2 transition-all shadow-md ${
                                    !canSubmit ? 'opacity-40 cursor-not-allowed bg-gray-500 text-white' : btnPrimary
                                }`}
                            >
                                {isLoading ? (
                                    <>
                                        <IconRefresh size={16} className="animate-spin" />
                                        <span>Проверка доступа...</span>
                                    </>
                                ) : (
                                    <>
                                        <IconLock size={16} />
                                        <span>ВОЙТИ В ПРИЛОЖЕНИЕ</span>
                                    </>
                                )}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           10. КОМПОНЕНТ: ОКНО НАСТРОЕК
        ═══════════════════════════════════════════════════ */
        const SettingsModal = ({ theme, onThemeChange, settings, onSettingsChange, userPhone, onSwitchUser, onClose, t }) => {
            const [localSettings, setLocalSettings] = useState(() => ({
                ...settings,
                googleScriptUrl: settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL
            }));
            const [confirmReset, setConfirmReset] = useState(false);
            const [confirmSwitch, setConfirmSwitch] = useState(false);
            const [pingStatus, setPingStatus] = useState(null); // 'loading' | 'success' | 'error'
            const [pingMsg, setPingMsg] = useState('');

            const themeIdx  = THEME_LIST.findIndex(x => x.id === theme);
            const prevTheme = () => onThemeChange(THEME_LIST[(themeIdx - 1 + THEME_LIST.length) % THEME_LIST.length].id);
            const nextTheme = () => onThemeChange(THEME_LIST[(themeIdx + 1) % THEME_LIST.length].id);

            const handlePing = async () => {
                setPingStatus('loading');
                setPingMsg('');
                try {
                    const url = localSettings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                    const res = await callGoogleScript(url, 'ping');
                    setPingStatus('success');
                    setPingMsg(res && res.message ? `Подключено: ${res.message}` : 'Подключено ✓');
                } catch (err) {
                    setPingStatus('error');
                    setPingMsg(err.message || 'Ошибка связи');
                }
            };

            const save = () => {
                onSettingsChange({
                    ...localSettings,
                    googleScriptUrl: localSettings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL
                });
                onClose();
            };

            const resetReportData = () => {
                Object.keys(localStorage)
                    .filter(k => k.startsWith('expert_report_'))
                    .forEach(k => localStorage.removeItem(k));
                // expert_app_theme и expert_app_route_history_v1 — НЕ ТРОГАЮТСЯ
                window.location.reload();
            };

            const themeLabel = THEME_LIST[themeIdx]?.label || theme;

            const cardClass = t(
                'bg-[#282B30] border-[#FFB300]',
                'bg-white border-gray-300',
                'bg-white border-pink-400',
                'bg-white border-blue-600',
                'bg-white border-emerald-600',
                'bg-[#FDFBF7] border-[#8D6E63]',
                'bg-white border-[#C62828]'
            );
            const overlayInput = t(
                'bg-[#1E2125] border-gray-700 text-white',
                'bg-gray-50 border-gray-300 text-gray-900',
                'bg-pink-50 border-pink-200 text-pink-900',
                'bg-blue-50 border-blue-200 text-blue-900',
                'bg-emerald-50 border-emerald-200 text-emerald-900',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723]',
                'bg-gray-50 border-gray-300 text-gray-900'
            );
            const accentClass = t(
                'text-[#FFB300]','text-amber-800','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );
            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );
            const rowClass = t(
                'bg-[#1E2125] border-gray-700',
                'bg-gray-50 border-gray-200',
                'bg-pink-50 border-pink-200',
                'bg-blue-50 border-blue-200',
                'bg-emerald-50 border-emerald-200',
                'bg-[#EFEBE9] border-[#D7CCC8]',
                'bg-gray-50 border-gray-200'
            );

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className={`w-full max-w-sm rounded-t-2xl sm:rounded-2xl border-2 ${cardClass} shadow-2xl animate-fade-in overflow-hidden`}>
                        {/* Шапка модалки */}
                        <div className={`flex items-center justify-between p-4 border-b ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                            <div className="flex items-center gap-2">
                                <IconSettings size={18} className={accentClass} />
                                <h3 className={`text-base font-black tracking-widest ${accentClass}`}>НАСТРОЙКИ</h3>
                            </div>
                            <button
                                onClick={onClose}
                                className="text-xs opacity-50 hover:opacity-100 font-bold px-2 py-1"
                            >✕</button>
                        </div>

                        <div className="p-4 space-y-3 overflow-y-auto max-h-[80vh] hide-scrollbar">

                            {/* Блок текущего эксперта */}
                            <div className={`p-3 rounded-lg border ${rowClass}`}>
                                <div className="flex items-center justify-between mb-1">
                                    <span className="text-xs font-bold flex items-center gap-1.5">
                                        <IconUser size={14} className={accentClass} /> Эксперт (портал)
                                    </span>
                                    <span className="text-xs font-mono font-bold opacity-90">
                                        {formatPhoneMask(userPhone) || 'Не авторизован'}
                                    </span>
                                </div>
                                {userPhone && (
                                    <div className="flex items-center gap-1 text-[11px] text-green-500 font-semibold mb-2">
                                        <IconLock size={12} />
                                        <span>ПИН-код активен</span>
                                    </div>
                                )}
                                <div className="mt-1">
                                    {!confirmSwitch ? (
                                        <button
                                            type="button"
                                            onClick={() => setConfirmSwitch(true)}
                                            className="w-full min-h-[36px] py-1 px-2 rounded text-xs font-bold border border-gray-400 opacity-80 hover:opacity-100 flex items-center justify-center gap-1.5"
                                        >
                                            <IconLogOut size={14} />
                                            <span>Сменить аккаунт / Выйти</span>
                                        </button>
                                    ) : (
                                        <div className="flex gap-2 animate-fade-in">
                                            <button
                                                type="button"
                                                onClick={() => setConfirmSwitch(false)}
                                                className="flex-1 min-h-[36px] rounded text-xs font-bold border border-gray-400 opacity-70 hover:opacity-100"
                                            >
                                                Отмена
                                            </button>
                                            <button
                                                type="button"
                                                onClick={onSwitchUser}
                                                className="flex-1 min-h-[36px] rounded text-xs font-bold bg-amber-600 text-white hover:bg-amber-700"
                                            >
                                                Да, выйти!
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Тема */}
                            <div className={`p-3 rounded-lg border flex items-center justify-between ${rowClass}`}>
                                <span className="text-xs font-bold">Тема оформления</span>
                                <div className="flex items-center gap-1">
                                    <button onClick={prevTheme} className="min-h-[36px] p-1 rounded opacity-60 hover:opacity-100">
                                        <IconChevronLeft size={16} />
                                    </button>
                                    <button
                                        onClick={nextTheme}
                                        className={`px-3 py-1.5 rounded text-[11px] font-black flex items-center gap-1 ${
                                            theme === 'expert'      ? 'bg-[#D32F2F] text-white' :
                                            theme === 'expert-dark' ? 'bg-[#75161F] text-white border border-[#FF5252]/40' :
                                            theme === 'newyear'     ? 'bg-gradient-to-r from-[#0F291E] to-[#991B1B] text-[#FBBF24] border border-[#FBBF24]/50' :
                                            btnPrimary
                                        }`}
                                    >
                                        <IconPalette size={13} />
                                        {themeLabel}
                                    </button>
                                    <button onClick={nextTheme} className="min-h-[36px] p-1 rounded opacity-60 hover:opacity-100">
                                        <IconChevronRight size={16} />
                                    </button>
                                </div>
                            </div>

                            {/* Google Apps Script URL с кнопкой проверки */}
                            <div>
                                <div className="flex items-center justify-between mb-1">
                                    <label className="text-xs font-bold opacity-70">URL Google Apps Script</label>
                                    <button
                                        type="button"
                                        onClick={() => setLocalSettings({ ...localSettings, googleScriptUrl: DEFAULT_GOOGLE_SCRIPT_URL })}
                                        className="text-[10px] opacity-60 hover:opacity-100 underline"
                                    >
                                        Сбросить URL
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    <input
                                        type="url"
                                        className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${overlayInput}`}
                                        placeholder="https://script.google.com/macros/s/..."
                                        value={localSettings.googleScriptUrl || ''}
                                        onChange={e => {
                                            setLocalSettings({ ...localSettings, googleScriptUrl: e.target.value });
                                            setPingStatus(null);
                                        }}
                                    />
                                    <button
                                        type="button"
                                        onClick={handlePing}
                                        disabled={pingStatus === 'loading'}
                                        className={`px-3 py-2 min-h-[40px] text-xs font-bold rounded flex items-center gap-1 border transition-all ${
                                            pingStatus === 'loading' ? 'opacity-50' : ''
                                        } ${t(
                                            'border-[#FFB300]/60 text-[#FFB300] hover:bg-[#1E2125]',
                                            'border-amber-500 text-amber-800 hover:bg-amber-50',
                                            'border-pink-400 text-pink-700 hover:bg-pink-50',
                                            'border-blue-500 text-blue-700 hover:bg-blue-50',
                                            'border-emerald-500 text-emerald-800 hover:bg-emerald-50',
                                            'border-[#8D6E63] text-[#5D4037] hover:bg-[#EFEBE9]',
                                            'border-[#C62828] text-[#9A1B24] hover:bg-red-50'
                                        )}`}
                                    >
                                        <IconRefresh size={13} className={pingStatus === 'loading' ? 'animate-spin' : ''} />
                                        <span>{pingStatus === 'loading' ? '...' : 'Проверить связь'}</span>
                                    </button>
                                </div>
                                {pingStatus === 'success' && (
                                    <p className="text-xs text-green-500 font-bold mt-1.5 flex items-center gap-1">
                                        <IconCheck size={14} /> {pingMsg || 'Подключено'}
                                    </p>
                                )}
                                {pingStatus === 'error' && (
                                    <p className="text-xs text-red-500 font-bold mt-1.5 flex items-center gap-1">
                                        <IconAlertTriangle size={14} /> {pingMsg || 'Ошибка подключения'}
                                    </p>
                                )}
                            </div>

                            {/* Ключ Яндекс Карт */}
                            <div>
                                <label className="block text-xs font-bold mb-1 opacity-70">Ключ API Яндекс Карт</label>
                                <input
                                    type="password"
                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border font-mono ${overlayInput}`}
                                    placeholder="Ключ из developer.tech.yandex.ru"
                                    value={localSettings.yandexApiKey || ''}
                                    onChange={e => setLocalSettings({ ...localSettings, yandexApiKey: e.target.value })}
                                />
                            </div>

                            {/* Разделитель */}
                            <div className={`border-t my-1 ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`} />

                            {/* Сброс данных */}
                            <div className={`p-3 rounded-lg border ${t('bg-red-950/20 border-red-900/40','bg-red-50 border-red-200','bg-red-50 border-red-200','bg-red-50 border-red-200','bg-red-50 border-red-200','bg-red-50 border-red-200','bg-red-50 border-red-200')}`}>
                                <div className="flex items-start gap-2 mb-2">
                                    <IconAlertTriangle size={16} className="text-red-500 mt-0.5 flex-shrink-0" />
                                    <div>
                                        <p className="text-xs font-bold text-red-600">Сбросить данные Автоотчёта</p>
                                        <p className="text-xs text-red-500 opacity-80 mt-0.5">
                                            Удалит только ключи <code className="font-mono">expert_report_*</code>.
                                            Тема, история маршрутов и данные других приложений не затрагиваются.
                                        </p>
                                    </div>
                                </div>
                                {!confirmReset ? (
                                    <button
                                        onClick={() => setConfirmReset(true)}
                                        className="w-full min-h-[40px] rounded text-xs font-bold text-red-600 border border-red-400 hover:bg-red-100 transition-colors"
                                    >
                                        Сбросить данные…
                                    </button>
                                ) : (
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setConfirmReset(false)}
                                            className="flex-1 min-h-[40px] rounded text-xs font-bold border border-gray-400 opacity-60 hover:opacity-100"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            onClick={resetReportData}
                                            className="flex-1 min-h-[40px] rounded text-xs font-bold bg-red-600 text-white hover:bg-red-700"
                                        >
                                            Да, сбросить!
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Версия и кнопка закрытия */}
                            <div className="flex items-center justify-between pt-1">
                                <span className="text-[11px] font-mono opacity-40">v{APP_VERSION}</span>
                                <button
                                    onClick={save}
                                    className={`px-5 py-2 min-h-[40px] text-sm font-black rounded ${btnPrimary}`}
                                >
                                    СОХРАНИТЬ И ЗАКРЫТЬ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           11. КОРНЕВОЙ КОМПОНЕНТ App
        ═══════════════════════════════════════════════════ */
        const App = () => {

            /* ── Тема ── */
            const [theme, setTheme] = useState(initTheme);

            /* ── Идентификатор эксперта (телефон / ПИН-код) ── */
            const [userPhone, setUserPhone] = useState(() => {
                return normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
            });
            const [userPin, setUserPin] = useState(() => {
                return normalizePin(localStorage.getItem('expert_app_user_pin') || '');
            });
            const [isAuthVerified, setIsAuthVerified] = useState(() => {
                const p = normalizePhone(localStorage.getItem('expert_app_user_phone') || '');
                const pin = normalizePin(localStorage.getItem('expert_app_user_pin') || '');
                const verified = localStorage.getItem('expert_app_auth_verified');
                return p.length === 11 && pin.length === 4 && verified === 'true';
            });
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            /* ── Режим (официальный / автоподбор) ── */
            const [mode, setMode] = useState('official');

            /* ── Вкладка официального режима ── */
            const [officialTab, setOfficialTab] = useState('profile');

            /* ── Настройки (Google Script URL, Яндекс ключ) ── */
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('expert_report_settings') || '{}');
                    if (!saved.googleScriptUrl) {
                        saved.googleScriptUrl = DEFAULT_GOOGLE_SCRIPT_URL;
                    }
                    return saved;
                } catch {
                    return { googleScriptUrl: DEFAULT_GOOGLE_SCRIPT_URL };
                }
            });

            /* ── Профиль сотрудника ── */
            const [profile, setProfile] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_profile') || '{}');
                } catch { return {}; }
            });

            /* ── Данные месяцев ── */
            const [months, setMonths] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('expert_report_months') || '{}');
                } catch { return {}; }
            });

            /* ── Статус облачной синхронизации ── */
            const [cloudStatus, setCloudStatus] = useState('idle'); // 'idle' | 'syncing' | 'saved' | 'error'
            const [cloudErrorMsg, setCloudErrorMsg] = useState('');

            /* ── Защитные флаги для автосохранения ── */
            const isHydratingRef = useRef(true);
            const userChangedProfileRef = useRef(false);
            const userChangedMonthRef = useRef(false);
            const profileDebounceRef = useRef(null);
            const monthDebounceRef = useRef(null);

            /* ── Текущий месяц по умолчанию — сегодня ── */
            const now = new Date();
            const defaultKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}`;
            const [currentMonthKey, setCurrentMonthKey] = useState(defaultKey);

            /* ── Модалки ── */
            const [showSettings, setShowSettings] = useState(false);

            /* ── Скрытый режим (5 кликов по заголовку) ── */
            const titleClicksRef = useRef(0);
            const titleTimerRef  = useRef(null);
            const handleTitleClick = () => {
                if (!HIDE_UNOFFICIAL_MODE) return;
                titleClicksRef.current++;
                if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
                titleTimerRef.current = setTimeout(() => { titleClicksRef.current = 0; }, 2000);
                if (titleClicksRef.current >= 5) {
                    titleClicksRef.current = 0;
                    setMode(m => m === 'autoselect' ? 'official' : 'autoselect');
                }
            };

            /* ── Обеспечиваем наличие записи для текущего месяца ── */
            const getOrCreateMonth = useCallback((key) => {
                if (months[key]) return months[key];
                const [y, m] = key.split('-').map(Number);
                return {
                    year:  y,
                    month: m,
                    seasonOverride: null,
                    odometerStart:  0,
                    fuelStart:      0,
                    refuels:        [],
                    workdays:       {},
                };
            }, [months]);

            const currentMonthData = getOrCreateMonth(currentMonthKey);

            const updateCurrentMonth = (newData, isUserAction = false) => {
                if (isUserAction) {
                    userChangedMonthRef.current = true;
                }
                setMonths(prev => ({ ...prev, [currentMonthKey]: newData }));
            };

            const updateProfile = (newProfile, isUserAction = false) => {
                if (isUserAction) {
                    userChangedProfileRef.current = true;
                }
                setProfile(newProfile);
            };

            /* ── Персистентность локального кэша ── */
            useEffect(() => {
                localStorage.setItem('expert_app_theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('expert_report_settings', JSON.stringify(settings));
                if (settings.googleScriptUrl) window.GOOGLE_SCRIPT_URL   = settings.googleScriptUrl;
                if (settings.yandexApiKey)    window.YANDEX_MAPS_API_KEY = settings.yandexApiKey;
            }, [settings]);

            /* ── Загрузка данных пользователя из Google Таблицы ── */
            const loadUserData = async (phoneToLoad, pinToLoad) => {
                const phone = normalizePhone(phoneToLoad || userPhone);
                const pin = normalizePin(pinToLoad || userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;

                if (!phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) {
                    isHydratingRef.current = false;
                    return false;
                }

                setCloudStatus('syncing');
                setCloudErrorMsg('');
                setAuthLoading(true);
                try {
                    const res = await callGoogleScript(scriptUrl, 'loadUserData', { userId: phone, pin: pin });

                    // Обработка ошибки неверного ПИНа
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        setCloudStatus('error');
                        setCloudErrorMsg('Неверный ПИН-код');
                        return false;
                    }

                    // Успешный вход
                    localStorage.setItem('expert_app_user_phone', phone);
                    localStorage.setItem('expert_app_user_pin', pin);
                    localStorage.setItem('expert_app_auth_verified', 'true');
                    setUserPhone(phone);
                    setUserPin(pin);
                    setIsAuthVerified(true);
                    setAuthError('');

                    isHydratingRef.current = true;
                    userChangedProfileRef.current = false;
                    userChangedMonthRef.current = false;

                    let loadedProfile = null;
                    let loadedMonths = null;

                    if (res) {
                        if (res.profile) loadedProfile = res.profile;
                        else if (res.data && res.data.profile) loadedProfile = res.data.profile;

                        if (res.months) loadedMonths = res.months;
                        else if (res.data && res.data.months) loadedMonths = res.data.months;
                    }

                    if (loadedProfile && typeof loadedProfile === 'object') {
                        setProfile(prev => ({ ...prev, ...loadedProfile }));
                    }
                    if (loadedMonths && typeof loadedMonths === 'object') {
                        setMonths(prev => ({ ...prev, ...loadedMonths }));
                    }

                    // Если новый пользователь — сразу фиксируем userId и pin на листе Профили
                    if (res && (res.status === 'not_found' || res.isNewUser)) {
                        try {
                            await callGoogleScript(scriptUrl, 'saveProfile', {
                                userId: phone,
                                pin: pin,
                                profile: loadedProfile || profile
                            });
                        } catch (e) {
                            console.warn('Не удалось зафиксировать профиль нового пользователя:', e);
                        }
                    }

                    setCloudStatus('saved');
                    return true;
                } catch (err) {
                    console.error('Ошибка загрузки данных из Google Таблицы:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка загрузки данных');
                    setAuthError('Ошибка подключения к Google Таблице: ' + (err.message || 'повторите попытку'));
                    return false;
                } finally {
                    setAuthLoading(false);
                    setTimeout(() => {
                        isHydratingRef.current = false;
                    }, 500);
                }
            };

            /* ── Первичная инициализация при старте ── */
            useEffect(() => {
                if (isAuthVerified && userPhone && userPin) {
                    loadUserData(userPhone, userPin);
                } else {
                    isHydratingRef.current = false;
                }
            }, []);

            /* ── Вход пользователя по связке Телефон + ПИН ── */
            const handleLogin = async (cleanPhone, cleanPin) => {
                setAuthError('');
                await loadUserData(cleanPhone, cleanPin);
            };

            /* ── Смена пользователя (безопасный сброс) ── */
            const handleSwitchUser = () => {
                if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                localStorage.removeItem('expert_app_user_phone');
                localStorage.removeItem('expert_app_user_pin');
                localStorage.removeItem('expert_app_auth_verified');
                Object.keys(localStorage)
                    .filter(k => k.startsWith('expert_report_'))
                    .forEach(k => localStorage.removeItem(k));
                window.location.reload();
            };

            /* ── Сохранение профиля в Google Таблицу ── */
            const saveProfileCloud = async (customProfile) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) return;

                const dataToSave = customProfile || profile;
                setCloudStatus('syncing');
                setCloudErrorMsg('');
                try {
                    const res = await callGoogleScript(scriptUrl, 'saveProfile', {
                        userId: phone,
                        pin: pin,
                        profile: dataToSave
                    });
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        return;
                    }
                    setCloudStatus('saved');
                } catch (err) {
                    console.error('Ошибка сохранения профиля:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка сохранения профиля');
                }
            };

            /* ── Сохранение месяца в Google Таблицу ── */
            const saveMonthCloud = async (customMonthData, customKey) => {
                const phone = normalizePhone(userPhone);
                const pin = normalizePin(userPin);
                const scriptUrl = settings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                if (!isAuthVerified || !phone || phone.length !== 11 || !pin || pin.length !== 4 || !scriptUrl) return;

                const mData = customMonthData || currentMonthData;
                const mKey = customKey || currentMonthKey;

                const activeSeason = mData.seasonOverride || getSeason(mData.year, mData.month);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const summary = getMonthSummary(mData, activeNorm);

                setCloudStatus('syncing');
                setCloudErrorMsg('');
                try {
                    const res = await callGoogleScript(scriptUrl, 'saveMonth', {
                        userId: phone,
                        pin: pin,
                        yearMonth: mKey,
                        summary: summary,
                        monthData: mData
                    });
                    if (res && (res.status === 'wrong_pin' || res.error === 'wrong_pin')) {
                        setIsAuthVerified(false);
                        localStorage.removeItem('expert_app_auth_verified');
                        setAuthError('Неверный ПИН-код! Этот номер уже зарегистрирован другим пользователем.');
                        return;
                    }
                    setCloudStatus('saved');
                } catch (err) {
                    console.error('Ошибка сохранения месяца:', err);
                    setCloudStatus('error');
                    setCloudErrorMsg(err.message || 'Ошибка сохранения месяца');
                }
            };

            /* ── Debounce автосохранения профиля (1500 мс) ── */
            useEffect(() => {
                localStorage.setItem('expert_report_profile', JSON.stringify(profile));
                if (isHydratingRef.current || !isAuthVerified || !userChangedProfileRef.current || !userPhone || !userPin) {
                    return;
                }
                if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                profileDebounceRef.current = setTimeout(() => {
                    saveProfileCloud(profile);
                }, 1500);

                return () => {
                    if (profileDebounceRef.current) clearTimeout(profileDebounceRef.current);
                };
            }, [profile, isAuthVerified]);

            /* ── Debounce автосохранения месяца (2000 мс) ── */
            useEffect(() => {
                localStorage.setItem('expert_report_months', JSON.stringify(months));
                if (isHydratingRef.current || !isAuthVerified || !userChangedMonthRef.current || !userPhone || !userPin) {
                    return;
                }
                if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                monthDebounceRef.current = setTimeout(() => {
                    saveMonthCloud(currentMonthData, currentMonthKey);
                }, 2000);

                return () => {
                    if (monthDebounceRef.current) clearTimeout(monthDebounceRef.current);
                };
            }, [months, currentMonthKey, isAuthVerified]);

            /* ── Перенос входящих остатков с прошлого месяца ── */
            const applyPrevMonthBalances = useCallback((targetYear, targetMonth, force = false) => {
                const targetKey = `${targetYear}-${String(targetMonth).padStart(2,'0')}`;
                const targetData = getOrCreateMonth(targetKey);

                if (!force && ((Number(targetData.odometerStart) || 0) > 0 || (Number(targetData.fuelStart) || 0) > 0)) {
                    return;
                }

                const prevKey = getPrevMonthKey(targetYear, targetMonth);
                const prevData = months[prevKey];
                if (!prevData) {
                    if (force) alert(`Данные за ${prevKey} не найдены`);
                    return;
                }

                const prevSeason = prevData.seasonOverride || getSeason(prevData.year, prevData.month);
                const prevNorm = prevSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const prevSummary = getMonthSummary(prevData, prevNorm);

                const activeSeason = targetData.seasonOverride || getSeason(targetYear, targetMonth);
                const activeNorm = activeSeason === 'summer'
                    ? (Number(profile.normSummer) || 0)
                    : (Number(profile.normWinter) || 0);

                const recalced = recalcWorkdays(
                    targetData.workdays || {},
                    prevSummary.odometerEnd,
                    prevSummary.fuelEnd,
                    targetData.refuels || [],
                    activeNorm
                );

                const updated = {
                    ...targetData,
                    odometerStart: prevSummary.odometerEnd,
                    fuelStart: prevSummary.fuelEnd,
                    workdays: recalced
                };

                userChangedMonthRef.current = true;
                setMonths(prev => ({ ...prev, [targetKey]: updated }));
                if (force) {
                    alert(`Перенесены остатки из ${prevKey}:\n• Одометр: ${prevSummary.odometerEnd} км\n• Топливо: ${prevSummary.fuelEnd} л`);
                }
            }, [months, profile, getOrCreateMonth]);

            /* ── Автоперенос при выборе месяца с 0 остатками ── */
            useEffect(() => {
                if (isHydratingRef.current || !isAuthVerified) return;
                const mData = currentMonthData;
                if ((Number(mData.odometerStart) || 0) === 0 && (Number(mData.fuelStart) || 0) === 0) {
                    applyPrevMonthBalances(mData.year, mData.month, false);
                }
            }, [currentMonthKey, isHydratingRef.current, isAuthVerified]);

            /* ── Хелпер темы ── */
            const t = makeT(theme);

            /* ── Стили интерфейса ── */
            const appBg = t(
                'bg-[#101112] text-gray-100',
                'bg-[#F0F2F5] text-gray-900',
                'bg-pink-50 text-gray-900',
                'bg-blue-50 text-gray-900',
                'bg-emerald-50 text-gray-900',
                'bg-[#F5F2EE] text-gray-900',
                'bg-[#F4F5F7] text-gray-900'
            );

            const headerBg = t(
                'bg-[#1A1D21] border-[#3A3D42]',
                'bg-white border-gray-200',
                'bg-white border-pink-200',
                'bg-white border-blue-200',
                'bg-white border-emerald-200',
                'bg-[#FDFBF7] border-[#D7CCC8]',
                'bg-white border-gray-200'
            );

            const accentClass = t(
                'text-[#FFB300]','text-amber-800','text-pink-600',
                'text-blue-600','text-emerald-700','text-[#5D4037]','text-[#9A1B24]'
            );

            const tabActive = t(
                'bg-[#FFB300] text-black',
                'bg-amber-600 text-white',
                'bg-pink-500 text-white',
                'bg-blue-600 text-white',
                'bg-emerald-600 text-white',
                'bg-[#6D4C41] text-white',
                'bg-[#C62828] text-white'
            );

            const tabInactive = t(
                'text-gray-400 hover:text-[#FFB300]',
                'text-gray-500 hover:text-amber-700',
                'text-gray-500 hover:text-pink-600',
                'text-gray-500 hover:text-blue-600',
                'text-gray-500 hover:text-emerald-700',
                'text-[#8D6E63] hover:text-[#5D4037]',
                'text-gray-500 hover:text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );

            const modeSwitchBase = 'flex rounded-full border overflow-hidden text-xs font-bold ' + t(
                'border-[#FFB300]/40','border-amber-400','border-pink-400',
                'border-blue-400','border-emerald-400','border-[#A1887F]','border-[#C62828]/40'
            );

            return (
                <div className={`w-full h-full flex flex-col ${appBg}`}>

                    {/* Снегопад */}
                    {theme === 'newyear' && <SnowEffect />}

                    {/* ══ ШАПКА ══ */}
                    <header className={`flex-shrink-0 border-b shadow-sm z-10 ${headerBg}`}>
                        <div className="max-w-4xl mx-auto w-full px-4 py-3 flex items-center justify-between">
                            {/* Заголовок — выровнен по левому краю */}
                            <h1
                                className={`text-lg font-black tracking-tight select-none ${accentClass}`}
                                onClick={handleTitleClick}
                                style={{ cursor: HIDE_UNOFFICIAL_MODE ? 'default' : 'default' }}
                            >
                                Автоотчет
                            </h1>

                            {/* Переключатель режимов */}
                            {!HIDE_UNOFFICIAL_MODE && (
                                <div className={modeSwitchBase}>
                                    <button
                                        onClick={() => setMode('official')}
                                        className={`px-3 py-1.5 min-h-[36px] transition-colors ${mode === 'official' ? tabActive : tabInactive}`}
                                    >
                                        Официальный
                                    </button>
                                    <button
                                        onClick={() => setMode('autoselect')}
                                        className={`px-3 py-1.5 min-h-[36px] transition-colors ${mode === 'autoselect' ? tabActive : tabInactive}`}
                                    >
                                        Автоподбор
                                    </button>
                                </div>
                            )}

                            <div className="flex items-center">
                                {/* Индикатор облачной синхронизации */}
                                <div className="flex items-center gap-1.5 mr-2">
                                    {cloudStatus === 'syncing' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-amber-500 animate-pulse" title="Синхронизация с Google Таблицей">
                                            <IconCloudSync size={16} />
                                            <span className="hidden sm:inline">Сохранение...</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'saved' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-green-500" title="Данные синхронизированы с Google Таблицей">
                                            <IconCloudCheck size={16} />
                                            <span className="hidden sm:inline">Облако ✓</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'error' && (
                                        <span className="flex items-center gap-1 text-xs font-bold text-red-500 cursor-pointer" title={cloudErrorMsg || 'Ошибка облака'} onClick={() => alert(cloudErrorMsg || 'Ошибка синхронизации')}>
                                            <IconAlertTriangle size={16} />
                                            <span className="hidden sm:inline">Ошибка облака</span>
                                        </span>
                                    )}
                                    {cloudStatus === 'idle' && (
                                        <span className="flex items-center gap-1 text-xs font-bold opacity-40" title={userPhone ? `Эксперт: ${userPhone}` : 'Вход не выполнен'}>
                                            <IconCloud size={16} />
                                            <span className="hidden sm:inline">{userPhone ? 'Облако' : 'Офлайн'}</span>
                                        </span>
                                    )}
                                </div>

                                {/* Кнопка настроек */}
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className={`min-h-[48px] min-w-[48px] flex items-center justify-center rounded-lg transition-opacity hover:opacity-80 ${accentClass}`}
                                    aria-label="Настройки"
                                >
                                    <IconSettings size={22} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ══ ВКЛАДКИ (только в официальном режиме) ══ */}
                    {mode === 'official' && (
                        <div className={`flex-shrink-0 border-b ${t('border-[#3A3D42] bg-[#1A1D21]','border-gray-200 bg-white','border-pink-200 bg-white','border-blue-200 bg-white','border-emerald-200 bg-white','border-[#D7CCC8] bg-[#FDFBF7]','border-gray-200 bg-white')}`}>
                            <div className="max-w-4xl mx-auto w-full px-4 flex">
                                <button
                                    onClick={() => setOfficialTab('profile')}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 min-h-[48px] text-sm font-bold border-b-2 transition-colors ${
                                        officialTab === 'profile'
                                            ? `border-current ${accentClass}`
                                            : `border-transparent ${tabInactive}`
                                    }`}
                                >
                                    <IconUser size={16} />
                                    Карточка
                                </button>
                                <button
                                    onClick={() => setOfficialTab('month')}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 min-h-[48px] text-sm font-bold border-b-2 transition-colors ${
                                        officialTab === 'month'
                                            ? `border-current ${accentClass}`
                                            : `border-transparent ${tabInactive}`
                                    }`}
                                >
                                    <IconCalendar size={16} />
                                    {MONTH_NAMES[currentMonthData.month]} {currentMonthData.year}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ══ КОНТЕНТ ══ */}
                    <main className="flex-1 overflow-y-auto hide-scrollbar">
                        <div className="max-w-4xl mx-auto w-full px-4 py-4">
                            {mode === 'official' && officialTab === 'profile' && (
                                <ProfileCard
                                    profile={profile}
                                    onChange={updateProfile}
                                    userPhone={userPhone}
                                    onSaveCloud={() => saveProfileCloud(profile)}
                                    cloudStatus={cloudStatus}
                                    t={t}
                                />
                            )}
                            {mode === 'official' && officialTab === 'month' && (
                                <MonthSetup
                                    monthData={currentMonthData}
                                    profile={profile}
                                    onUpdate={updateCurrentMonth}
                                    allMonths={months}
                                    onUpdateAllMonths={(updater) => {
                                        userChangedMonthRef.current = true;
                                        setMonths(updater);
                                    }}
                                    onPullPrevMonth={(y, m) => applyPrevMonthBalances(y, m, true)}
                                    onSaveMonthCloud={() => saveMonthCloud(currentMonthData, currentMonthKey)}
                                    cloudStatus={cloudStatus}
                                    userPhone={userPhone}
                                    t={t}
                                />
                            )}
                            {mode === 'autoselect' && (
                                <AutoSelectScreen
                                    monthData={currentMonthData}
                                    profile={profile}
                                    t={t}
                                />
                            )}
                        </div>
                    </main>

                    {/* ══ МОДАЛКА АВТОРИЗАЦИИ (ТЕЛЕФОН + ПИН) ══ */}
                    {!isAuthVerified && (
                        <AuthModal
                            initialPhone={userPhone}
                            initialPin={userPin}
                            onLogin={handleLogin}
                            isLoading={authLoading}
                            errorMsg={authError}
                            t={t}
                        />
                    )}

                    {/* ══ МОДАЛКА НАСТРОЕК ══ */}
                    {showSettings && (
                        <SettingsModal
                            theme={theme}
                            onThemeChange={setTheme}
                            settings={settings}
                            onSettingsChange={setSettings}
                            userPhone={userPhone}
                            onSwitchUser={handleSwitchUser}
                            onClose={() => setShowSettings(false)}
                            t={t}
                        />
                    )}
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           12. МОНТИРОВАНИЕ
        ═══════════════════════════════════════════════════ */
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
