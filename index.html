<!DOCTYPE html>
<html lang="ru">
<head>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            500: '#f59e0b', 600: '#d97706', 700: '#b45309',
                            800: '#92400e', 900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel standalone -->

    <!-- ExcelJS -->

    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        #root {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        @keyframes snowfall {
            0%   { transform: translateY(-10vh) translateX(0)    rotate(0deg);   opacity: 0.9; }
            50%  { transform: translateY(50vh)  translateX(15px) rotate(180deg); opacity: 0.6; }
            100% { transform: translateY(105vh) translateX(-15px) rotate(360deg); opacity: 0.1; }
        }
        .snowflake {
            position: fixed;
            top: -5vh;
            color: #ffffff;
            pointer-events: none;
            z-index: 45;
            user-select: none;
            animation: snowfall linear infinite;
        }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        /* ═══════════════════════════════════════════════════
           1. КОНСТАНТЫ
        ═══════════════════════════════════════════════════ */
        const HIDE_UNOFFICIAL_MODE = false;
        const APP_VERSION = '0.1.0';
        const DEFAULT_GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTbFwjYlBPXp7n18cAIX_27z2TpuErD2-6F20J7v59YqaBCWY_8jZYl5KBKo4YV8Y/exec';

        /* ═══════════════════════════════════════════════════
           2. СИСТЕМА 9 ТЕМ
        ═══════════════════════════════════════════════════ */
        const THEME_LIST = [
            { id: 'expert',      label: 'ЭКСПЕРТ' },
            { id: 'expert-dark', label: 'ЭКСПЕРТ НОЧЬ' },
            { id: 'newyear',    label: '🎄 НОВОГОДНЯЯ' },
            { id: 'dark',       label: 'ТЁМНАЯ' },
            { id: 'light',      label: 'СВЕТЛАЯ' },
            { id: 'marine',     label: 'МОРСКАЯ' },
            { id: 'coffee',     label: 'КОФЕЙНАЯ' },
            { id: 'pink',       label: 'РОЗОВАЯ' },
            { id: 'mint',       label: 'МЯТНАЯ' },
        ];

        /* Инициализация темы: читаем expert_app_theme, наследуем от соседних приложений */
        const initTheme = () => {
            const saved = localStorage.getItem('expert_app_theme');
            if (saved) return saved;
            return localStorage.getItem('expert_route_theme')
                || localStorage.getItem('sklad_theme')
                || 'expert';
        };

        /* ═══════════════════════════════════════════════════
           3. ХЕЛПЕР t(...) — дословно из themes_ref.html
        ═══════════════════════════════════════════════════ */
        const makeT = (theme) => (dark, light, pink, marine, mint, coffee, expert) => {
            if (theme === 'newyear') {
                return (dark || light)
                    .replace(/bg-\[#101112\]/g, 'bg-[#0A1912]')
                    .replace(/bg-\[#282B30\]/g, 'bg-[#11261D]')
                    .replace(/bg-\[#1E2125\]/g, 'bg-[#0D1F17]')
                    .replace(/hover:bg-\[#33363B\]/g, 'hover:bg-[#19382B]')
                    .replace(/border-\[#3A3D42\]/g, 'border-[#1E3F30]')
                    .replace(/border-gray-800/g, 'border-[#1A382A]')
                    .replace(/border-gray-700/g, 'border-[#234736]')
                    .replace(/border-\[#444\]/g, 'border-[#234736]')
                    .replace(/bg-\[#FFB300\] text-black/g, 'bg-gradient-to-r from-[#B71C1C] to-[#D32F2F] text-white border border-[#FBBF24]/40')
                    .replace(/hover:bg-\[#FFA000\]/g, 'hover:from-[#9A1B24] hover:to-[#B71C1C]')
                    .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#FBBF24]/20')
                    .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FBBF24]/15')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828] text-white')
                    .replace(/text-\[#FFB300\]/g, 'text-[#FBBF24]')
                    .replace(/border-\[#FFB300\]\/50/g, 'border-[#FBBF24]/50')
                    .replace(/border-\[#FFB300\]/g, 'border-[#FBBF24]')
                    .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#FBBF24]')
                    .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/40');
            }
            if (theme === 'expert') {
                if (expert) return expert;
                return (light || dark)
                    .replace(/bg-gray-100/g, 'bg-[#F4F5F7]')
                    .replace(/bg-amber-(400|500|600|700|800|900|950)/g, 'bg-[#C62828]')
                    .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FCE8E8]')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                    .replace(/hover:bg-amber-(500|600|700|800|900|950)/g, 'hover:bg-[#B71C1C]')
                    .replace(/text-amber-\d+\/(40|50|60|70)/g, 'text-gray-500')
                    .replace(/text-amber-(400|500|600|700|800|900|950)/g, 'text-[#9A1B24]')
                    .replace(/text-\[#FFB300\]/g, 'text-[#9A1B24]')
                    .replace(/border-amber-(500|600|700|800|900|950)/g, 'border-[#C62828]')
                    .replace(/border-\[#FFB300\](\/50)?/g, 'border-[#C62828]')
                    .replace(/focus:ring-amber-\d+/g, 'focus:ring-[#C62828]')
                    .replace(/focus:border-amber-\d+/g, 'focus:border-[#C62828]')
                    .replace(/shadow-amber-\d+\/\d+/g, 'shadow-[#C62828]/30');
            }
            if (theme === 'expert-dark') {
                if (dark && dark.includes('bg-[#FFB300]/15')) return dark;
                return (dark || light)
                    .replace(/bg-\[#FFB300\] text-black/g, 'bg-[#C62828] text-white')
                    .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#C62828]/25')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                    .replace(/hover:bg-\[#FFA000\]/g, 'hover:bg-[#B71C1C]')
                    .replace(/text-\[#FFB300\]/g, 'text-[#FF5252]')
                    .replace(/border-\[#FFB300\]\/50/g, 'border-[#EF4444]/50')
                    .replace(/border-\[#FFB300\]\/30/g, 'border-[#EF4444]/30')
                    .replace(/border-\[#FFB300\]/g, 'border-[#C62828]')
                    .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#EF4444]')
                    .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/30');
            }
            if (theme === 'marine') {
                return (marine || dark)
                    .replace(/bg-blue-50\/50/g, 'bg-[#131D31]')
                    .replace(/bg-blue-50/g, 'bg-[#0B132B]')
                    .replace(/bg-blue-100/g, 'bg-[#162238]')
                    .replace(/bg-blue-200/g, 'bg-[#1E3A5F]')
                    .replace(/bg-white/g, 'bg-[#162032] text-blue-50')
                    .replace(/text-blue-950/g, 'text-blue-50')
                    .replace(/text-blue-900\/60/g, 'text-blue-300/50')
                    .replace(/text-blue-900/g, 'text-blue-100')
                    .replace(/text-blue-800/g, 'text-blue-200')
                    .replace(/text-blue-700/g, 'text-sky-400')
                    .replace(/text-blue-600/g, 'text-sky-400')
                    .replace(/border-blue-200/g, 'border-[#253652]')
                    .replace(/border-blue-300/g, 'border-sky-500/50');
            }
            if (theme === 'coffee') {
                return (coffee || dark)
                    .replace(/bg-\[#F5F2EE\]/g, 'bg-[#16110F]')
                    .replace(/bg-\[#EFEBE9\]/g, 'bg-[#221A17]')
                    .replace(/bg-\[#FDFBF7\]/g, 'bg-[#241C19] text-[#F5EBE6]')
                    .replace(/bg-\[#D7CCC8\]\/60/g, 'bg-[#362924]')
                    .replace(/bg-\[#D7CCC8\]\/40/g, 'bg-[#362924]')
                    .replace(/bg-\[#D7CCC8\]/g, 'bg-[#382B26]')
                    .replace(/bg-white/g, 'bg-[#241C19] text-[#F5EBE6]')
                    .replace(/text-\[#3E2723\]/g, 'text-[#F5EBE6]')
                    .replace(/text-\[#4E342E\]/g, 'text-[#E6D5CC]')
                    .replace(/text-\[#5D4037\]/g, 'text-[#D7B399]')
                    .replace(/text-\[#6D4C41\]\/60/g, 'text-[#A1887F]/60')
                    .replace(/text-\[#6D4C41\]/g, 'text-[#E0B084]')
                    .replace(/text-\[#8D6E63\]/g, 'text-[#D7B399]')
                    .replace(/border-\[#D7CCC8\]/g, 'border-[#3E2F2A]')
                    .replace(/border-\[#A1887F\]/g, 'border-[#6D4C41]');
            }
            if (theme === 'mint')  return mint  || dark;
            if (theme === 'pink')  return pink  || dark;
            if (theme === 'light') return light || dark;
            return dark;
        };

        /* ═══════════════════════════════════════════════════
           4. ВСПОМОГАТЕЛЬНЫЕ ЧИСТЫЕ ФУНКЦИИ
        ═══════════════════════════════════════════════════ */

        /** Количество дней в месяце */
        const daysInMonth = (year, month) => new Date(year, month, 0).getDate();

        /** Автосезон: апрель (4) – октябрь (10) = лето, иначе зима */
        const getSeason = (year, month) =>
            (month >= 4 && month <= 10) ? 'summer' : 'winter';

        /** YYYY-MM-DD → { year, month, day } */
        const parseDate = (s) => {
            const [y, m, d] = s.split('-').map(Number);
            return { year: y, month: m, day: d };
        };

        /** Строка YYYY-MM-DD */
        const toDateStr = (year, month, day) =>
            `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        /** Имя месяца на русском */
        const MONTH_NAMES = [
            '', 'Январь','Февраль','Март','Апрель','Май','Июнь',
            'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
        ];
        const MONTH_NAMES_GEN = [
            '', 'января','февраля','марта','апреля','мая','июня',
            'июля','августа','сентября','октября','ноября','декабря'
        ];

        /** Безопасное чтение значения ячейки ExcelJS (строка, число, richText, формула) */
        const cellValue = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return '';
            const v = cell.value;
            if (typeof v === 'string' || typeof v === 'number') return String(v);
            if (typeof v === 'object') {
                if (v.result !== undefined) return String(v.result); // формула
                if (v.richText)            return v.richText.map(r => r.text).join(''); // richText
                if (v.text !== undefined)  return String(v.text);
            }
            return String(v);
        };

        /** Нормализация номера телефона или логина */
        const normalizePhone = (raw) => {
            if (!raw) return '';
            const s = String(raw).trim();
            const digits = s.replace(/\D/g, '');
            if (digits.length === 11 && (digits.startsWith('7') || digits.startsWith('8'))) {
                return '+7' + digits.slice(1);
            }
            if (digits.length === 10) {
                return '+7' + digits;
            }
            return s;
        };

        /** Получить ключ YYYY-MM предыдущего календарного месяца */
        const getPrevMonthKey = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            const prevYear = m === 1 ? y - 1 : y;
            const prevMonth = m === 1 ? 12 : m - 1;
            return `${prevYear}-${String(prevMonth).padStart(2, '0')}`;
        };

        /** Расчет итогов месяца (одометр, остатки, расход) */
        const getMonthSummary = (monthData, activeNorm) => {
            const odomStart = Number(monthData.odometerStart) || 0;
            const fuelStart = Number(monthData.fuelStart) || 0;
            const workdays = monthData.workdays || {};
            const workdayKeys = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalRefuels = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const norm = Number(activeNorm) || 0;
            const totalFuelUsed = norm > 0 ? (totalKm * norm / 100) : 0;
            const fuelEnd = fuelStart + totalRefuels - totalFuelUsed;

            let odomEnd = odomStart;
            if (workdayKeys.length > 0) {
                const lastKey = workdayKeys[workdayKeys.length - 1];
                odomEnd = Number(workdays[lastKey].odometerEnd) || (odomStart + totalKm);
            } else {
                odomEnd = odomStart;
            }

            return {
                odometerStart: odomStart,
                fuelStart: Number(fuelStart.toFixed(2)),
                odometerEnd: Number(odomEnd.toFixed(2)),
                fuelEnd: Number(fuelEnd.toFixed(2)),
                totalKm: Number(totalKm.toFixed(2)),
                totalFuelUsed: Number(totalFuelUsed.toFixed(2)),
                workdaysCount: workdayKeys.length
            };
        };

        /** Универсальный вызов Google Apps Script Web App (строго text/plain для обхода CORS) */
        const callGoogleScript = async (url, action, payload = {}) => {
            const targetUrl = url || DEFAULT_GOOGLE_SCRIPT_URL;
            const body = JSON.stringify({ action, ...payload });
            const res = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: body
            });
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }
            const data = await res.json();
            return data;
        };

        /** Пересчёт цепочки рабочих дней месяца */
        const recalcWorkdays = (workdays, odometerStart, fuelStart, refuels, activeNorm) => {
            const sortedKeys = Object.keys(workdays).sort();
            const refuelMap = {};
            refuels.forEach(r => {
                if (!refuelMap[r.date]) refuelMap[r.date] = 0;
                refuelMap[r.date] += Number(r.liters) || 0;
            });

            let odom = Number(odometerStart) || 0;
            let fuel = Number(fuelStart)     || 0;
            const updated = {};

            sortedKeys.forEach(dateKey => {
                const day = { ...workdays[dateKey] };
                const refuelToday = refuelMap[dateKey] || 0;
                const km = Number(day.tripKm) || 0;
                const norm = Number(activeNorm) || 0;

                day.odometerStart = odom;
                day.fuelStart     = fuel + refuelToday;  // заправка учитывается утром дня
                day.odometerEnd   = odom + km;
                day.fuelEnd       = day.fuelStart - (norm > 0 ? (km * norm / 100) : 0);

                if (day.isWorkday) {
                    odom = day.odometerEnd;
                    fuel = day.fuelEnd;
                } else {
                    // В нерабочий день одометр и остаток не меняются,
                    // но заправка в такой день всё равно делает день рабочим (обработано снаружи)
                    fuel = fuel + refuelToday;
                }
                updated[dateKey] = day;
            });
            return updated;
        };

        /* ═══════════════════════════════════════════════════
           5. ИНЛАЙН SVG-ИКОНКИ
        ═══════════════════════════════════════════════════ */
        const IconSettings = ({ size = 20, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>

            </svg>
        );

        const IconUser = ({ size = 20, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>

        );

        const IconCalendar = ({ size = 20, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8"  y1="2" x2="8"  y2="6"/>
                <line x1="3"  y1="10" x2="21" y2="10"/>

        );

        const IconUpload = ({ size = 18, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>

                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>

        const IconDownload = ({ size = 18, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>
                <polyline points="8 17 12 21 16 17"/>

                <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/>

        );

        const IconPlus = ({ size = 18, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5"  y1="12" x2="19" y2="12"/>

        const IconTrash = ({ size = 16, className = '' }) => (

                <circle cx="12" cy="12" r="10"/>

        const IconAlertTriangle = ({ size = 16, className = '' }) => (

                 strokeLinejoin="round" className={className}>

                <line x1="12" y1="9" x2="12" y2="13"/>

        const IconRefresh = ({ size = 16, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>

        /* ═══════════════════════════════════════════════════
           8. КОМПОНЕНТ: НАСТРОЙКА МЕСЯЦА + РАБОЧИЕ ДНИ
        ═══════════════════════════════════════════════════ */
        const MonthSetup = ({ monthData, profile, onUpdate, allMonths, onPullPrevMonth, onSaveMonthCloud, cloudStatus, userPhone, t }) => {

            const year  = monthData.year;
            const month = monthData.month;
            const totalDays = daysInMonth(year, month);
            const prevKey = getPrevMonthKey(year, month);
            const [pYear, pMonth] = prevKey.split('-').map(Number);
            const prevMonthName = `${MONTH_NAMES[pMonth]} ${pYear}`;

            /* ---- Автосезон ---- */
            const autoSeason  = getSeason(year, month);
            const activeSeason = monthData.seasonOverride || autoSeason;
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            /* ---- Вспомогалки обновления состояния ---- */
            const update = (patch) => onUpdate({ ...monthData, ...patch }, true);

            const updateWorkdays = (newWd) => {
                const recalced = recalcWorkdays(
                    newWd,
                    monthData.odometerStart,
                    monthData.fuelStart,
                    monthData.refuels,
                    activeNorm
                );
                update({ workdays: recalced });
            };

            /* ---- Обеспечение наличия workdays для всех дней месяца ---- */
            const ensureWorkdays = () => {
                const wd = { ...(monthData.workdays || {}) };
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (!wd[key]) {
                        wd[key] = {
                            isWorkday:     false,
                            tripKm:        0,
                            odometerStart: 0,
                            odometerEnd:   0,
                            fuelStart:     0,
                            fuelEnd:       0,
                            trips:         [],
                        };
                    }
                }
                return wd;
            };

            /* ---- Переключение рабочего дня ---- */
            const toggleWorkday = (dateKey) => {
                const wd = ensureWorkdays();
                // Нельзя снять флаг если в этот день есть заправка
                const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                if (hasRefuel && wd[dateKey].isWorkday) return; // заправочный день всегда рабочий
                wd[dateKey] = { ...wd[dateKey], isWorkday: !wd[dateKey].isWorkday };
                updateWorkdays(wd);
            };

            /* ---- Изменение пробега дня ---- */
            const setDayKm = (dateKey, km) => {
                const wd = ensureWorkdays();
                wd[dateKey] = { ...wd[dateKey], tripKm: Number(km) || 0 };
                updateWorkdays(wd);
            };

            /* ---- Таблица заправок ---- */
            const addRefuel = () => {
                const refuels = [...(monthData.refuels || [])];
                // День по умолчанию — 1-е число
                const defaultDate = toDateStr(year, month, 1);
                refuels.push({ date: defaultDate, liters: 0 });
                // Автоматически делаем день рабочим
                const wd = ensureWorkdays();
                wd[defaultDate] = { ...wd[defaultDate], isWorkday: true };
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const removeRefuel = (idx) => {
                const refuels = (monthData.refuels || []).filter((_, i) => i !== idx);
                const wd = ensureWorkdays();
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const updateRefuel = (idx, field, val) => {
                const refuels = (monthData.refuels || []).map((r, i) => {
                    if (i !== idx) return r;
                    const updated = { ...r, [field]: val };
                    return updated;
                });
                // Если поменялась дата — проверяем автоматическое рабочий день
                const wd = ensureWorkdays();
                refuels.forEach(r => { if (r.date) wd[r.date] = { ...wd[r.date], isWorkday: true }; });
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            /* ---- Импорт поездок из JSON/CSV ---- */
            const handleImportRoutes = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        let routeData = {};
                        if (file.name.endsWith('.json')) {
                            routeData = JSON.parse(ev.target.result);
                        } else {
                            // CSV: ожидаем колонки date,order,address,time,taskType
                            const lines = ev.target.result.split('\n').map(l => l.trim()).filter(Boolean);
                            const headers = lines[0].split(',').map(h => h.trim());
                            lines.slice(1).forEach(line => {
                                const cols = line.split(',').map(c => c.trim());
                                const row  = {};
                                headers.forEach((h, i) => { row[h] = cols[i] || ''; });
                                const date = row.date;
                                if (!date) return;
                                if (!routeData[date]) routeData[date] = { points: [] };
                                routeData[date].points.push({
                                    order:    Number(row.order) || 0,
                                    address:  row.address  || '',
                                    time:     row.time     || '',
                                    taskType: row.taskType || '',
                                });
                            });
                        }

                        const wd = ensureWorkdays();
                        Object.entries(routeData).forEach(([dateKey, dayData]) => {
                            if (!wd[dateKey]) return; // дата не принадлежит выбранному месяцу
                            const points = Array.isArray(dayData.points) ? dayData.points : [];
                            wd[dateKey] = {
                                ...wd[dateKey],
                                isWorkday: true,
                                trips: points,
                            };
                        });
                        updateWorkdays(wd);
                        alert(`Маршруты загружены: ${Object.keys(routeData).length} дн.`);
                    } catch (err) {
                        alert('Ошибка разбора файла: ' + err.message);
                    }
                };
                reader.readAsText(file, 'utf-8');
                e.target.value = '';
            };

            /* ---- Подтянуть из истории браузера ---- */
            const pullFromHistory = () => {
                try {
                    const raw = localStorage.getItem('expert_app_route_history_v1');
                    if (!raw) { alert('История маршрутов не найдена в браузере'); return; }
                    const history = JSON.parse(raw);
                    const prefix  = `${year}-${String(month).padStart(2,'0')}-`;
                    const wd = ensureWorkdays();
                    let count = 0;
                    Object.entries(history).forEach(([dateKey, dayData]) => {
                        if (!dateKey.startsWith(prefix)) return;
                        if (!wd[dateKey]) return;
                        const points = Array.isArray(dayData.points) ? dayData.points : [];
                        wd[dateKey] = { ...wd[dateKey], isWorkday: true, trips: points };
                        count++;
                    });
                    if (count === 0) { alert('Нет маршрутов за выбранный месяц в истории браузера'); return; }
                    updateWorkdays(wd);
                    alert(`Подтянуто ${count} дн. из истории браузера`);
                } catch (err) {
                    alert('Ошибка чтения истории: ' + err.message);
                }
            };

            /* ---- Импорт входящих данных из прошлого отчёта ---- */
            const handleImportPrevMonth = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const buf = await file.arrayBuffer();
                    const wb  = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);
                    // Лист «Расчет» — ищем конечные значения
                    const ws = wb.getWorksheet('Расчет') || wb.getWorksheet('Расчёт');
                    if (!ws) { alert('Лист «Расчет» не найден в файле'); return; }
                    // Предполагаем конечный одометр в B4, конечный остаток в B5 (уточним при Э2)
                    const odom = Number(cellValue(ws.getCell('B4'))) || 0;
                    const fuel = Number(cellValue(ws.getCell('B5'))) || 0;
                    const wd = recalcWorkdays(ensureWorkdays(), odom, fuel, monthData.refuels || [], activeNorm);
                    update({ odometerStart: odom, fuelStart: fuel, workdays: wd });
                    alert(`Загружено: одометр ${odom} км, остаток ${fuel.toFixed(1)} л`);
                } catch (err) {
                    alert('Ошибка чтения файла: ' + err.message);
                }
                e.target.value = '';
            };

            /* ---- Общая статистика ---- */
            const workdays      = monthData.workdays || {};
            const workdayKeys   = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm       = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalFuelUsed = activeNorm > 0 ? (totalKm * activeNorm / 100) : 0;
            const totalRefuels  = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const fuelEnd       = (Number(monthData.fuelStart) || 0) + totalRefuels - totalFuelUsed;

            /* ---- Дни месяца для таблицы ---- */
            const allDayKeys = Array.from({ length: totalDays }, (_, i) =>
                toDateStr(year, month, i + 1)
            );

            /* ---- Классы полей ---- */
            const inputSm = t(
                'bg-[#1E2125] border-gray-700 text-white',
                'bg-white border-gray-300 text-gray-900',
                'bg-pink-50 border-pink-200 text-pink-900',
                'bg-blue-50 border-blue-200 text-blue-900',
                'bg-emerald-50 border-emerald-200 text-emerald-900',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723]',
                'bg-white border-gray-300 text-gray-900'
            );

            const cardClass = t(
                'bg-[#1E2125] border-[#3A3D42]',

                'bg-gray-50 border-gray-200'
            );

            const accentClass = t(
                'text-[#FFB300]',
                'text-amber-700',
                'text-pink-600',
                'text-blue-600',
                'text-emerald-700',
                'text-[#5D4037]',
                'text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'

            return (
                <div className="w-full space-y-4 animate-fade-in">

                    {/* ── Выбор месяца и года ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <div className="flex items-center justify-between mb-2">
                            <p className={`text-xs font-bold ${accentClass}`}>МЕСЯЦ ОТЧЁТА</p>
                            <button
                                type="button"
                                onClick={onSaveMonthCloud}
                                disabled={!userPhone || cloudStatus === 'syncing'}
                                className={`min-h-[36px] px-3 py-1 rounded text-xs font-bold flex items-center gap-1.5 transition-all ${
                                    !userPhone ? 'opacity-40 cursor-not-allowed bg-gray-600 text-white' : btnPrimary
                                }`}
                            >
                                <IconCloud size={14} />
                                <span>{cloudStatus === 'syncing' ? 'Сохранение...' : 'Сохранить месяц в таблицу'}</span>
                            </button>
                        </div>
                        <div className="flex gap-2">
                            <select
                                className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                value={month}

                                    const m = Number(e.target.value);

                                    update({ month: m, seasonOverride: override });

                            >

                            <select

                                {[2024, 2025, 2026, 2027, 2028].map(y => (

                                ))}

                        {/* Сезонная норма */}
                        <div className="flex items-center gap-3 mt-3">

                            <button

                                <input

                                'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'

                                <IconUpload size={14} />
                                <span>Импорт из отчёта прошлого месяца (.xlsx)</span>
                                <input type="file" accept=".xlsx" onChange={handleImportPrevMonth} className="hidden" />
                            </label>
                        </div>
                    </div>

                    {/* ── Таблица заправок ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <div className="flex items-center justify-between mb-2">
                            <p className={`text-xs font-bold ${accentClass}`}>
                                ЗАПРАВКИ <span className="font-normal opacity-60">— день с заправкой становится рабочим</span>
                            </p>
                            <button
                                onClick={addRefuel}
                                className={`min-h-[32px] px-3 py-1 rounded text-xs font-bold flex items-center gap-1 ${btnPrimary}`}
                            >
                                <IconPlus size={14} /> Добавить
                            </button>
                        </div>

                        {(monthData.refuels || []).length === 0 ? (
                            <p className="text-xs opacity-40 text-center py-2">Заправок нет</p>
                        ) : (
                            <div className="space-y-2">
                                {(monthData.refuels || []).map((r, idx) => (
                                    <div key={idx} className="flex items-center gap-2">
                                        {/* Дата — выпадающий список с числами месяца */}
                                        <select
                                            className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                            value={parseDate(r.date || toDateStr(year, month, 1)).day}
                                            onChange={e => {
                                                const day = Number(e.target.value);
                                                updateRefuel(idx, 'date', toDateStr(year, month, day));
                                            }}
                                        >
                                            {Array.from({ length: totalDays }, (_, i) => i + 1).map(d => (
                                                <option key={d} value={d}>{d} {MONTH_NAMES_GEN[month]}</option>
                                            ))}
                                        </select>
                                        {/* Литры */}
                                        <input
                                            type="number"
                                            inputMode="decimal"
                                            className={`w-24 p-2 text-[16px] sm:text-sm rounded border text-center ${inputSm}`}
                                            placeholder="л"
                                            value={r.liters || ''}
                                            onChange={e => updateRefuel(idx, 'liters', Number(e.target.value) || 0)}
                                        />
                                        <span className="text-xs opacity-50">л</span>
                                        <button
                                            onClick={() => removeRefuel(idx)}
                                            className="p-2 min-h-[36px] rounded text-red-400 hover:text-red-600"
                                        >
                                            <IconTrash size={16} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                        <div className="mt-2 text-right text-xs opacity-60">
                            Итого заправлено: <strong>{totalRefuels.toFixed(1)} л</strong>
                        </div>
                    </div>

                    {/* ── Импорт маршрутов ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-2 ${accentClass}`}>ИМПОРТ МАРШРУТОВ</p>
                        <div className="flex flex-col gap-2">
                            <label className={`min-h-[48px] p-2 rounded border border-dashed flex items-center justify-center gap-2 cursor-pointer text-xs font-bold ${t(
                                'border-[#FFB300]/30 text-[#FFB300]/70 hover:bg-[#282B30]',
                                'border-amber-300 text-amber-700 hover:bg-amber-50',
                                'border-pink-300 text-pink-600 hover:bg-pink-50',
                                'border-blue-300 text-blue-600 hover:bg-blue-50',
                                'border-emerald-300 text-emerald-700 hover:bg-emerald-50',
                                'border-[#A1887F] text-[#6D4C41] hover:bg-[#EFEBE9]',
                                'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'
                            )}`}>
                                <IconUpload size={14} />
                                <span>Загрузить routes_{year}-{String(month).padStart(2,'0')}.json / .csv</span>
                                <input type="file" accept=".json,.csv" onChange={handleImportRoutes} className="hidden" />
                            </label>
                            <button
                                onClick={pullFromHistory}
                                className={`min-h-[48px] p-2 rounded border border-dashed flex items-center justify-center gap-2 text-xs font-bold w-full ${t(
                                    'border-[#FFB300]/30 text-[#FFB300]/70 hover:bg-[#282B30]',
                                    'border-amber-300 text-amber-700 hover:bg-amber-50',
                                    'border-pink-300 text-pink-600 hover:bg-pink-50',
                                    'border-blue-300 text-blue-600 hover:bg-blue-50',
                                    'border-emerald-300 text-emerald-700 hover:bg-emerald-50',
                                    'border-[#A1887F] text-[#6D4C41] hover:bg-[#EFEBE9]',
                                    'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'
                                )}`}
                            >
                                <IconHistory size={14} />
                                <span>Подтянуть из истории браузера (только чтение)</span>
                            </button>
                        </div>
                    </div>

                    {/* ── Таблица рабочих дней ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-2 ${accentClass}`}>
                            РАБОЧИЕ ДНИ — {MONTH_NAMES[month]} {year}
                        </p>
                        <p className="text-xs opacity-50 mb-3">
                            1-е число может не быть рабочим. Входящие данные переходят на первый рабочий день.
                        </p>

                        {/* Шапка таблицы */}
                        <div className="grid gap-1 mb-1" style={{ gridTemplateColumns: '40px 1fr 80px 80px 80px 80px' }}>
                            {['День', 'Маршрут', 'Пробег (км)', 'Одометр', 'Остаток л', 'Расход л'].map(h => (
                                <div key={h} className="text-[10px] font-bold opacity-50 text-center">{h}</div>
                            ))}
                        </div>

                        <div className="space-y-1">
                            {allDayKeys.map(dateKey => {
                                const day = workdays[dateKey] || {
                                    isWorkday: false, tripKm: 0,
                                    odometerStart: 0, odometerEnd: 0,
                                    fuelStart: 0, fuelEnd: 0, trips: []
                                };
                                const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                                const { day: d } = parseDate(dateKey);
                                const km   = Number(day.tripKm) || 0;
                                const norm = activeNorm;
                                const fuelSpent = norm > 0 ? (km * norm / 100) : 0;
                                const tripCount = (day.trips || []).length;

                                return (
                                    <div
                                        key={dateKey}
                                        className={`grid gap-1 rounded p-1 transition-colors ${
                                            day.isWorkday
                                                ? t('bg-[#FFB300]/10', 'bg-amber-50', 'bg-pink-50', 'bg-blue-50', 'bg-emerald-50', 'bg-[#EFEBE9]', 'bg-red-50')
                                                : 'opacity-50'
                                        }`}
                                        style={{ gridTemplateColumns: '40px 1fr 80px 80px 80px 80px' }}
                                    >
                                        {/* День + тоггл */}
                                        <button
                                            onClick={() => toggleWorkday(dateKey)}
                                            className={`w-9 h-9 min-h-[36px] rounded flex items-center justify-center text-sm font-black border transition-colors ${

        /* ═══════════════════════════════════════════════════
           9. КОМПОНЕНТ: ЭКРАН АВТОПОДБОРА
        ═══════════════════════════════════════════════════ */
        const AutoSelectScreen = ({ monthData, profile, t }) => {
            const year  = monthData.year;
            const month = monthData.month;
            const activeSeason = monthData.seasonOverride || getSeason(year, month);
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            const [targetFuel, setTargetFuel] = useState('');

            const fuelStart    = Number(monthData.fuelStart) || 0;
            const totalRefuels = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const workdays     = monthData.workdays || {};
            const workdayKeys  = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const kmFromRoutes = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);

            const target         = Number(targetFuel) || 0;
            const requiredFuel   = fuelStart + totalRefuels - target;
            const requiredKm     = activeNorm > 0 ? (requiredFuel / activeNorm * 100) : 0;
            const missingKm      = Math.max(0, requiredKm - kmFromRoutes);

            const accentClass = t(

                'bg-white border-gray-300 text-gray-900',
                'bg-pink-50 border-pink-200 text-pink-900',
                'bg-blue-50 border-blue-200 text-blue-900',
                'bg-emerald-50 border-emerald-200 text-emerald-900',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723]',
                'bg-white border-gray-300 text-gray-900'
            );

            return (
                <div className="max-w-3xl mx-auto w-full space-y-4 animate-fade-in">
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-1 ${accentClass}`}>АВТОПОДБОР ПРОБЕГА</p>
                        <p className="text-xs opacity-50 mb-3">
                            Введите целевой остаток топлива на конец месяца — система рассчитает нужный пробег.
                        </p>

                        <div className="mb-3">
                            <label className="block text-xs opacity-60 mb-1">Целевой остаток на конец месяца (л)</label>
                            <input
                                type="number"
                                inputMode="decimal"
                                className={`w-full p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}

                        <div className="space-y-2 text-sm">
                            <div className="flex justify-between">
                                <span className="opacity-60">Начальный остаток:</span>
                                <span className="font-mono font-bold">{fuelStart.toFixed(1)} л</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="opacity-60">Сумма заправок:</span>
                                <span className="font-mono font-bold">+{totalRefuels.toFixed(1)} л</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="opacity-60">Целевой остаток:</span>
                                <span className="font-mono font-bold">−{target.toFixed(1)} л</span>
                            </div>
                            <div className={`flex justify-between font-bold pt-1 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>

                                <span className={`font-mono ${accentClass}`}>{requiredFuel.toFixed(1)} л</span>
                            </div>
                            <div className={`flex justify-between font-bold ${accentClass}`}>
                                <span>Требуемый пробег:</span>
                                <span className="font-mono">{requiredKm.toFixed(1)} км</span>
                            </div>
                            <div className="flex justify-between opacity-70">
                                <span>Пробег из маршрутов:</span>
                                <span className="font-mono">{kmFromRoutes.toFixed(1)} км</span>
                            </div>
                            <div className={`flex justify-between font-bold pt-1 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                                <span className={missingKm > 0 ? 'text-orange-500' : 'text-green-500'}>
                                    {missingKm > 0 ? '⚠ Недостающий пробег:' : '✓ Маршрутов достаточно:'}
                                </span>
                                <span className={`font-mono ${missingKm > 0 ? 'text-orange-500' : 'text-green-500'}`}>
                                    {missingKm > 0 ? `${missingKm.toFixed(1)} км` : '0 км'}

                            </div>
                        </div>
                    </div>

                    {/* Выбор дней */}

                                        >
                                            {d}

                        </div>

                    {/* Заглушки кнопок Этапа 2 */}
                    <button
                        disabled

            const handlePing = async () => {
                setPingStatus('loading');
                setPingMsg('');
                try {
                    const url = localSettings.googleScriptUrl || DEFAULT_GOOGLE_SCRIPT_URL;
                    const res = await callGoogleScript(url, 'ping');
                    setPingStatus('success');
                    setPingMsg(res && res.message ? `Подключено: ${res.message}` : 'Подключено ✓');
                } catch (err) {

            const save = () => {

            const cardClass = t(
                'bg-[#282B30] border-[#FFB300]',

                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',

            const rowClass = t(

                'bg-blue-50 border-blue-200',

        /* ═══════════════════════════════════════════════════
           11. КОРНЕВОЙ КОМПОНЕНТ App
        ═══════════════════════════════════════════════════ */
        const App = () => {

            /* ── Тема ── */
            const [theme, setTheme] = useState(initTheme);

            /* ── Идентификатор эксперта (телефон / логин) ── */

            /* ── Режим (официальный / автоподбор) ── */
