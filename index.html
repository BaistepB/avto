<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Автоотчет</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            500: '#f59e0b', 600: '#d97706', 700: '#b45309',
                            800: '#92400e', 900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ExcelJS -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #root {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        @keyframes snowfall {
            0%   { transform: translateY(-10vh) translateX(0)    rotate(0deg);   opacity: 0.9; }
            50%  { transform: translateY(50vh)  translateX(15px) rotate(180deg); opacity: 0.6; }
            100% { transform: translateY(105vh) translateX(-15px) rotate(360deg); opacity: 0.1; }
        }
        .snowflake {
            position: fixed;
            top: -5vh;
            color: #ffffff;
            pointer-events: none;
            z-index: 45;
            user-select: none;
            animation: snowfall linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        /* ═══════════════════════════════════════════════════
           1. КОНСТАНТЫ
        ═══════════════════════════════════════════════════ */
        const HIDE_UNOFFICIAL_MODE = false;
        const APP_VERSION = '0.1.0';
        const DEFAULT_GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTbFwjYlBPXp7n18cAIX_27z2TpuErD2-6F20J7v59YqaBCWY_8jZYl5KBKo4YV8Y/exec';

        /* ═══════════════════════════════════════════════════
           2. СИСТЕМА 9 ТЕМ
        ═══════════════════════════════════════════════════ */
        const THEME_LIST = [
            { id: 'expert',      label: 'ЭКСПЕРТ' },
            { id: 'expert-dark', label: 'ЭКСПЕРТ НОЧЬ' },
            { id: 'newyear',    label: '🎄 НОВОГОДНЯЯ' },
            { id: 'dark',       label: 'ТЁМНАЯ' },
            { id: 'light',      label: 'СВЕТЛАЯ' },
            { id: 'marine',     label: 'МОРСКАЯ' },
            { id: 'coffee',     label: 'КОФЕЙНАЯ' },
            { id: 'pink',       label: 'РОЗОВАЯ' },
            { id: 'mint',       label: 'МЯТНАЯ' },
        ];

        /* Инициализация темы: читаем expert_app_theme, наследуем от соседних приложений */
        const initTheme = () => {
            const saved = localStorage.getItem('expert_app_theme');
            if (saved) return saved;
            return localStorage.getItem('expert_route_theme')
                || localStorage.getItem('sklad_theme')
                || 'expert';
        };

        /* ═══════════════════════════════════════════════════
           3. ХЕЛПЕР t(...) — дословно из themes_ref.html
        ═══════════════════════════════════════════════════ */
        const makeT = (theme) => (dark, light, pink, marine, mint, coffee, expert) => {
            if (theme === 'newyear') {
                return (dark || light)
                    .replace(/bg-\[#101112\]/g, 'bg-[#0A1912]')
                    .replace(/bg-\[#282B30\]/g, 'bg-[#11261D]')
                    .replace(/bg-\[#1E2125\]/g, 'bg-[#0D1F17]')
                    .replace(/hover:bg-\[#33363B\]/g, 'hover:bg-[#19382B]')
                    .replace(/border-\[#3A3D42\]/g, 'border-[#1E3F30]')
                    .replace(/border-gray-800/g, 'border-[#1A382A]')
                    .replace(/border-gray-700/g, 'border-[#234736]')
                    .replace(/border-\[#444\]/g, 'border-[#234736]')
                    .replace(/bg-\[#FFB300\] text-black/g, 'bg-gradient-to-r from-[#B71C1C] to-[#D32F2F] text-white border border-[#FBBF24]/40')
                    .replace(/hover:bg-\[#FFA000\]/g, 'hover:from-[#9A1B24] hover:to-[#B71C1C]')
                    .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#FBBF24]/20')
                    .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FBBF24]/15')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828] text-white')
                    .replace(/text-\[#FFB300\]/g, 'text-[#FBBF24]')
                    .replace(/border-\[#FFB300\]\/50/g, 'border-[#FBBF24]/50')
                    .replace(/border-\[#FFB300\]/g, 'border-[#FBBF24]')
                    .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#FBBF24]')
                    .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/40');
            }
            if (theme === 'expert') {
                if (expert) return expert;
                return (light || dark)
                    .replace(/bg-gray-100/g, 'bg-[#F4F5F7]')
                    .replace(/bg-amber-(400|500|600|700|800|900|950)/g, 'bg-[#C62828]')
                    .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FCE8E8]')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                    .replace(/hover:bg-amber-(500|600|700|800|900|950)/g, 'hover:bg-[#B71C1C]')
                    .replace(/text-amber-\d+\/(40|50|60|70)/g, 'text-gray-500')
                    .replace(/text-amber-(400|500|600|700|800|900|950)/g, 'text-[#9A1B24]')
                    .replace(/text-\[#FFB300\]/g, 'text-[#9A1B24]')
                    .replace(/border-amber-(500|600|700|800|900|950)/g, 'border-[#C62828]')
                    .replace(/border-\[#FFB300\](\/50)?/g, 'border-[#C62828]')
                    .replace(/focus:ring-amber-\d+/g, 'focus:ring-[#C62828]')
                    .replace(/focus:border-amber-\d+/g, 'focus:border-[#C62828]')
                    .replace(/shadow-amber-\d+\/\d+/g, 'shadow-[#C62828]/30');
            }
            if (theme === 'expert-dark') {
                if (dark && dark.includes('bg-[#FFB300]/15')) return dark;
                return (dark || light)
                    .replace(/bg-\[#FFB300\] text-black/g, 'bg-[#C62828] text-white')
                    .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#C62828]/25')
                    .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
                    .replace(/hover:bg-\[#FFA000\]/g, 'hover:bg-[#B71C1C]')
                    .replace(/text-\[#FFB300\]/g, 'text-[#FF5252]')
                    .replace(/border-\[#FFB300\]\/50/g, 'border-[#EF4444]/50')
                    .replace(/border-\[#FFB300\]\/30/g, 'border-[#EF4444]/30')
                    .replace(/border-\[#FFB300\]/g, 'border-[#C62828]')
                    .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#EF4444]')
                    .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/30');
            }
            if (theme === 'marine') {
                return (marine || dark)
                    .replace(/bg-blue-50\/50/g, 'bg-[#131D31]')
                    .replace(/bg-blue-50/g, 'bg-[#0B132B]')
                    .replace(/bg-blue-100/g, 'bg-[#162238]')
                    .replace(/bg-blue-200/g, 'bg-[#1E3A5F]')
                    .replace(/bg-white/g, 'bg-[#162032] text-blue-50')
                    .replace(/text-blue-950/g, 'text-blue-50')
                    .replace(/text-blue-900\/60/g, 'text-blue-300/50')
                    .replace(/text-blue-900/g, 'text-blue-100')
                    .replace(/text-blue-800/g, 'text-blue-200')
                    .replace(/text-blue-700/g, 'text-sky-400')
                    .replace(/text-blue-600/g, 'text-sky-400')
                    .replace(/border-blue-200/g, 'border-[#253652]')
                    .replace(/border-blue-300/g, 'border-sky-500/50');
            }
            if (theme === 'coffee') {
                return (coffee || dark)
                    .replace(/bg-\[#F5F2EE\]/g, 'bg-[#16110F]')
                    .replace(/bg-\[#EFEBE9\]/g, 'bg-[#221A17]')
                    .replace(/bg-\[#FDFBF7\]/g, 'bg-[#241C19] text-[#F5EBE6]')
                    .replace(/bg-\[#D7CCC8\]\/60/g, 'bg-[#362924]')
                    .replace(/bg-\[#D7CCC8\]\/40/g, 'bg-[#362924]')
                    .replace(/bg-\[#D7CCC8\]/g, 'bg-[#382B26]')
                    .replace(/bg-white/g, 'bg-[#241C19] text-[#F5EBE6]')
                    .replace(/text-\[#3E2723\]/g, 'text-[#F5EBE6]')
                    .replace(/text-\[#4E342E\]/g, 'text-[#E6D5CC]')
                    .replace(/text-\[#5D4037\]/g, 'text-[#D7B399]')
                    .replace(/text-\[#6D4C41\]\/60/g, 'text-[#A1887F]/60')
                    .replace(/text-\[#6D4C41\]/g, 'text-[#E0B084]')
                    .replace(/text-\[#8D6E63\]/g, 'text-[#D7B399]')
                    .replace(/border-\[#D7CCC8\]/g, 'border-[#3E2F2A]')
                    .replace(/border-\[#A1887F\]/g, 'border-[#6D4C41]');
            }
            if (theme === 'mint')  return mint  || dark;
            if (theme === 'pink')  return pink  || dark;
            if (theme === 'light') return light || dark;
            return dark;
        };

        /* ═══════════════════════════════════════════════════
           4. ВСПОМОГАТЕЛЬНЫЕ ЧИСТЫЕ ФУНКЦИИ
        ═══════════════════════════════════════════════════ */

        /** Количество дней в месяце */
        const daysInMonth = (year, month) => new Date(year, month, 0).getDate();

        /** Автосезон: апрель (4) – октябрь (10) = лето, иначе зима */
        const getSeason = (year, month) =>
            (month >= 4 && month <= 10) ? 'summer' : 'winter';

        /** YYYY-MM-DD → { year, month, day } */
        const parseDate = (s) => {
            const [y, m, d] = s.split('-').map(Number);
            return { year: y, month: m, day: d };
        };

        /** Строка YYYY-MM-DD */
        const toDateStr = (year, month, day) =>
            `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        /** Имя месяца на русском */
        const MONTH_NAMES = [
            '', 'Январь','Февраль','Март','Апрель','Май','Июнь',
            'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
        ];
        const MONTH_NAMES_GEN = [
            '', 'января','февраля','марта','апреля','мая','июня',
            'июля','августа','сентября','октября','ноября','декабря'
        ];

        /** Безопасное чтение значения ячейки ExcelJS (строка, число, richText, формула) */
        const cellValue = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return '';
            const v = cell.value;
            if (typeof v === 'string' || typeof v === 'number') return String(v);
            if (typeof v === 'object') {
                if (v.result !== undefined) return String(v.result); // формула
                if (v.richText)            return v.richText.map(r => r.text).join(''); // richText
                if (v.text !== undefined)  return String(v.text);
            }
            return String(v);
        };

        /** Универсальное извлечение числового значения из ячейки ExcelJS */
        const extractNumericCell = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return null;
            let raw = cell.value;
            if (raw && typeof raw === 'object' && 'result' in raw) {
                raw = raw.result;
            } else if (raw && typeof raw === 'object' && 'richText' in raw && Array.isArray(raw.richText)) {
                raw = raw.richText.map(r => r.text).join('');
            }
            if (typeof raw === 'number') {
                return Number.isFinite(raw) ? raw : null;
            }
            if (typeof raw === 'string') {
                const cleaned = raw.replace(/[\s\u00A0]/g, '').replace(',', '.');
                if (!cleaned) return null;
                const num = Number(cleaned);
                return Number.isFinite(num) ? num : null;
            }
            return null;
        };

        /** Форматирование значения топлива строго с 3 знаками после запятой (0.000) */
        const formatFuel = (val) => {
            if (val === null || val === undefined || val === '') return '0.000';
            const num = Number(val);
            return Number.isFinite(num) ? num.toFixed(3) : '0.000';
        };

        /** Парсинг введенного значения топлива (поддерживает пробелы, запятую и точку, округляет до 3 знаков) */
        const parseFuelInput = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            const cleaned = String(val).replace(/[\s\u00A0]/g, '').replace(',', '.');
            const num = Number(cleaned);
            return Number.isFinite(num) ? Number(num.toFixed(3)) : 0;
        };

        /** Разбор одной строки CSV с поддержкой кавычек "..." (экранированные кавычки, запятые и точки с запятой внутри) */
        const parseCsvLine = (line, delimiter) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === delimiter && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(val => {
                let s = val.trim();
                if (s.startsWith('"') && s.endsWith('"') && s.length >= 2) {
                    s = s.slice(1, -1).replace(/""/g, '"').trim();
                }
                return s;
            });
        };

        /** Нормализация заголовка колонки CSV (русские и английские варианты) */
        const normalizeHeader = (h) => {
            const raw = (h || '').trim().toLowerCase().replace(/^["']|["']$/g, '');
            if (raw === 'дата' || raw === 'date') return 'date';
            if (raw === '№' || raw === 'номер' || raw === 'order' || raw === 'n' || raw === 'no') return 'order';
            if (raw === 'заявка' || raw === 'claim' || raw === 'task' || raw === 'ticket') return 'task';
            if (raw === 'тип' || raw === 'tasktype' || raw === 'type') return 'taskType';
            if (raw === 'время' || raw === 'time') return 'time';
            if (raw === 'адрес' || raw === 'address') return 'address';
            if (raw === 'старт' || raw === 'start') return 'start';
            if (raw === 'возврат' || raw === 'return') return 'return';
            return raw;
        };

        /** Нормализация строки даты в формат YYYY-MM-DD */
        const normalizeDateStr = (val) => {
            if (!val) return '';
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const dmY = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (dmY) {
                return `${dmY[3]}-${dmY[2].padStart(2, '0')}-${dmY[1].padStart(2, '0')}`;
            }
            return s;
        };

        /** Нормализация номера телефона (строго 11 цифр, начиная с 7) */
        const normalizePhone = (raw) => {
            if (!raw) return '';
            let digits = String(raw).replace(/\D/g, '');
            if (digits.length === 11 && (digits.startsWith('7') || digits.startsWith('8'))) {
                digits = '7' + digits.slice(1);
            } else if (digits.length === 10) {
                digits = '7' + digits;
            }
            return digits.slice(0, 11);
        };

        /** Форматирование номера телефона в корпоративную маску +7 ХХХ ХХХ ХХ ХХ */
        const formatPhoneMask = (raw) => {
            if (!raw) return '';
            let digits = String(raw).replace(/\D/g, '');
            if (digits.startsWith('8')) digits = '7' + digits.slice(1);
            if (!digits.startsWith('7')) digits = '7' + digits;
            digits = digits.slice(0, 11);

            let res = '+7';
            if (digits.length > 1) {
                res += ' ' + digits.slice(1, Math.min(4, digits.length));
            }
            if (digits.length > 4) {
                res += ' ' + digits.slice(4, Math.min(7, digits.length));
            }
            if (digits.length > 7) {
                res += ' ' + digits.slice(7, Math.min(9, digits.length));
            }
            if (digits.length > 9) {
                res += ' ' + digits.slice(9, 11);
            }
            return res;
        };

        /** Нормализация ПИН-кода (ровно 4 цифры) */
        const normalizePin = (raw) => {
            if (!raw) return '';
            return String(raw).replace(/\D/g, '').slice(0, 4);
        };

        /** Получить ключ YYYY-MM предыдущего календарного месяца */
        const getPrevMonthKey = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            const prevYear = m === 1 ? y - 1 : y;
            const prevMonth = m === 1 ? 12 : m - 1;
            return `${prevYear}-${String(prevMonth).padStart(2, '0')}`;
        };

        /** Расчет итогов месяца (одометр, остатки, расход) */
        const getMonthSummary = (monthData, activeNorm) => {
            const odomStart = Number(monthData.odometerStart) || 0;
            const fuelStart = Number(monthData.fuelStart) || 0;
            const workdays = monthData.workdays || {};
            const workdayKeys = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalRefuels = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const norm = Number(activeNorm) || 0;
            const totalFuelUsed = norm > 0 ? (totalKm * norm / 100) : 0;
            const fuelEnd = fuelStart + totalRefuels - totalFuelUsed;

            let odomEnd = odomStart;
            if (workdayKeys.length > 0) {
                const lastKey = workdayKeys[workdayKeys.length - 1];
                odomEnd = Number(workdays[lastKey].odometerEnd) || (odomStart + totalKm);
            } else {
                odomEnd = odomStart;
            }

            return {
                odometerStart: odomStart,
                fuelStart: Number(fuelStart.toFixed(3)),
                odometerEnd: Number(odomEnd.toFixed(2)),
                fuelEnd: Number(fuelEnd.toFixed(3)),
                totalKm: Number(totalKm.toFixed(2)),
                totalFuelUsed: Number(totalFuelUsed.toFixed(3)),
                workdaysCount: workdayKeys.length
            };
        };

        /** Универсальный вызов Google Apps Script Web App (строго text/plain для обхода CORS) */
        const callGoogleScript = async (url, action, payload = {}) => {
            const targetUrl = url || DEFAULT_GOOGLE_SCRIPT_URL;
            const body = JSON.stringify({ action, ...payload });
            const res = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: body
            });
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }
            const data = await res.json();
            return data;
        };

        /** Пересчёт цепочки рабочих дней месяца */
        const recalcWorkdays = (workdays, odometerStart, fuelStart, refuels, activeNorm) => {
            const sortedKeys = Object.keys(workdays).sort();
            const refuelMap = {};
            refuels.forEach(r => {
                if (!refuelMap[r.date]) refuelMap[r.date] = 0;
                refuelMap[r.date] += Number(r.liters) || 0;
            });

            let odom = Number(odometerStart) || 0;
            let fuel = Number(fuelStart)     || 0;
            const updated = {};

            sortedKeys.forEach(dateKey => {
                const day = { ...workdays[dateKey] };
                const refuelToday = refuelMap[dateKey] || 0;
                const km = Number(day.tripKm) || 0;
                const norm = Number(activeNorm) || 0;

                day.odometerStart = odom;
                day.fuelStart     = fuel + refuelToday;  // заправка учитывается утром дня
                day.odometerEnd   = odom + km;
                day.fuelEnd       = day.fuelStart - (norm > 0 ? (km * norm / 100) : 0);

                if (day.isWorkday) {
                    odom = day.odometerEnd;
                    fuel = day.fuelEnd;
                } else {
                    // В нерабочий день одометр и остаток не меняются,
                    // но заправка в такой день всё равно делает день рабочим (обработано снаружи)
                    fuel = fuel + refuelToday;
                }
                updated[dateKey] = day;
            });
            return updated;
        };

        /* ═══════════════════════════════════════════════════
           5. ИНЛАЙН SVG-ИКОНКИ
        ═══════════════════════════════════════════════════ */
        const IconSettings = ({ size = 20, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                 strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="3"/>

                    const buf = await file.arrayBuffer();
                    const wb  = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);

                    // Ищем вкладку «Карточка сотрудника»
                    let ws = wb.getWorksheet('Карточка сотрудника');
                    if (!ws) ws = wb.worksheets[0]; // запасной вариант

                    if (!ws) { alert('Не удалось найти лист «Карточка сотрудника»'); return; }

                    // Читаем ячейки колонки C согласно спецификации
                    const get = (row) => cellValue(ws.getCell(`C${row}`));

                    onChange({
                        ...profile,
                        fullName:      get(2),
                        position:      get(3),
                        organization:  get(4),
                        normSummer:    get(5),
                        normWinter:    get(6),
                        // C7 — пустая строка, пропускаем
                        carBrand:      get(8),
                        carPlate:      get(9),
                        driverLicense: get(10),
                        fuelType:      get(11),

                    alert('Ошибка чтения файла: ' + err.message);

                            </div>

                            {/* Удостоверение № и Горючее — рядом */}
                            <div>
                                <label className={labelClass}>Удостоверение №</label>
                                <input
                                    type="text"
                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors focus:outline-none focus:ring-2 ${inputClass}`}
                                    value={profile.driverLicense || ''}
                                    onChange={e => onChange({ ...profile, driverLicense: e.target.value }, true)}
                                />
                            </div>
                            <div>
                                <label className={labelClass}>Горючее</label>
                                <select
                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors focus:outline-none focus:ring-2 ${inputClass}`}
                                    value={profile.fuelType || 'АИ-95'}
                                    onChange={e => onChange({ ...profile, fuelType: e.target.value }, true)}
                                >
                                    <option>АИ-95</option>
                                    <option>АИ-92</option>
                                    <option>ДТ</option>
                                </select>
                            </div>

                            {/* Точка старта — sm:col-span-2 */}
                            <div className="sm:col-span-2">
                                <label className={labelClass}>
                                    <span className="flex items-center gap-1">
                                        <IconMapPin size={12} /> Точка старта (базовый адрес)
                                    </span>
                                </label>
                                <input
                                    type="text"
                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border transition-colors focus:outline-none focus:ring-2 ${inputClass}`}
                                    placeholder="Адрес начала и конца каждого маршрута"
                                    value={profile.startPoint || ''}
                                    onChange={e => onChange({ ...profile, startPoint: e.target.value }, true)}
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           7.1. КОМПОНЕНТ: СТРОКА ЗАПРАВКИ (ТОЧНОСТЬ ДО 3 ЗНАКОВ)
        ═══════════════════════════════════════════════════ */
        const RefuelItem = ({ r, idx, totalDays, year, month, updateRefuel, removeRefuel, inputSm }) => {
            const [litersStr, setLitersStr] = useState(() => (
                r.liters !== undefined && r.liters !== null && r.liters !== '' ? formatFuel(r.liters) : ''
            ));

            useEffect(() => {
                setLitersStr(
                    r.liters !== undefined && r.liters !== null && r.liters !== '' ? formatFuel(r.liters) : ''
                );
            }, [r.liters]);

            return (
                <div className="flex items-center gap-2">
                    {/* Дата — выпадающий список с числами месяца */}
                    <select
                        className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                        value={parseDate(r.date || toDateStr(year, month, 1)).day}
                        onChange={e => {
                            const day = Number(e.target.value);
                            updateRefuel(idx, 'date', toDateStr(year, month, day));
                        }}
                    >
                        {Array.from({ length: totalDays }, (_, i) => i + 1).map(d => (
                            <option key={d} value={d}>{d} {MONTH_NAMES_GEN[month]}</option>
                        ))}
                    </select>
                    {/* Литры — строковый ввод с форматированием до 3 знаков при потере фокуса */}
                    <input
                        type="text"
                        inputMode="decimal"
                        className={`w-28 p-2 text-[16px] sm:text-sm rounded border text-center ${inputSm}`}
                        placeholder="0.000"
                        value={litersStr}
                        onChange={e => {
                            setLitersStr(e.target.value);
                            const val = parseFuelInput(e.target.value);
                            updateRefuel(idx, 'liters', val);
                        }}
                        onBlur={() => {
                            const val = parseFuelInput(litersStr);
                            setLitersStr(val > 0 ? formatFuel(val) : (litersStr.trim() === '' ? '' : '0.000'));
                            updateRefuel(idx, 'liters', val);
                        }}
                    />
                    <span className="text-xs opacity-50">л</span>
                    <button
                        type="button"
                        onClick={() => removeRefuel(idx)}
                        className="p-2 min-h-[36px] rounded text-red-400 hover:text-red-600 transition-colors"
                        aria-label="Удалить заправку"
                    >
                        <IconTrash size={16} />
                    </button>
                </div>
            );
        };

        /* ═══════════════════════════════════════════════════
           8. КОМПОНЕНТ: НАСТРОЙКА МЕСЯЦА + РАБОЧИЕ ДНИ
        ═══════════════════════════════════════════════════ */
        const MonthSetup = ({ monthData, profile, onUpdate, allMonths, onUpdateAllMonths, onPullPrevMonth, onSaveMonthCloud, cloudStatus, userPhone, t }) => {

            const year  = monthData.year;
            const month = monthData.month;
            const totalDays = daysInMonth(year, month);
            const prevKey = getPrevMonthKey(year, month);
            const [pYear, pMonth] = prevKey.split('-').map(Number);
            const prevMonthName = `${MONTH_NAMES[pMonth]} ${pYear}`;

            /* ---- Автосезон ---- */
            const autoSeason  = getSeason(year, month);
            const activeSeason = monthData.seasonOverride || autoSeason;
            const activeNorm   = activeSeason === 'summer'
                ? (Number(profile.normSummer) || 0)
                : (Number(profile.normWinter) || 0);

            /* ---- Локальное строковое состояние для ввода остатка топлива на начало ---- */
            const [fuelStartStr, setFuelStartStr] = useState(() => (
                monthData.fuelStart !== undefined && monthData.fuelStart !== null && monthData.fuelStart !== ''
                    ? formatFuel(monthData.fuelStart)
                    : ''
            ));

            /* ---- Состояние раскрытого дня для просмотра и редактирования маршрута ---- */
            const [expandedDayKey, setExpandedDayKey] = useState(null);

            useEffect(() => {
                if (document.activeElement?.id !== 'input-fuel-start') {
                    setFuelStartStr(
                        monthData.fuelStart !== undefined && monthData.fuelStart !== null && monthData.fuelStart !== ''
                            ? formatFuel(monthData.fuelStart)
                            : ''
                    );
                }
            }, [monthData.fuelStart, year, month]);

            /* ---- Вспомогалки обновления состояния ---- */
            const update = (patch) => onUpdate({ ...monthData, ...patch }, true);

            const updateWorkdays = (newWd) => {
                const recalced = recalcWorkdays(
                    newWd,
                    monthData.odometerStart,
                    monthData.fuelStart,
                    monthData.refuels,
                    activeNorm
                );
                update({ workdays: recalced });
            };

            /* ---- Обеспечение наличия workdays для всех дней месяца ---- */
            const ensureWorkdays = () => {
                const wd = { ...(monthData.workdays || {}) };
                for (let d = 1; d <= totalDays; d++) {
                    const key = toDateStr(year, month, d);
                    if (!wd[key]) {
                        wd[key] = {
                            isWorkday:     false,
                            tripKm:        0,
                            odometerStart: 0,
                            odometerEnd:   0,
                            fuelStart:     0,
                            fuelEnd:       0,
                            trips:         [],
                        };
                    }
                }
                return wd;
            };

            /* ---- Переключение рабочего дня ---- */
            const toggleWorkday = (dateKey) => {
                const wd = ensureWorkdays();
                // Нельзя снять флаг если в этот день есть заправка
                const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                if (hasRefuel && wd[dateKey].isWorkday) return; // заправочный день всегда рабочий
                wd[dateKey] = { ...wd[dateKey], isWorkday: !wd[dateKey].isWorkday };
                updateWorkdays(wd);
            };

            /* ---- Изменение пробега дня ---- */
            const setDayKm = (dateKey, km) => {
                const wd = ensureWorkdays();
                wd[dateKey] = { ...wd[dateKey], tripKm: Number(km) || 0 };
                updateWorkdays(wd);
            };

            /* ---- Редактирование промежуточных точек маршрута дня ---- */
            const addDayTrip = (dateKey) => {
                const wd = ensureWorkdays();
                const curTrips = Array.isArray(wd[dateKey]?.trips) ? [...wd[dateKey].trips] : [];
                curTrips.push({
                    order: curTrips.length + 1,
                    address: '',
                    time: '',
                    taskType: ''
                });
                wd[dateKey] = { ...wd[dateKey], isWorkday: true, trips: curTrips };
                updateWorkdays(wd);
            };

            const updateDayTrip = (dateKey, tripIdx, field, val) => {
                const wd = ensureWorkdays();
                const curTrips = Array.isArray(wd[dateKey]?.trips) ? [...wd[dateKey].trips] : [];
                if (curTrips[tripIdx]) {
                    curTrips[tripIdx] = { ...curTrips[tripIdx], [field]: val };
                    wd[dateKey] = { ...wd[dateKey], trips: curTrips };
                    updateWorkdays(wd);
                }
            };

            const removeDayTrip = (dateKey, tripIdx) => {
                const wd = ensureWorkdays();
                const curTrips = (Array.isArray(wd[dateKey]?.trips) ? wd[dateKey].trips : [])
                    .filter((_, i) => i !== tripIdx)
                    .map((pt, i) => ({ ...pt, order: i + 1 }));
                wd[dateKey] = { ...wd[dateKey], trips: curTrips };
                updateWorkdays(wd);
            };

            /* ---- Таблица заправок ---- */
            const addRefuel = () => {
                const refuels = [...(monthData.refuels || [])];
                // День по умолчанию — 1-е число
                const defaultDate = toDateStr(year, month, 1);
                refuels.push({ date: defaultDate, liters: 0 });
                // Автоматически делаем день рабочим
                const wd = ensureWorkdays();
                wd[defaultDate] = { ...wd[defaultDate], isWorkday: true };
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const removeRefuel = (idx) => {
                const refuels = (monthData.refuels || []).filter((_, i) => i !== idx);
                const wd = ensureWorkdays();
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            const updateRefuel = (idx, field, val) => {
                const refuels = (monthData.refuels || []).map((r, i) => {
                    if (i !== idx) return r;
                    const updated = { ...r, [field]: val };
                    return updated;
                });
                // Если поменялась дата — проверяем автоматический рабочий день
                const wd = ensureWorkdays();
                refuels.forEach(r => { if (r.date) wd[r.date] = { ...wd[r.date], isWorkday: true }; });
                const recalced = recalcWorkdays(wd, monthData.odometerStart, monthData.fuelStart, refuels, activeNorm);
                update({ refuels, workdays: recalced });
            };

            /* ---- Импорт поездок из JSON/CSV (поддержка выгрузки из «Маршрутов» routes_all.csv) ---- */
            const handleImportRoutes = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        let text = ev.target.result;
                        if (!text) {
                            alert('Выбранный файл пуст.');
                            return;
                        }

                        // 1. Снимаем UTF-8 BOM
                        text = text.replace(/^\uFEFF/, '');
                        const groupedByDate = {}; // { 'YYYY-MM-DD': [ { order, taskType, time, address } ] }
                        let totalPointsCount = 0;

                        // Очищенный базовый адрес старта/финиша для исключения дублирования
                        const cleanStartPoint = (profile.startPoint || '').toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '');
                        const isStartPointAddr = (addr) => {
                            if (!cleanStartPoint || !addr) return false;
                            return String(addr).toLowerCase().replace(/[\s\u00A0.,/\\-]/g, '') === cleanStartPoint;
                        };

                        if (file.name.endsWith('.json')) {
                            // JSON формат
                            const parsed = JSON.parse(text);
                            if (Array.isArray(parsed)) {
                                parsed.forEach(item => {
                                    const d = normalizeDateStr(item.date || item.Date);
                                    const rawAddr = (item.address || item['Адрес'] || '').trim();
                                    if (d && rawAddr && !isStartPointAddr(rawAddr)) {
                                        if (!groupedByDate[d]) groupedByDate[d] = [];
                                        const ord = Number(item.order || item['№']) || (groupedByDate[d].length + 1);
                                        groupedByDate[d].push({
                                            order: ord,
                                            taskType: item.taskType || item.type || item['Тип'] || '',
                                            time: item.time || item['Время'] || '',
                                            address: rawAddr
                                        });
                                        totalPointsCount++;
                                    }
                                });
                            } else if (typeof parsed === 'object' && parsed !== null) {
                                Object.entries(parsed).forEach(([dKey, val]) => {
                                    const d = normalizeDateStr(dKey);
                                    if (!d) return;
                                    const pts = Array.isArray(val) ? val : (Array.isArray(val?.points) ? val.points : []);
                                    if (!groupedByDate[d]) groupedByDate[d] = [];
                                    pts.forEach(p => {
                                        const rawAddr = (p.address || p['Адрес'] || '').trim();
                                        if (rawAddr && !isStartPointAddr(rawAddr)) {
                                            const ord = Number(p.order || p['№']) || (groupedByDate[d].length + 1);
                                            groupedByDate[d].push({
                                                order: ord,
                                                taskType: p.taskType || p.type || p['Тип'] || '',
                                                time: p.time || p['Время'] || '',
                                                address: rawAddr
                                            });
                                            totalPointsCount++;
                                        }
                                    });
                                });
                            }
                        } else {
                            // CSV формат (routes_all.csv и др.)
                            const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                            if (rawLines.length === 0) {
                                alert('В файле CSV отсутствуют строки данных.');
                                return;
                            }

                            // 2. Автоопределение разделителя: точка с запятой ';' или запятая ','
                            const firstLine = rawLines[0];
                            const delimiter = firstLine.includes(';') ? ';' : ',';

                            // 3. Разбор заголовков с нормализацией (русские и английские варианты)
                            const headerCols = parseCsvLine(firstLine, delimiter);
                            const headers = headerCols.map(h => normalizeHeader(h));

                            // 4. Разбор строк поездок
                            for (let i = 1; i < rawLines.length; i++) {
                                const cols = parseCsvLine(rawLines[i], delimiter);
                                if (cols.length === 0 || cols.every(c => !c)) continue;

                                const row = {};
                                headers.forEach((h, colIdx) => {
                                    row[h] = cols[colIdx] !== undefined ? cols[colIdx] : '';
                                });

                                const rawDate = row.date;
                                if (!rawDate) continue;
                                const date = normalizeDateStr(rawDate);
                                if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;

                                const rawAddress = (row.address || '').trim();
                                if (!rawAddress) continue;

                                // Если адрес совпадает с profile.startPoint — пропускаем, так как старт/возврат закреплены динамически
                                if (isStartPointAddr(rawAddress)) {
                                    continue;
                                }

                                if (!groupedByDate[date]) {
                                    groupedByDate[date] = [];
                                }

                                const ord = Number(String(row.order).replace(/\D/g, '')) || (groupedByDate[date].length + 1);
                                groupedByDate[date].push({
                                    order: ord,
                                    taskType: row.taskType || row.task || '',
                                    time: row.time || '',
                                    address: rawAddress
                                });
                                totalPointsCount++;
                            }
                        }

                        // Сортировка точек внутри каждого дня по порядку № (order)
                        Object.keys(groupedByDate).forEach(d => {
                            groupedByDate[d].sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
                        });

                        const datesFound = Object.keys(groupedByDate);
                        if (datesFound.length === 0) {
                            alert('В файле не найдено строк с корректными датами поездок.');
                            return;
                        }

                        // Группировка дат по месяцам 'YYYY-MM'
                        const byMonth = {};
                        datesFound.forEach(d => {
                            const mKey = d.slice(0, 7);
                            if (!byMonth[mKey]) byMonth[mKey] = {};
                            byMonth[mKey][d] = groupedByDate[d];
                        });

                        const currentKey = `${year}-${String(month).padStart(2, '0')}`;
                        const otherMonthKeys = Object.keys(byMonth).filter(k => k !== currentKey);

                        // Применение данных: обновляем месяцы в общем хранилище
                        if (typeof onUpdateAllMonths === 'function') {
                            onUpdateAllMonths(prevMonths => {
                                const updatedMonths = { ...prevMonths };
                                Object.entries(byMonth).forEach(([mKey, daysMap]) => {
                                    const [y, m] = mKey.split('-').map(Number);
                                    const mData = updatedMonths[mKey] ? { ...updatedMonths[mKey] } : {
                                        year: y,
                                        month: m,
                                        seasonOverride: null,
                                        odometerStart: 0,
                                        fuelStart: 0,
                                        refuels: [],
                                        workdays: {}
                                    };
                                    const totDays = daysInMonth(y, m);
                                    const wd = { ...(mData.workdays || {}) };
                                    for (let dayNum = 1; dayNum <= totDays; dayNum++) {
                                        const dayKey = toDateStr(y, m, dayNum);
                                        if (!wd[dayKey]) {
                                            wd[dayKey] = {
                                                isWorkday: false,
                                                tripKm: 0,
                                                odometerStart: 0,
                                                odometerEnd: 0,
                                                fuelStart: 0,
                                                fuelEnd: 0,
                                                trips: []
                                            };
                                        }
                                    }
                                    Object.entries(daysMap).forEach(([dKey, pts]) => {
                                        if (wd[dKey]) {
                                            wd[dKey] = {
                                                ...wd[dKey],
                                                isWorkday: true,
                                                trips: pts
                                            };
                                        }
                                    });
                                    const season = mData.seasonOverride || getSeason(y, m);
                                    const norm = season === 'summer'
                                        ? (Number(profile.normSummer) || 0)
                                        : (Number(profile.normWinter) || 0);
                                    mData.workdays = recalcWorkdays(
                                        wd,
                                        mData.odometerStart,
                                        mData.fuelStart,
                                        mData.refuels || [],
                                        norm
                                    );
                                    updatedMonths[mKey] = mData;
                                });
                                return updatedMonths;
                            });
                        } else {
                            // Резервное локальное обновление только текущего месяца
                            const wd = ensureWorkdays();
                            if (byMonth[currentKey]) {
                                Object.entries(byMonth[currentKey]).forEach(([dKey, pts]) => {
                                    if (wd[dKey]) {
                                        wd[dKey] = {
                                            ...wd[dKey],
                                            isWorkday: true,
                                            trips: pts
                                        };
                                    }
                                });
                                updateWorkdays(wd);
                            }
                        }

                        // Информативное уведомление
                        let msg = `Маршруты успешно загружены (${totalPointsCount} точек, ${datesFound.length} дн.)!\n`;
                        if (byMonth[currentKey]) {
                            const curDays = Object.keys(byMonth[currentKey]).length;
                            const curPts = Object.values(byMonth[currentKey]).reduce((s, p) => s + p.length, 0);
                            msg += `• Текущий месяц (${MONTH_NAMES[month]} ${year}): ${curDays} дн., ${curPts} точек\n`;
                        } else {
                            msg += `• Внимание: в файле нет поездок за текущий месяц (${MONTH_NAMES[month]} ${year})\n`;
                        }
                        if (otherMonthKeys.length > 0) {
                            msg += '• Другие месяцы в файле:\n';
                            otherMonthKeys.sort().forEach(mk => {
                                const [oy, om] = mk.split('-').map(Number);
                                const oDays = Object.keys(byMonth[mk]).length;
                                const oPts = Object.values(byMonth[mk]).reduce((s, p) => s + p.length, 0);
                                msg += `  - ${MONTH_NAMES[om]} ${oy}: ${oDays} дн., ${oPts} точек\n`;
                            });
                            msg += 'Переключите месяц во вкладке, чтобы просмотреть их.';
                        }
                        alert(msg.trim());

                    } catch (err) {
                        alert('Ошибка разбора файла маршрутов: ' + (err?.message || err));
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file, 'utf-8');
            };

            /* ---- Подтянуть из истории браузера ---- */
            const pullFromHistory = () => {
                try {
                    const raw = localStorage.getItem('expert_app_route_history_v1');
                    if (!raw) { alert('История маршрутов не найдена в браузере'); return; }
                    const history = JSON.parse(raw);
                    const prefix  = `${year}-${String(month).padStart(2,'0')}-`;
                    const wd = ensureWorkdays();
                    let count = 0;
                    Object.entries(history).forEach(([dateKey, dayData]) => {
                        if (!dateKey.startsWith(prefix)) return;
                        if (!wd[dateKey]) return;
                        const points = Array.isArray(dayData.points) ? dayData.points : [];
                        wd[dateKey] = { ...wd[dateKey], isWorkday: true, trips: points };
                        count++;
                    });
                    if (count === 0) { alert('Нет маршрутов за выбранный месяц в истории браузера'); return; }
                    updateWorkdays(wd);
                    alert(`Подтянуто ${count} дн. из истории браузера`);
                } catch (err) {
                    alert('Ошибка чтения истории: ' + err.message);
                }
            };

            /* ---- Импорт входящих данных из прошлого отчёта ---- */
            const handleImportPrevMonth = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const buf = await file.arrayBuffer();
                    const wb  = new ExcelJS.Workbook();
                    await wb.xlsx.load(buf);

                    // Лист «Расчет» — ищем по имени без учета регистра и пробелов (с поддержкой буквы «ё»)
                    const ws = (wb.worksheets || []).find(s => {
                        const n = (s.name || '').trim().toLowerCase();
                        return n === 'расчет' || n === 'расчёт';
                    }) || wb.getWorksheet('Расчет') || wb.getWorksheet('Расчёт');

                    if (!ws) {
                        alert('Лист «Расчет» не найден в выбранном файле Excel. Проверьте правильность файла отчёта.');
                        return;
                    }

                    // Конечный одометр (odometerEnd): снизу вверх по строкам от 35 до 5 по колонке D.
                    // Первое найденное число > 0 (нерабочие дни в конце месяца пустые).
                    let odometerEnd = null;
                    for (let row = 35; row >= 5; row--) {
                        const val = extractNumericCell(ws.getCell('D' + row));
                        if (val !== null && val > 0) {
                            odometerEnd = Math.round(val);
                            break;
                        }
                    }

                    // Конечный остаток топлива (fuelEnd): снизу вверх по строкам от 35 до 5 по колонке J.
                    // Первое найденное число >= 0 (обычно J35), округлить до 3 знаков после запятой.
                    let fuelEnd = null;
                    for (let row = 35; row >= 5; row--) {
                        const val = extractNumericCell(ws.getCell('J' + row));
                        if (val !== null && val >= 0) {
                            fuelEnd = Number(val.toFixed(3));
                            break;
                        }
                    }

                    if (odometerEnd === null && fuelEnd === null) {
                        alert('Не удалось найти данные одометра (колонка D) и остатка топлива (колонка J) в строках 5–35 на листе «Расчет».');
                        return;
                    }
                    if (odometerEnd === null) {
                        alert('Не удалось найти конечный одометр в колонке D (строки 5–35) на листе «Расчет».');
                        return;
                    }
                    if (fuelEnd === null) {
                        alert('Не удалось найти конечный остаток топлива в колонке J (строки 5–35) на листе «Расчет».');
                        return;
                    }

                    // Применяем входящие данные в текущий месяц и пересчитываем цепочку рабочих дней
                    const wd = recalcWorkdays(
                        ensureWorkdays(),
                        odometerEnd,
                        fuelEnd,
                        monthData.refuels || [],
                        activeNorm
                    );
                    update({
                        odometerStart: odometerEnd,
                        fuelStart: fuelEnd,
                        workdays: wd
                    });

                    const odomFmt = odometerEnd.toLocaleString('ru-RU');
                    alert(`Загружено из прошлого отчёта: одометр ${odomFmt} км, остаток ${formatFuel(fuelEnd)} л`);
                } catch (err) {
                    alert('Ошибка чтения файла: ' + (err?.message || err));
                } finally {
                    e.target.value = '';
                }
            };

            /* ---- Общая статистика ---- */
            const workdays      = monthData.workdays || {};
            const workdayKeys   = Object.keys(workdays).filter(k => workdays[k].isWorkday).sort();
            const totalKm       = workdayKeys.reduce((s, k) => s + (Number(workdays[k].tripKm) || 0), 0);
            const totalFuelUsed = activeNorm > 0 ? (totalKm * activeNorm / 100) : 0;
            const totalRefuels  = (monthData.refuels || []).reduce((s, r) => s + (Number(r.liters) || 0), 0);
            const fuelEnd       = (Number(monthData.fuelStart) || 0) + totalRefuels - totalFuelUsed;

            /* ---- Дни месяца для таблицы ---- */
            const allDayKeys = Array.from({ length: totalDays }, (_, i) =>
                toDateStr(year, month, i + 1)
            );

            /* ---- Классы полей ---- */
            const inputSm = t(
                'bg-[#1E2125] border-gray-700 text-white',
                'bg-white border-gray-300 text-gray-900',
                'bg-pink-50 border-pink-200 text-pink-900',
                'bg-blue-50 border-blue-200 text-blue-900',
                'bg-emerald-50 border-emerald-200 text-emerald-900',
                'bg-[#EFEBE9] border-[#D7CCC8] text-[#3E2723]',
                'bg-white border-gray-300 text-gray-900'
            );

            const cardClass = t(
                'bg-[#1E2125] border-[#3A3D42]',
                'bg-gray-50 border-gray-200',
                'bg-pink-50 border-pink-200',
                'bg-blue-50/50 border-blue-200',
                'bg-emerald-50 border-emerald-200',
                'bg-[#F5F2EE] border-[#D7CCC8]',
                'bg-gray-50 border-gray-200'
            );

            const accentClass = t(
                'text-[#FFB300]',
                'text-amber-700',
                'text-pink-600',
                'text-blue-600',
                'text-emerald-700',
                'text-[#5D4037]',
                'text-[#9A1B24]'
            );

            const btnPrimary = t(
                'bg-[#FFB300] text-black hover:bg-[#FFA000]',
                'bg-amber-600 text-white hover:bg-amber-700',
                'bg-pink-500 text-white hover:bg-pink-600',
                'bg-blue-600 text-white hover:bg-blue-700',
                'bg-emerald-600 text-white hover:bg-emerald-700',
                'bg-[#6D4C41] text-white hover:bg-[#5D4037]',
                'bg-[#C62828] text-white hover:bg-[#B71C1C]'
            );

            return (
                <div className="w-full space-y-4 animate-fade-in">

                    {/* ── Выбор месяца и года ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <div className="flex items-center justify-between mb-2">
                            <p className={`text-xs font-bold ${accentClass}`}>МЕСЯЦ ОТЧЁТА</p>
                            <button
                                type="button"
                                onClick={onSaveMonthCloud}
                                disabled={!userPhone || cloudStatus === 'syncing'}
                                className={`min-h-[36px] px-3 py-1 rounded text-xs font-bold flex items-center gap-1.5 transition-all ${
                                    !userPhone ? 'opacity-40 cursor-not-allowed bg-gray-600 text-white' : btnPrimary
                                }`}
                            >
                                <IconCloud size={14} />
                                <span>{cloudStatus === 'syncing' ? 'Сохранение...' : 'Сохранить месяц в таблицу'}</span>
                            </button>
                        </div>
                        <div className="flex gap-2">
                            <select
                                className={`flex-1 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                value={month}
                                onChange={e => {
                                    const m = Number(e.target.value);
                                    const override = monthData.seasonOverride;
                                    update({ month: m, seasonOverride: override });
                                }}
                            >
                                {MONTH_NAMES.slice(1).map((n, i) => (
                                    <option key={i+1} value={i+1}>{n}</option>
                                ))}
                            </select>
                            <select
                                className={`w-24 p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                value={year}
                                onChange={e => update({ year: Number(e.target.value) })}
                            >
                                {[2024, 2025, 2026, 2027, 2028].map(y => (
                                    <option key={y} value={y}>{y}</option>
                                ))}
                            </select>
                        </div>
                        {/* Сезонная норма */}
                        <div className="flex items-center gap-3 mt-3">
                            <span className="text-xs opacity-60">Сезон:</span>
                            <button
                                onClick={() => update({ seasonOverride: activeSeason === 'summer' ? 'winter' : 'summer' })}
                                className={`px-3 py-1 rounded text-xs font-bold ${btnPrimary}`}
                            >
                                {activeSeason === 'summer' ? '☀️ Лето' : '❄️ Зима'}
                            </button>
                            {monthData.seasonOverride && (
                                <button
                                    onClick={() => update({ seasonOverride: null })}
                                    className="text-xs opacity-50 underline"
                                >
                                    авто
                                </button>
                            )}
                            <span className="text-xs opacity-60 ml-auto">
                                норма: <strong>{activeNorm} л/100 км</strong>
                            </span>
                        </div>
                    </div>

                    {/* ── Входящие данные ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-2 ${accentClass}`}>ВХОДЯЩИЕ ДАННЫЕ</p>
                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label className="block text-xs opacity-60 mb-1">Одометр на начало (км)</label>
                                <input
                                    type="number"
                                    inputMode="decimal"
                                    className={`w-full p-2 text-[16px] sm:text-sm rounded border ${inputSm}`}
                                    value={monthData.odometerStart || ''}
                                    onChange={e => {
                                        const v = Number(e.target.value) || 0;
                                        const wd = recalcWorkdays(ensureWorkdays(), v, monthData.fuelStart, monthData.refuels || [], activeNorm);

                                    }}
                                    placeholder="0"
                                />
                            </div>
                            <div>
                                <label className="block text-xs opacity-60 mb-1">Остаток топлива на начало (л)</label>

                                    placeholder="0.000"

                                        const text = e.target.value;
                                        setFuelStartStr(text);
                                        const v = parseFuelInput(text);
                                        const wd = recalcWorkdays(ensureWorkdays(), monthData.odometerStart, v, monthData.refuels || [], activeNorm);

                                    }}

                                    'border-pink-300 text-pink-600 hover:bg-pink-50',
                                    'border-blue-300 text-blue-600 hover:bg-blue-50',

                                'border-pink-300 text-pink-600 hover:bg-pink-50',
                                'border-blue-300 text-blue-600 hover:bg-blue-50',
                                'border-emerald-300 text-emerald-700 hover:bg-emerald-50',
                                'border-[#A1887F] text-[#6D4C41] hover:bg-[#EFEBE9]',
                                'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'

                                <input type="file" accept=".xlsx" onChange={handleImportPrevMonth} className="hidden" />
                            </label>
                        </div>
                    </div>

                    {/* ── Таблица заправок ── */}

                            <button
                                onClick={addRefuel}
                                className={`min-h-[32px] px-3 py-1 rounded text-xs font-bold flex items-center gap-1 ${btnPrimary}`}

                                <IconPlus size={14} /> Добавить

                        </div>

                                {(monthData.refuels || []).map((r, idx) => (
                                    <RefuelItem
                                        key={idx}
                                        r={r}
                                        idx={idx}
                                        totalDays={totalDays}
                                        year={year}
                                        month={month}
                                        updateRefuel={updateRefuel}
                                        removeRefuel={removeRefuel}
                                        inputSm={inputSm}

                                ))}
                            </div>

                        </div>

                    {/* ── Импорт маршрутов ── */}

                        <p className={`text-xs font-bold mb-2 ${accentClass}`}>ИМПОРТ МАРШРУТОВ</p>
                        <div className="flex flex-col gap-2">
                            <label className={`min-h-[48px] p-2 rounded border border-dashed flex items-center justify-center gap-2 cursor-pointer text-xs font-bold ${t(
                                'border-[#FFB300]/30 text-[#FFB300]/70 hover:bg-[#282B30]',
                                'border-amber-300 text-amber-700 hover:bg-amber-50',
                                'border-pink-300 text-pink-600 hover:bg-pink-50',
                                'border-blue-300 text-blue-600 hover:bg-blue-50',
                                'border-emerald-300 text-emerald-700 hover:bg-emerald-50',
                                'border-[#A1887F] text-[#6D4C41] hover:bg-[#EFEBE9]',
                                'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'
                            )}`}>
                                <IconUpload size={14} />
                                <span>Загрузить routes_{year}-{String(month).padStart(2,'0')}.json / .csv</span>
                                <input type="file" accept=".json,.csv" onChange={handleImportRoutes} className="hidden" />
                            </label>
                            <button
                                onClick={pullFromHistory}
                                className={`min-h-[48px] p-2 rounded border border-dashed flex items-center justify-center gap-2 text-xs font-bold w-full ${t(
                                    'border-[#FFB300]/30 text-[#FFB300]/70 hover:bg-[#282B30]',
                                    'border-amber-300 text-amber-700 hover:bg-amber-50',
                                    'border-pink-300 text-pink-600 hover:bg-pink-50',
                                    'border-blue-300 text-blue-600 hover:bg-blue-50',
                                    'border-emerald-300 text-emerald-700 hover:bg-emerald-50',
                                    'border-[#A1887F] text-[#6D4C41] hover:bg-[#EFEBE9]',
                                    'border-[#C62828]/30 text-[#9A1B24] hover:bg-red-50'
                                )}`}
                            >
                                <IconHistory size={14} />
                                <span>Подтянуть из истории браузера (только чтение)</span>
                            </button>
                        </div>
                    </div>

                    {/* ── Таблица рабочих дней ── */}
                    <div className={`rounded-lg border p-3 ${cardClass}`}>
                        <p className={`text-xs font-bold mb-2 ${accentClass}`}>
                            РАБОЧИЕ ДНИ — {MONTH_NAMES[month]} {year}
                        </p>
                        <p className="text-xs opacity-50 mb-3">
                            1-е число может не быть рабочим. Входящие данные переходят на первый рабочий день.
                        </p>

                        {/* Шапка таблицы */}
                        <div className="grid gap-1 mb-1" style={{ gridTemplateColumns: '40px 1fr 80px 80px 80px 80px' }}>
                            {['День', 'Маршрут', 'Пробег (км)', 'Одометр', 'Остаток л', 'Расход л'].map(h => (
                                <div key={h} className="text-[10px] font-bold opacity-50 text-center">{h}</div>
                            ))}
                        </div>

                        <div className="space-y-1">
                            {allDayKeys.map(dateKey => {
                                const day = workdays[dateKey] || {
                                    isWorkday: false, tripKm: 0,
                                    odometerStart: 0, odometerEnd: 0,
                                    fuelStart: 0, fuelEnd: 0, trips: []
                                };
                                const hasRefuel = (monthData.refuels || []).some(r => r.date === dateKey);
                                const { day: d } = parseDate(dateKey);
                                const km   = Number(day.tripKm) || 0;
                                const norm = activeNorm;
                                const fuelSpent = norm > 0 ? (km * norm / 100) : 0;
                                const tripCount = (day.trips || []).length;

                                return (
                                    <div key={dateKey} className="rounded border border-current/10 transition-colors overflow-hidden">
                                        <div
                                            className={`grid gap-1 p-1 transition-colors ${
                                                day.isWorkday
                                                    ? t('bg-[#FFB300]/10', 'bg-amber-50', 'bg-pink-50', 'bg-blue-50', 'bg-emerald-50', 'bg-[#EFEBE9]', 'bg-red-50')
                                                    : 'opacity-50'
                                            }`}
                                            style={{ gridTemplateColumns: '40px 1fr 80px 80px 80px 80px' }}
                                        >
                                            {/* День + тоггл */}
                                            <button
                                                onClick={() => toggleWorkday(dateKey)}
                                                className={`w-9 h-9 min-h-[36px] rounded flex items-center justify-center text-sm font-black border transition-colors ${
                                                    day.isWorkday
                                                        ? t('bg-[#FFB300] text-black border-[#FFB300]', 'bg-amber-500 text-white border-amber-500', 'bg-pink-500 text-white border-pink-500', 'bg-blue-600 text-white border-blue-600', 'bg-emerald-600 text-white border-emerald-600', 'bg-[#6D4C41] text-white border-[#6D4C41]', 'bg-[#C62828] text-white border-[#C62828]')
                                                        : t('border-gray-700 text-gray-500', 'border-gray-300 text-gray-400', 'border-pink-200 text-pink-300', 'border-blue-200 text-blue-300', 'border-emerald-200 text-emerald-300', 'border-[#D7CCC8] text-[#A1887F]', 'border-gray-300 text-gray-400')
                                                } ${hasRefuel ? 'ring-2 ring-yellow-400' : ''}`}
                                                title={hasRefuel ? 'День с заправкой (всегда рабочий)' : (day.isWorkday ? 'Нажмите, чтобы снять' : 'Нажмите, чтобы сделать рабочим')}
                                            >
                                                {d}
                                            </button>

                                            {/* Маршрут (краткая инфо + клик для раскрытия цепочки) */}
                                            <div
                                                onClick={() => {
                                                    if (day.isWorkday) {
                                                        setExpandedDayKey(prev => prev === dateKey ? null : dateKey);
                                                    }
                                                }}
                                                className={`flex flex-col justify-center px-1 rounded transition-colors ${
                                                    day.isWorkday ? 'cursor-pointer hover:bg-black/5 dark:hover:bg-white/5' : ''
                                                }`}
                                                title={day.isWorkday ? (expandedDayKey === dateKey ? 'Свернуть маршрут дня' : 'Нажмите, чтобы раскрыть цепочку: Старт → Точки → Финиш') : ''}
                                            >
                                                <div className="flex items-center gap-1.5">
                                                    <span className="text-[10px] font-bold opacity-80">
                                                        {tripCount > 0 ? `${tripCount} промежуточн.` : 'Маршрут'}
                                                    </span>
                                                    {day.isWorkday && (
                                                        <span className="text-[10px] opacity-60">
                                                            {expandedDayKey === dateKey ? '▲' : '▼'}

                                                    )}
                                                </div>
                                                {day.isWorkday && (

                                                {day.isWorkday && km > 0 ? formatFuel(fuelSpent) : '—'}
                                            </div>

                                                        {(day.trips || []).map((trip, tIdx) => (

                                                                <span className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold bg-current/15 flex-shrink-0">

                                                                    type="text"

                                                                <button
                                                                    type="button"
                                                                    onClick={() => removeDayTrip(dateKey, tIdx)}

                                                                    <IconTrash size={14} />
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* 3. Последняя строка: ЗАКРЕПЛЁННЫЙ ФИНИШ (из profile.startPoint) */}
                                                <div className="flex items-center gap-2 p-1.5 rounded bg-blue-500/10 border border-blue-500/30">
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider bg-blue-500 text-white flex-shrink-0">
                                                        Финиш
                                                    </span>
                                                    <div className="flex-1 truncate">
                                                        {profile.startPoint ? (
                                                            <span className="font-medium text-blue-400 dark:text-blue-300">
                                                                {profile.startPoint}
                                                            </span>
                                                        ) : (
                                                            <span className="text-amber-500 font-bold italic">
                                                                ⚠ Укажите Точку старта в Карточке сотрудника
                                                            </span>
                                                        )}
                                                    </div>
                                                    <span className="text-[11px] opacity-50 px-1 select-none" title="Закреплено из Карточки сотрудника">🔒</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Итоги месяца */}
                        <div className={`mt-3 pt-3 border-t ${t('border-gray-700','border-gray-200','border-pink-200','border-blue-200','border-emerald-200','border-[#D7CCC8]','border-gray-200')}`}>
                            <div className="grid grid-cols-2 gap-2 text-xs">
                                <div className="opacity-60">Рабочих дней:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{workdayKeys.length}</div>
                                <div className="opacity-60">Общий пробег:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{totalKm.toFixed(0)} км</div>
                                <div className="opacity-60">Расход топлива:</div>
                                <div className={`font-bold text-right ${accentClass}`}>{formatFuel(totalFuelUsed)} л</div>
                                <div className="opacity-60">Итоговый остаток:</div>
                                <div className={`font-bold text-right ${fuelEnd < 0 ? 'text-red-500' : accentClass}`}>
                                    {formatFuel(fuelEnd)} л
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ── Кнопка сохранения месяца в Google Таблицу ── */}
